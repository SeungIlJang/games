/* ===== 모두의 픽셀모험 — 오리지널 턴제 RPG v2 (단일 파일, 캔버스 터치 조작) =====
   설계 패턴만 참고(상태머신·파티/클래스·아이템·상점·세이브). 전부 오리지널. */
const cv=document.getElementById('screen'), g=cv.getContext('2d');
const W=480,H=270,TILE=30, SAVE_KEY='three-seals-save-v2';
function resizeCanvas(){ const s=Math.min(window.innerWidth/W, window.innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
addEventListener('resize',resizeCanvas); resizeCanvas();

/* ---------- 입력: 키보드 + 캔버스 탭(핫스폿) ---------- */
const keys={}, pressed={};
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyZ:'confirm',Enter:'confirm',Space:'confirm',KeyX:'cancel',Escape:'cancel'};
function setKey(k,d){ if(!k) return; if(d&&!keys[k]) pressed[k]=true; keys[k]=d; }
addEventListener('keydown',e=>{const k=KEYMAP[e.code]; if(k){e.preventDefault(); setKey(k,true);}});
addEventListener('keyup',  e=>{const k=KEYMAP[e.code]; if(k){e.preventDefault(); setKey(k,false);}});
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

let hotspots=[];
function hz(x,y,w,h,fn){ hotspots.push({x,y,w,h,fn}); }
function canvasPt(cx,cy){ const r=cv.getBoundingClientRect(); return { x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height) }; }
let mouseDown=false, joy={active:false,ox:0,oy:0,x:0,y:0,moved:false,tx:0,ty:0}, joyDir=null;
function onDown(p){
  resumeAudio();
  if(!bgm.started){ bgm.started=true; playBGM(state==='battle'?'battle':'field'); }
  for(let i=hotspots.length-1;i>=0;i--){ const h=hotspots[i];
    if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){ h.fn(); return; } }
  if(state==='field'&&!msg){ joy.active=true; joy.ox=joy.x=p.x; joy.oy=joy.y=p.y; joy.moved=false; joyDir=null;
    joy.tx=Math.floor((p.x+camOX)/TILE); joy.ty=Math.floor((p.y+camOY)/TILE); }
}
function onMove(p){ if(!joy.active) return; joy.x=p.x; joy.y=p.y;
  const dx=p.x-joy.ox, dy=p.y-joy.oy; if(Math.hypot(dx,dy)>9){ joy.moved=true;
    joyDir=Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); } else joyDir=null; }
function onUp(){ if(joy.active){ if(!joy.moved&&state==='field'&&!msg) tryInteractAt(joy.tx,joy.ty); joy.active=false; joyDir=null; } }
cv.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onDown(canvasPt(t.clientX,t.clientY)); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onMove(canvasPt(t.clientX,t.clientY)); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); onUp(); },{passive:false});
cv.addEventListener('touchcancel',e=>{ e.preventDefault(); onUp(); },{passive:false});
cv.addEventListener('mousedown',e=>{ mouseDown=true; onDown(canvasPt(e.clientX,e.clientY)); });
cv.addEventListener('mousemove',e=>{ if(mouseDown) onMove(canvasPt(e.clientX,e.clientY)); });
addEventListener('mouseup',e=>{ if(mouseDown){ mouseDown=false; onUp(); } });

/* ---------- 효과음 (WebAudio, 전부 합성음) ---------- */
let actx=null;
function resumeAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function sfx(type){ try{ if(!actx) return; const o=actx.createOscillator(), ga=actx.createGain();
  o.connect(ga); ga.connect(actx.destination); const t=actx.currentTime;
  let f=440,d=0.08,w='square';
  if(type==='hit'){f=170;d=0.09;w='square';} else if(type==='heal'){f=680;d=0.14;w='sine';}
  else if(type==='sel'){f=520;d=0.04;w='triangle';} else if(type==='win'){f=820;d=0.3;w='sine';}
  else if(type==='down'){f=120;d=0.18;w='sawtooth';} else if(type==='coin'){f=980;d=0.08;w='square';}
  o.type=w; o.frequency.value=f; ga.gain.setValueAtTime(0.06,t); ga.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.start(t); o.stop(t+d);
}catch(e){} }
/* ---------- BGM (합성 멜로디, 전부 오리지널) ---------- */
let bgm={timer:null,kind:null,step:0,muted:false,started:false};
const SONGS={
  field:{tempo:300, mel:[64,67,69,67, 71,69,67,64, 62,64,67,64, 67,69,71,0], bass:[52,52,45,45, 47,47,43,43]},
  battle:{tempo:205, mel:[57,60,62,60, 64,62,60,57, 55,58,60,58, 60,62,64,0], bass:[45,45,43,43, 41,41,40,40]},
};
function nf(n){ return n>0?440*Math.pow(2,(n-69)/12):0; }
function tone(f,type,gain,dur){ try{ if(!actx||f<=0) return; const o=actx.createOscillator(),g2=actx.createGain(); o.type=type; o.frequency.value=f; o.connect(g2); g2.connect(actx.destination); const t=actx.currentTime; g2.gain.setValueAtTime(gain,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur); }catch(e){} }
function stopBGM(){ if(bgm.timer){ clearInterval(bgm.timer); bgm.timer=null; } }
function playBGM(kind){ bgm.kind=kind; stopBGM(); if(bgm.muted||!actx) return; const s=SONGS[kind]; if(!s) return; bgm.step=0;
  bgm.timer=setInterval(()=>{ if(bgm.muted||bgm.kind!==kind) return; const st=bgm.step, m=s.mel[st%s.mel.length], b=s.bass[st%s.bass.length];
    tone(nf(m),'triangle',0.03,s.tempo/1000*0.85); if(st%2===0) tone(nf(b),'sine',0.028,s.tempo/1000*1.6); bgm.step++; }, s.tempo); }
function toggleMute(){ bgm.muted=!bgm.muted; if(bgm.muted) stopBGM(); else playBGM(bgm.kind||'field'); }

function joinMember(key){ if(!MK[key]||party.some(p=>p.name===key)) return false; const p=MK[key]();
  const tgt=party.reduce((m,q)=>Math.max(m,q.lv),1); while(p.lv<tgt) levelUp(p); party.push(p); return true; }

function atkOf(p){ return p.atk + (p.weapon&&EQUIP[p.weapon]?EQUIP[p.weapon].atk:0); }
function defOf(p){ return p.def + (p.armor&&EQUIP[p.armor]?EQUIP[p.armor].def:0); }
function equip(p,id){ const e=EQUIP[id]; if(!e||(inventory[id]||0)<=0) return; const old=p[e.slot];
  inventory[id]--; if(old) inventory[old]=(inventory[old]||0)+1; p[e.slot]=id; sfx('sel'); }
function invCount(){ return invList().reduce((s,k)=>s+inventory[k],0); }
function firstDead(){ return party.findIndex(p=>!p.alive); }

/* ---------- 세이브 ---------- */
function saveGame(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(
  {party,area:cur?cur.id:'village',player:{x:player.x,y:player.y,dir:player.dir},gold,inventory,sealsFixed,bossStage,chests,flags:storyFlags})); return true; }catch(e){ return false; } }
function loadGame(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!d) return false;
  party=d.party; gold=d.gold||0; inventory=d.inventory||{potion:1}; sealsFixed=d.sealsFixed==null?3:d.sealsFixed; bossStage=d.bossStage||0; chests=d.chests||{}; storyFlags=d.flags||{};
  const area=d.area||'village', px=(d.player&&d.player.x)||3, py=(d.player&&d.player.y)||3, dir=(d.player&&d.player.dir)||'down';
  player={x:px,y:py,dir,px:px*TILE,py:py*TILE,moving:false,steps:0};
  loadArea(area,px,py,dir); return true; }catch(e){ return false; } }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

function btn(x,y,w,h,label,fn,o){ o=o||{};
  g.fillStyle=o.bg||'rgba(27,34,54,.96)'; g.fillRect(x,y,w,h);
  g.strokeStyle=o.bd||'#30406a'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  g.fillStyle=o.fg||'#cdd6ea'; g.font=o.font||'12px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(label,x+w/2,y+h/2); g.textAlign='left'; g.textBaseline='alphabetic';
  if(fn) hz(x,y,w,h,fn); }
function bar(x,y,w,h,r,c){ g.fillStyle='#232b40'; g.fillRect(x,y,w,h); g.fillStyle=c; g.fillRect(x,y,Math.max(0,w*clamp(r,0,1)),h); }

  const bw=s*0.5,bx=x+(s-bw)/2; g.fillStyle=color; g.fillRect(bx,y+s*0.42,bw,s*0.46);
  const hw=s*0.44,hx=x+(s-hw)/2; g.fillStyle='#f2d6b8'; g.fillRect(hx,y+s*0.05,hw,s*0.38);
  g.fillStyle='#223'; const ey=y+s*0.2,es=Math.max(2,s*0.09); g.fillRect(hx+hw*0.18,ey,es,es); g.fillRect(hx+hw*0.62,ey,es,es); }

function drawHeroField(x,y,p){ const sp=p.alive&&HEROPX[p.cls];
  if(sp){ const px=sp.px, w=Math.max.apply(null,sp.rows.map(r=>r.length))*px, h=sp.rows.length*px;
    g.fillStyle='#0007'; g.beginPath(); g.ellipse(x+TILE/2,y+TILE-3,TILE*0.3,TILE*0.13,0,0,7); g.fill();
    drawPixSprite(sp.rows,sp.pal, Math.round(x+(TILE-w)/2), Math.round(y+TILE-h), px); }
  else chibi(x,y,p.alive?p.color:'#888'); }
function drawHeroBattle(cx,cy,p,sc){ const sp=HEROPX[p.cls]; if(!sp){ heroBack(cx,cy,p,sc); return; }
  const rows=sp.battle||sp.rows, px=3, w=Math.max.apply(null,rows.map(r=>r.length))*px, h=rows.length*px, s=TILE*sc, feet=cy+s*0.4;
  g.fillStyle='#0007'; g.beginPath(); g.ellipse(cx,feet-1,s*0.34,s*0.13,0,0,7); g.fill();
  drawPixSprite(rows, sp.pal, Math.round(cx-w/2), Math.round(feet-h), px); }

function fieldTap(p){ const tx=Math.floor((p.x+camOX)/TILE), ty=Math.floor((p.y+camOY)/TILE);
  if(tryInteractAt(tx,ty)) return;
  const dx=tx-player.x, dy=ty-player.y; if(!dx&&!dy) return;
  fieldMove = Math.abs(dx)>=Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }
function updateField(){ if(msg) return;
  if(!player.moving){ let dir=null;
    for(const d of ['up','down','left','right']) if(keys[d]){ dir=d; break; }
    if(!dir&&joyDir) dir=joyDir;
    if(!dir&&fieldMove) dir=fieldMove; fieldMove=null;
    if(dir){ player.dir=dir; const[dx,dy]=DIRV[dir],nx=player.x+dx,ny=player.y+dy, tn=tile(nx,ny);
      if(tn!=='1'&&tn!=='9'&&!npcAt(nx,ny)){ player.x=nx; player.y=ny; player.moving=true; } }
    if(consume('confirm')) tryInteractFacing();
    if(consume('cancel')){ state='menu'; menuMode='party'; menuSel=0; } }
  if(player.moving){ const tx=player.x*TILE,ty=player.y*TILE,sp=2.5;
    if(player.px<tx) player.px=Math.min(player.px+sp,tx); else if(player.px>tx) player.px=Math.max(player.px-sp,tx);
    if(player.py<ty) player.py=Math.min(player.py+sp,ty); else if(player.py>ty) player.py=Math.max(player.py-sp,ty);
    if(player.px===tx&&player.py===ty){ player.moving=false; player.steps++; onStep(); } } }

function nextAlive(a,i){ for(let k=1;k<=a.length;k++){const j=(i+k)%a.length; if(a[j]&&a[j].alive) return j;} return i; }
function prevAlive(a,i){ for(let k=1;k<=a.length;k++){const j=(i-k+a.length)%a.length; if(a[j]&&a[j].alive) return j;} return i; }
function nextDead(i){ for(let k=1;k<=party.length;k++){const j=(i+k)%party.length; if(!party[j].alive) return j;} return i; }

function enemyPos(i){ const n=battle.enemies.length, startX=150-(n-1)*36; return {x:startX+i*72, y:96+(i%2)*14}; }
function partyPos(i){ const n=Math.max(1,party.length), gap=102, startX=W/2-(n-1)*gap/2, ys=[186,176,176,186]; return {x:startX+i*gap, y:ys[i]!=null?ys[i]:181}; }
function pop(x,y,text,color){ pops.push({x,y,text,color,t:46}); }
function popE(t,txt){ const e=enemyPos(battle.enemies.indexOf(t)); pop(e.x,e.y-14,txt,txt[0]==='+'?'#8fdc6e':'#ff8a6a'); if(txt[0]!=='+') shakeHit(parseInt(txt.slice(1))||3); }

function spawnFx(x,y,kind,color){ fx.push({x,y,kind,color:color||'#fff',t:16,max:16}); }
function hitFx(t,kind,color){ const e=enemyPos(battle.enemies.indexOf(t)); spawnFx(e.x,e.y,kind,color); }
function e_die(t){ const e=enemyPos(battle.enemies.indexOf(t)); spawnFx(e.x,e.y,'burst','#ffd54a'); spawnFx(e.x,e.y-6,'burst','#fff'); }
function drawFx(){ for(const f of fx){ const p=f.t/f.max; g.globalAlpha=Math.max(0,p); g.lineWidth=2.5; g.strokeStyle=f.color;
    if(f.kind==='slash'){ const o=(1-p)*10; g.beginPath(); g.moveTo(f.x-12+o,f.y-10); g.lineTo(f.x+10+o,f.y+12); g.stroke(); g.beginPath(); g.moveTo(f.x+10,f.y-10); g.lineTo(f.x-12,f.y+12); g.stroke(); }

function nextInput(){ const b=battle; b.pending=null;
  b.inputIdx++; while(b.inputIdx<party.length&&!party[b.inputIdx].alive) b.inputIdx++;
  if(b.inputIdx>=party.length){ enemyPlan(); return; } setCmdDefault(); b.autoT=12; }
function battleBack(){ const b=battle;
  if(b.menu==='skill'||b.menu==='item') b.menu='cmd';
  else if(b.menu==='target') b.menu = b.pending&&b.pending.type==='skill'?'skill':(b.pending&&b.pending.type==='item'?'item':'cmd');
  else if(b.menu==='targetAlly'||b.menu==='targetDead') b.menu = b.pending&&b.pending.type==='item'?'item':'skill';
  else if(b.menu==='cmd'&&b.inputIdx>0){ b.actions.pop(); do{b.inputIdx--;}while(b.inputIdx>0&&!party[b.inputIdx].alive); b.menu='cmd'; b.cmd=0; } }
function chooseCommand(i){ const b=battle,p=party[b.inputIdx]; b.cmd=i; const c=CMDS[i]; sfx('sel'); if(p){ p.ai=p.ai||{}; p.ai.cmd=i; }
  if(c==='공격'){ b.pending={type:'attack'}; b.menu='target'; b.targetIdx=firstEnemy(); b.curX=null; }
  else if(c==='방어'){ pushA({actor:b.inputIdx,type:'guard'}); nextInput(); }
  else if(c==='도망'){ pushA({actor:b.inputIdx,type:'flee'}); nextInput(); }
  else if(c==='스킬'){ p.skills.length?(b.menu='skill',b.sub=(p.ai&&p.ai.skill!=null&&p.ai.skill<p.skills.length)?p.ai.skill:0):flashMsg('스킬 없음'); }
  else if(c==='아이템'){ invCount()>0?(b.menu='item',b.sub=0):flashMsg('아이템 없음'); } }
function chooseSkill(i){ const b=battle,p=party[b.inputIdx]; b.sub=i; const id=p.skills[i],s=SKILLS[id];
  if(p.mp<s.mp){ flashMsg('MP 부족'); return; } sfx('sel'); if(p){ p.ai=p.ai||{}; p.ai.cmd=1; p.ai.skill=i; } b.pending={type:'skill',skill:id};
  if(s.target==='allEnemies'||s.target==='allAllies'){ pushA({actor:b.inputIdx,...b.pending,target:-1}); nextInput(); }
  else if(s.target==='ally'){ b.menu='targetAlly'; b.targetIdx=firstAlly(); }
  else if(s.target==='allyDead'){ const d=firstDead(); d<0?flashMsg('대상 없음'):(b.menu='targetDead',b.targetIdx=d); }
  else { b.menu='target'; b.targetIdx=firstEnemy(); b.curX=null; } }
function chooseItem(i){ const b=battle,list=invList(),id=list[i]; if(!id) return; const it=ITEMS[id]; b.sub=i; sfx('sel');
  b.pending={type:'item',item:id};
  if(it.revive){ const d=firstDead(); d<0?flashMsg('대상 없음'):(b.menu='targetDead',b.targetIdx=d); }

function confirmTarget(i){ const b=battle; b.targetIdx=i; pushA({actor:b.inputIdx,...b.pending,target:i}); nextInput(); }
/* ---- 이전 선택 기억 + 자동모드 ---- */
let autoBattle=false;
function lowestEnemyIdx(){ let bi=-1,bh=1e18; battle.enemies.forEach((e,i)=>{ if(e.alive&&e.hp<bh){bh=e.hp;bi=i;} }); return bi<0?firstEnemy():bi; }
function lowestAllyIdx(){ let bi=-1,br=2; party.forEach((p,i)=>{ if(p.alive){ const r=p.hp/p.maxhp; if(r<br){br=r;bi=i;} } }); return bi<0?firstAlly():bi; }
function setCmdDefault(){ const b=battle,p=party[b.inputIdx]; b.menu='cmd'; b.cmd=(p&&p.ai&&p.ai.cmd!=null)?Math.min(p.ai.cmd,CMDS.length-1):0; b.sub=(p&&p.ai&&p.ai.skill!=null)?p.ai.skill:0; }
function autoAction(idx){ const p=party[idx], ai=p.ai||{};
  let cmd = ai.cmd!=null ? ai.cmd : ((p.cls==='검사'||p.cls==='척후')?0:1);
  if(CMDS[cmd]==='스킬' && p.skills.length){ const si=(ai.skill!=null&&ai.skill<p.skills.length)?ai.skill:0; const id=p.skills[si], s=SKILLS[id];
    if(s && p.mp>=s.mp){
      if(s.kind==='revive'){ const d=firstDead(); if(d>=0) return {actor:idx,type:'skill',skill:id,target:d}; }
      else if(s.kind==='heal'||s.kind==='healAll'){ const low=lowestAllyIdx(); if(low>=0 && party[low].hp/party[low].maxhp<0.92) return {actor:idx,type:'skill',skill:id,target:low}; }
      else { let tgt=-1; if(s.target==='enemy') tgt=lowestEnemyIdx(); else if(s.target==='ally') tgt=lowestAllyIdx(); return {actor:idx,type:'skill',skill:id,target:tgt}; }
    }
  }
  if(CMDS[cmd]==='방어') return {actor:idx,type:'guard'};
  return {actor:idx,type:'attack',target:lowestEnemyIdx()};
}
function toggleAuto(){ autoBattle=!autoBattle; sfx('sel'); if(autoBattle&&battle){ battle.menu='cmd'; battle.autoT=12; setCmdDefault(); } }
function dmgPhys(a,p,d){ return Math.max(1,Math.round(a*p-d*0.9+rnd(3)-1)); }
function dmgMag(m,p,d){ return Math.max(1,Math.round(m*p-d*0.4+rnd(3)-1)); }
function spdOf(a){ return (a.enemy!=null)?battle.enemies[a.enemy].spd+rnd(2):party[a.actor].spd+rnd(2); }
function enemyPlan(){ const b=battle; b.round=(b.round||0)+1;
  b.enemies.forEach((e,i)=>{ if(!e.alive) return; let type='eatk';
    if(e.boss&&b.round%3===0) type='eaoe';
    else if(e.id==='wraith'&&Math.random()<0.5) type='emagic';
    else if(e.id==='slime'&&Math.random()<0.4) type='epoison';
    b.actions.push({enemy:i,type}); });
  b.actions.sort((x,y)=>spdOf(y)-spdOf(x)); b.queue=b.actions.slice(); b.actions=[]; b.phase='resolve'; b.auto=1; b.poisonDone=false; b.log=[]; stepResolve(); }
function updateBattle(){ const b=battle;
  if(b.noteT>0) b.noteT--;
  if(b.timer>0){ b.timer--; if(b.timer===0&&b.phase==='intro'){ b.phase='input'; setCmdDefault(); b.autoT=12; } return; }
  if(b.phase==='input'){
    while(b.inputIdx<party.length&&!party[b.inputIdx].alive) b.inputIdx++;
    if(b.inputIdx>=party.length){ enemyPlan(); return; }
    const p=party[b.inputIdx];
    if(autoBattle){ if(consume('cancel')){ autoBattle=false; sfx('sel'); }
      else { b.autoT=(b.autoT||0)-1; if(b.autoT<=0){ b.autoT=12; b.actions.push(autoAction(b.inputIdx)); nextInput(); } return; } }
    if(consume('cancel')) battleBack();
    else if(b.menu==='cmd'){ if(consume('up'))b.cmd=(b.cmd+CMDS.length-1)%CMDS.length; if(consume('down'))b.cmd=(b.cmd+1)%CMDS.length;
      if(consume('confirm')) chooseCommand(b.cmd); }
    else if(b.menu==='skill'){ const n=p.skills.length; if(consume('up'))b.sub=(b.sub+n-1)%n; if(consume('down'))b.sub=(b.sub+1)%n;
      if(consume('confirm')) chooseSkill(b.sub); }
    else if(b.menu==='item'){ const n=invList().length||1; if(consume('up'))b.sub=(b.sub+n-1)%n; if(consume('down'))b.sub=(b.sub+1)%n;
      if(consume('confirm')) chooseItem(b.sub); }
    else if(b.menu==='target'){ if(consume('up')||consume('left'))b.targetIdx=prevAlive(b.enemies,b.targetIdx);
      if(consume('down')||consume('right'))b.targetIdx=nextAlive(b.enemies,b.targetIdx); if(consume('confirm')) confirmTarget(b.targetIdx); }
    else if(b.menu==='targetAlly'){ if(consume('up')||consume('left'))b.targetIdx=prevAlive(party,b.targetIdx);
      if(consume('down')||consume('right'))b.targetIdx=nextAlive(party,b.targetIdx); if(consume('confirm')) confirmTarget(b.targetIdx); }
    else if(b.menu==='targetDead'){ if(consume('up')||consume('down')||consume('left')||consume('right'))b.targetIdx=nextDead(b.targetIdx);
      if(consume('confirm')) confirmTarget(b.targetIdx); }

  else if(b.phase==='done'){ if(consume('confirm')||consume('cancel')) endBattle(); } }
function stepResolve(){ const b=battle;
  if(!aliveEnemies().length){ winBattle(); return; }
  if(!livingParty().length){ loseBattle(); return; }
  if(!b.queue.length){
    if(!b.poisonDone){ b.poisonDone=true; const pm=[];
      aliveEnemies().forEach(e=>{ if(e.poison>0){ const d=Math.max(1,Math.round(e.maxhp*0.06)); e.hp-=d; e.poison--; e.flash=8; popE(e,'-'+d); pm.push(`${e.name} 독 ${d}`); if(e.hp<=0){e.alive=false; pm.push(`${e.name} 쓰러짐!`);} } });
      livingParty().forEach(p=>{ if(p.poison>0){ const d=Math.max(1,Math.round(p.maxhp*0.05)); p.hp-=d; p.poison--; p.hitFlash=10; const q=partyPos(party.indexOf(p)); pop(q.x,q.y,'-'+d,'#8fdc6e'); pm.push(`${p.name} 독 ${d}`); if(p.hp<=0){p.hp=0;p.alive=false; pm.push(`${p.name} 쓰러졌다...`);} } });
      if(pm.length){ b.log=pm; b.auto=28; return; } }
    b.poisonDone=false; party.forEach(p=>p.guard=false);
    b.phase='input'; b.inputIdx=0; while(b.inputIdx<party.length&&!party[b.inputIdx].alive) b.inputIdx++; b.log=[]; setCmdDefault(); b.autoT=12; return; }
  const a=b.queue.shift(); b.log=[];
  if(a.type==='guard'){ const p=party[a.actor]; if(p.alive){ p.guard=true; b.log.push(`${p.name} 방어 태세!`); } }
  else if(a.type==='flee'){ if(!b.isBoss&&Math.random()<0.6){ b.log.push('도망쳤다!'); b.result='flee'; b.phase='done'; return; } else b.log.push('도망칠 수 없었다!'); }
  else if(a.type==='attack'){ const p=party[a.actor]; if(!p.alive){ b.auto=1; return; } p.actAnim=12; let t=b.enemies[a.target]; if(!t||!t.alive) t=b.enemies[firstEnemy()]; if(!t){b.auto=1;return;}
    const d=dmgPhys(atkOf(p),1.0,t.def); t.hp-=d; t.flash=12; sfx('hit'); popE(t,'-'+d); hitFx(t,'slash'); b.log.push(`${p.name}의 공격! ${t.name} ${d}`); if(t.hp<=0){t.alive=false; e_die(t); sfx('down'); b.log.push(`${t.name} 쓰러짐!`);} }
  else if(a.type==='skill'){ const p=party[a.actor]; if(!p.alive){b.auto=1;return;} p.actAnim=12; const s=SKILLS[a.skill]; p.mp=Math.max(0,p.mp-s.mp);
    if(s.kind==='heal'){ let t=party[a.target]; if(!t||!t.alive) t=party[firstAlly()]; const h=Math.round(p.mag*s.power); t.hp=Math.min(t.maxhp,t.hp+h); popP(party.indexOf(t),'+'+h); sfx('heal'); b.log.push(`${p.name}${s.msg} ${t.name} HP+${h}`); }
    else if(s.kind==='healAll'){ const h=Math.round(p.mag*s.power); livingParty().forEach(t=>{t.hp=Math.min(t.maxhp,t.hp+h); popP(party.indexOf(t),'+'+h);}); sfx('heal'); b.log.push(`${p.name}${s.msg} 전원 HP+${h}`); }
    else if(s.kind==='revive'){ let t=party[a.target]; if(t&&!t.alive){ t.alive=true; t.hp=Math.round(t.maxhp*s.power); sfx('heal'); b.log.push(`${p.name}${s.msg} ${t.name} 소생!`); } else b.log.push('대상이 없다'); }
    else { sfx('hit'); const hits=s.hits||1; const ts=s.target==='allEnemies'?aliveEnemies():[(b.enemies[a.target]&&b.enemies[a.target].alive)?b.enemies[a.target]:b.enemies[firstEnemy()]];
      b.log.push(`${p.name}${s.msg}`); ts.forEach(t=>{ if(!t) return; let tot=0; for(let h=0;h<hits;h++){ const d=s.kind==='magic'?dmgMag(p.mag,s.power,t.def):dmgPhys(atkOf(p),s.power,t.def); t.hp-=d; tot+=d; } t.flash=12; popE(t,'-'+tot); hitFx(t, s.kind==='magic'?'burst':'slash', s.kind==='magic'?'#c79bff':'#fff'); if(s.poison) t.poison=(t.poison||0)+s.poison;
        b.log.push(`${t.name} ${tot}${s.poison?' +독':''}`); if(t.hp<=0){t.alive=false; e_die(t); sfx('down'); b.log.push(`${t.name} 쓰러짐!`);} }); } }
  else if(a.type==='item'){ const it=ITEMS[a.item]; if((inventory[a.item]||0)<=0){b.auto=1;return;} inventory[a.item]--; let t=party[a.target]; sfx('heal');
    if(it.revive){ if(t&&!t.alive){ t.alive=true; t.hp=Math.round(t.maxhp*it.ratio); } b.log.push(`${it.name} — ${t?t.name:''} 소생!`); }
    else { if(!t||!t.alive) t=party[firstAlly()]; if(it.hp) t.hp=Math.min(t.maxhp,t.hp+it.hp); if(it.mp) t.mp=Math.min(t.maxmp,t.mp+it.mp); popP(party.indexOf(t),'+'+(it.hp||it.mp)); b.log.push(`${it.name} — ${t.name} ${it.hp?('HP+'+it.hp):('MP+'+it.mp)}`); } }
  else if(a.type==='eatk'){ const e=b.enemies[a.enemy]; if(!e.alive){b.auto=1;return;} const tg=livingParty(); if(!tg.length){loseBattle();return;}
    const p=tg[rnd(tg.length)]; let d=dmgPhys(e.atk,1.0,defOf(p)); if(p.guard) d=Math.max(1,Math.round(d*0.45)); p.hp-=d; flash=6; sfx('hit'); popP(party.indexOf(p),'-'+d); { const q=partyPos(party.indexOf(p)); spawnFx(q.x,q.y-4,'slash','#ff8a6a'); } b.log.push(`${e.name}의 공격! ${p.name} ${d}`);
    if(p.hp<=0){ p.hp=0; p.alive=false; sfx('down'); b.log.push(`${p.name} 쓰러졌다...`); } }
  else if(a.type==='eaoe'){ const e=b.enemies[a.enemy]; if(!e.alive){b.auto=1;return;} if(!livingParty().length){loseBattle();return;}
    b.log.push(`${e.name}의 파동! 전체 공격`); flash=10; shakeHit(20); sfx('down');
    livingParty().forEach(p=>{ let d=dmgMag(e.mag,1.3,defOf(p)); if(p.guard) d=Math.max(1,Math.round(d*0.5)); p.hp-=d; popP(party.indexOf(p),'-'+d); if(p.hp<=0){p.hp=0;p.alive=false; b.log.push(`${p.name} 쓰러졌다...`);} }); }
  else if(a.type==='emagic'){ const e=b.enemies[a.enemy]; if(!e.alive){b.auto=1;return;} const tg=livingParty(); if(!tg.length){loseBattle();return;}
    const p=tg[rnd(tg.length)]; const d=dmgMag(e.mag,1.6,defOf(p)); p.hp-=d; flash=6; sfx('hit'); popP(party.indexOf(p),'-'+d); b.log.push(`${e.name}의 주술! ${p.name} ${d}`); if(p.hp<=0){p.hp=0;p.alive=false; sfx('down'); b.log.push(`${p.name} 쓰러졌다...`);} }
  else if(a.type==='epoison'){ const e=b.enemies[a.enemy]; if(!e.alive){b.auto=1;return;} const tg=livingParty(); if(!tg.length){loseBattle();return;}
    const p=tg[rnd(tg.length)]; let d=dmgPhys(e.atk,0.8,defOf(p)); if(p.guard) d=Math.max(1,Math.round(d*0.45)); p.hp-=d; p.poison=(p.poison||0)+3; flash=6; sfx('hit'); popP(party.indexOf(p),'-'+d); b.log.push(`${e.name}의 독액! ${p.name} ${d} +독`); if(p.hp<=0){p.hp=0;p.alive=false; sfx('down'); b.log.push(`${p.name} 쓰러졌다...`);} }
  b.auto=28; }
function winBattle(){ const b=battle; const exp=b.enemies.reduce((s,e)=>s+e.exp,0), gg=b.enemies.reduce((s,e)=>s+(e.gold||0),0);
  gold+=gg; b.log=[`승리! 경험치 ${exp} · ◆${gg} 획득.`]; sfx('win'); const ups=[];
  livingParty().forEach(p=>{ p.exp+=exp; while(p.exp>=p.expNext){ p.exp-=p.expNext; levelUp(p); ups.push(p.name+' Lv'+p.lv); const q=partyPos(party.indexOf(p)); pop(q.x,q.y-12,'LEVEL UP!','#ffd54a'); } });
  if(ups.length) b.log.push('레벨 업! '+ups.join(', '));
  b.winExp=exp; b.winGold=gg; b.winUps=ups; b.winSeal='';
  if(b.isBoss&&b.sealBoss){ sealsFixed=Math.max(0,sealsFixed-1); bossStage++; b.winSeal = sealsFixed<=0?'모든 봉인 복구 — 여명이 돌아온다!':'봉인을 하나 다시 세웠다! 더 강한 수호물이 깨어난다...'; b.log.push(b.winSeal); }
  else if(b.isBoss){ b.winSeal='강적을 물리쳤다!'; b.log.push(b.winSeal); }
  b.phase='done'; b.result='win'; }
function levelUp(p){ p.lv++; p.expNext=Math.round(p.expNext*1.5)+4; p.maxhp+=6+rnd(4); p.maxmp+=2+rnd(3); p.atk+=2; p.def+=1; p.mag+=2; p.spd+=1; p.hp=p.maxhp; p.mp=p.maxmp; }
function loseBattle(){ battle.log=['전멸했다...']; battle.phase='done'; battle.result='lose'; }
function endBattle(){ const b=battle, r=b.result; party.forEach(p=>p.poison=0);
  if(r==='lose'){ party.forEach(p=>{p.alive=true;p.hp=Math.max(1,Math.round(p.maxhp*0.5));p.mp=Math.round(p.maxmp*0.5);});
    const rp=cur.respawn||{x:player.x,y:player.y}; state='field'; battle=null; loadArea(cur.id,rp.x,rp.y); showMsg('빛이 네 영혼을 안전한 곳으로 되돌렸다.'); return; }
  if(b.isBoss&&b.sealBoss&&r==='win'){ storyFlags['sealDone_'+cur.id]=true;
    for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++) if(MAP[y][x]==='4') MAP[y][x]='0';
    playBGM(cur.bgm||'field'); state='field'; battle=null; runEvent('ev_after_'+cur.boss.id); return; }
  if(b.isBoss&&r==='win'){ const ow=b.onWin; playBGM(cur.bgm||'field'); state='field'; battle=null; if(ow) runEvent(ow); return; }
  playBGM(cur.bgm||'field'); state='field'; battle=null; }
function drawBattle(){ const b=battle;
  g.fillStyle=b.isBoss?'#241a2e':'#243244'; g.fillRect(0,0,W,118);
  g.fillStyle=b.isBoss?'#2a2030':'#3b5a3a'; g.fillRect(0,116,W,154);
  g.fillStyle=b.isBoss?'#191322':'#19271f'; for(let t=0;t<=W/40;t++){ const tx=t*40; g.beginPath(); g.moveTo(tx-4,118); g.lineTo(tx+8,88); g.lineTo(tx+20,118); g.closePath(); g.fill(); }
  g.fillStyle='rgba(0,0,0,.14)'; g.fillRect(0,176,W,94);
  g.save(); if(shakeT>0) g.translate(rnd(5)-2,rnd(5)-2);
  if(flash>0){ g.fillStyle='rgba(255,80,80,.18)'; g.fillRect(0,0,W,H); }
  const tappable=(b.phase==='resolve'||b.phase==='done'||b.phase==='intro');
  if(tappable) hz(0,0,W,H,()=>{ if(b.phase==='done') endBattle(); else if(b.phase==='resolve') stepResolve(); });
  // 적
  b.enemies.forEach((e,i)=>{ if(!e.alive) return; const ep=enemyPos(i), sh=e.flash>0?(rnd(3)-1):0, bob=Math.sin((gtime+i*14)/18)*1.3, esc=e.boss?1:0.8;
    g.save(); g.translate(ep.x+sh,ep.y+bob); if(ENEMYPX[e.id]) drawEnemyPix(e,e.flash>0); else { g.scale(esc,esc); drawEnemyShape(e,e.flash>0); } g.restore();
    bar(ep.x-17,ep.y+14,34,4,e.hp/e.maxhp,'#c55');
    g.fillStyle='#cdd6ea'; g.font='9px sans-serif'; g.textAlign='center'; g.fillText(e.name,ep.x,ep.y+26);
    if(e.poison>0){ g.fillStyle='#8fdc6e'; g.fillText('독',ep.x,ep.y-14); }
    g.textAlign='left';
    if(b.menu==='target'){ hz(ep.x-19,ep.y-19,38,48,()=>{ if(b.targetIdx===i) confirmTarget(i); else { b.targetIdx=i; sfx('sel'); } }); }
    if(e.flash>0) e.flash--; });
  if(b.menu==='target'){ const tp=enemyPos(b.targetIdx); if(b.curX==null){b.curX=tp.x;b.curY=tp.y;} b.curX+=(tp.x-b.curX)*0.35; b.curY+=(tp.y-b.curY)*0.35;
    g.strokeStyle='#f0c27a'; g.lineWidth=2; g.strokeRect(b.curX-18,b.curY-16,36,36); g.lineWidth=1; g.fillStyle='#f0c27a'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText('▼',b.curX,b.curY-19); g.textAlign='left'; }
  // 주인공 파티 — 오른쪽 사이드뷰 + 왼쪽에 유닛별 HP/MP
  const tgtMode=(b.menu==='targetAlly'||b.menu==='targetDead'), SC=1.4;
  party.forEach((p,i)=>{ const pp=partyPos(i), lunge=(p.actAnim||0),
      cx=pp.x, cy=pp.y-lunge*2+(p.alive?Math.sin((gtime+i*9)/20)*1.3:0), half=TILE*SC*0.5;
    const active=b.phase==='input'&&i===b.inputIdx;
    if(active&&!tgtMode){ g.fillStyle='rgba(159,232,196,.14)'; g.beginPath(); g.ellipse(cx,cy+half-1,half*0.9,8,0,0,7); g.fill(); }
    if(tgtMode&&i===b.targetIdx){ g.strokeStyle='#9fe8c4'; g.lineWidth=1.5; g.strokeRect(cx-26,cy-half-4,52,TILE*SC+10); g.lineWidth=1; }
    g.save(); if(!p.alive) g.globalAlpha=0.4; drawHeroBattle(cx,cy,p,SC); g.globalAlpha=1;
    if(p.hitFlash>0){ g.fillStyle='rgba(226,75,74,.5)'; g.fillRect(cx-half*0.5,cy-half*0.3,half,half); }
    if(active&&!tgtMode){ g.fillStyle='#9fe8c4'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText('▲',cx,cy-half-6); g.textAlign='left'; }
    if(!p.alive){ g.strokeStyle='#c55'; g.lineWidth=2; g.beginPath(); g.moveTo(cx-10,cy-8); g.lineTo(cx+10,cy+10); g.moveTo(cx+10,cy-8); g.lineTo(cx-10,cy+10); g.stroke(); g.lineWidth=1; }
    g.restore();
    const iy=cy+half+9;
    g.textAlign='center'; g.fillStyle=p.alive?p.color:'#777'; g.font='bold 10px sans-serif'; g.fillText(`${p.name} ${p.hp}/${p.maxhp}`,cx,iy);
    if(p.poison>0){ g.fillStyle='#8fdc6e'; g.font='9px sans-serif'; g.fillText('독',cx+42,iy); }
    bar(cx-30,iy+3,60,4,p.hp/p.maxhp,(p.alive&&p.hp/p.maxhp<0.25&&gtime%24<12)?'#ff5a5a':'#4a7');
    bar(cx-30,iy+9,60,3,p.mp/p.maxmp,'#48c');
    g.textAlign='left';
    if(tgtMode) hz(cx-28,cy-half-4,56,TILE*SC+30,()=>{ if(b.menu==='targetDead'&&p.alive) return; if(b.menu==='targetAlly'&&!p.alive) return; confirmTarget(i); }); });
  drawBattleUI(); }
function drawBattleUI(){ const b=battle;
  g.fillStyle='rgba(6,8,16,.8)'; g.fillRect(0,0,W,42); g.fillStyle='#e8eef7'; g.font='11px sans-serif'; g.textAlign='left';
  (b.log||[]).slice(-3).forEach((l,i)=>g.fillText(l,8,13+i*11));
  if(b.note&&b.noteT>0){ g.fillStyle='#f0c27a'; g.fillText(b.note,8,40); }
  if(b.phase==='intro'){ g.fillStyle='#6b7590'; g.font='10px sans-serif'; g.textAlign='right'; g.fillText('탭하여 진행',W-6,40); g.textAlign='left'; return; }
  if(b.phase==='resolve'){ g.fillStyle='#6b7590'; g.font='10px sans-serif'; g.textAlign='right'; g.fillText('탭=빠르게 ▶',W-6,40); g.textAlign='left'; return; }
  if(b.phase==='done'){
    if(b.result==='win'){ const pw=280,ph=b.winSeal?128:108, bx=(W-pw)/2, by=66;
      g.fillStyle='rgba(10,14,28,.96)'; g.fillRect(bx,by,pw,ph); g.strokeStyle='#4a7'; g.lineWidth=1.5; g.strokeRect(bx+1,by+1,pw-2,ph-2); g.lineWidth=1;
      g.textAlign='center'; g.fillStyle='#9fe8c4'; g.font='bold 17px sans-serif'; g.fillText('승리!',W/2,by+26);
      g.fillStyle='#cdd6ea'; g.font='12px sans-serif'; g.fillText(`획득 경험치   ${b.winExp||0}`,W/2,by+50);
      g.fillStyle='#f0c27a'; g.fillText(`획득 골드   ◆ ${b.winGold||0}`,W/2,by+68);
      let yy=by+88; if(b.winUps&&b.winUps.length){ g.fillStyle='#ffd54a'; g.font='11px sans-serif'; g.fillText('레벨 업! '+b.winUps.join(', '),W/2,yy); yy+=18; }
      if(b.winSeal){ g.fillStyle='#9fe8ff'; g.font='11px sans-serif'; g.fillText(b.winSeal,W/2,yy); yy+=18; }
      g.fillStyle='#6b7590'; g.font='11px sans-serif'; g.fillText('탭하여 계속 ▶',W/2,by+ph-9); g.textAlign='left'; }
    else { g.fillStyle='#9fe8c4'; g.font='12px sans-serif'; g.textAlign='center'; g.fillText('탭하여 계속 ▶',W/2,36); g.textAlign='left'; }
    return; }
  if(b.phase!=='input') return; const p=party[b.inputIdx]; if(!p) return;
  btn(W-74,44,68,18, autoBattle?'⟳ 자동 ON':'⟳ 자동', toggleAuto, {bg:autoBattle?'#2a4a3a':'rgba(14,18,28,.96)', fg:autoBattle?'#9fe8c4':'#aeb8d0', font:'10px sans-serif'});
  g.fillStyle='#8a93ad'; g.font='11px sans-serif'; g.textAlign='right'; g.fillText(p.name+'의 턴',W-8,16); g.textAlign='left';
  if(autoBattle){ g.fillStyle='#9fe8c4'; g.font='12px sans-serif'; g.textAlign='center'; g.fillText('⟳ 자동 진행 중 — "자동"을 눌러 해제',W/2,H-22); g.textAlign='left'; return; }
  btn(6,44,52,18,'◀ 뒤로',()=>battleBack(),{font:'10px sans-serif'});
  const by=H-40;
  if(b.menu==='cmd'){ const n=CMDS.length, bw=(W-16-(n-1)*6)/n;
    CMDS.forEach((c,i)=>btn(8+i*(bw+6),by,bw,32,(i===b.cmd?'▶ ':'')+c,()=>chooseCommand(i),
      {bg:i===b.cmd?'#23314f':'rgba(14,18,28,.96)', fg:i===b.cmd?'#9fe8c4':'#aeb8d0', font:'13px sans-serif'})); }
  else if(b.menu==='skill'){ const sk=p.skills, n=sk.length, bw=Math.min(132,(W-16-(n-1)*6)/n);
    sk.forEach((id,i)=>{ const s=SKILLS[id]; btn(8+i*(bw+6),by,bw,32,(i===b.sub?'▶':'')+s.name+' '+s.mp,()=>chooseSkill(i),
      {bg:i===b.sub?'#2a2342':'rgba(14,18,28,.96)', fg:i===b.sub?'#c79bff':(p.mp<s.mp?'#6b7590':'#aeb8d0'), font:'12px sans-serif'}); }); }
  else if(b.menu==='item'){ const list=invList(), n=Math.max(1,list.length), bw=Math.min(132,(W-16-(n-1)*6)/n);
    if(!list.length){ g.fillStyle='#6b7590'; g.font='12px sans-serif'; g.textAlign='center'; g.fillText('아이템 없음',W/2,by+20); g.textAlign='left'; }
    list.forEach((id,i)=>{ const it=itemDef(id); btn(8+i*(bw+6),by,bw,32,(i===b.sub?'▶':'')+it.name+' x'+inventory[id],()=>chooseItem(i),
      {bg:i===b.sub?'#23314f':'rgba(14,18,28,.96)', fg:i===b.sub?'#9fe8c4':'#aeb8d0', font:'12px sans-serif'}); }); }
  else if(b.menu==='target'){ const alive=b.enemies.map((e,idx)=>({e,idx})).filter(o=>o.e.alive);
    g.fillStyle='#f0c27a'; g.font='11px sans-serif'; g.textAlign='left'; g.fillText('적 선택  ·  탭해서 이동, 다시 탭 = 공격',10,by-4); g.textAlign='left';
    const n=Math.max(1,alive.length), bw=Math.min(150,(W-16-(n-1)*6)/n);
    alive.forEach((o,k)=>{ const sel=o.idx===b.targetIdx; btn(8+k*(bw+6),by,bw,32,(sel?'▶ ':'')+o.e.name,()=>{ if(b.targetIdx===o.idx) confirmTarget(o.idx); else { b.targetIdx=o.idx; sfx('sel'); } },
      {bg:sel?'#3a2a2a':'rgba(14,18,28,.96)', fg:sel?'#f0c27a':'#aeb8d0', font:'12px sans-serif'}); }); }
  else if(b.menu==='targetAlly'||b.menu==='targetDead'){ g.fillStyle='#9fe8c4'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText(b.menu==='targetDead'?'소생할 아군을 탭하세요':'아군을 탭하세요',W/2,by+20); g.textAlign='left'; } }

/* ================= 메시지 ================= */
function updateMsg(){ if(consume('confirm')||consume('cancel')){ msg.i++; if(msg.i>=msg.lines.length){ const a=msg.after; msg=null; if(a) a(); } } }
function drawMsgBox(){ const h=56; const raw=msg.lines[msg.i]; let nm=null, txt=raw, col='#9fe8c4';
  if(raw && typeof raw==='object'){ nm=raw.n; txt=raw.t; col=raw.c||'#9fe8c4'; }
  if(nm){ g.font='bold 12px sans-serif'; const nw=g.measureText(nm).width+16;
    g.fillStyle='rgba(8,10,20,.95)'; g.fillRect(14,H-h-23,nw,18); g.strokeStyle=col; g.lineWidth=1; g.strokeRect(14.5,H-h-22.5,nw-1,17);
    g.fillStyle=col; g.textAlign='left'; g.fillText(nm,22,H-h-10); }
  g.fillStyle='rgba(8,10,20,.95)'; g.fillRect(8,H-h-8,W-16,h); g.strokeStyle=nm?col:'#30406a'; g.strokeRect(8.5,H-h-7.5,W-17,h-1);
  g.fillStyle='#e8eef7'; g.font='12px sans-serif'; g.textAlign='left'; wrap(txt,18,H-h+6,W-36,15);
  g.fillStyle='#6b7590'; g.font='10px sans-serif'; g.textAlign='right'; g.fillText('탭/확인 ▶ ('+(msg.i+1)+'/'+msg.lines.length+')',W-16,H-12); g.textAlign='left';
  hz(0,0,W,H,()=>{ pressed.confirm=true; }); }
function wrap(text,x,y,maxw,lh){ let line='',yy=y+12; for(const ch of (text||'')){ if(g.measureText(line+ch).width>maxw){ g.fillText(line,x,yy); line=ch; yy+=lh; } else line+=ch; } g.fillText(line,x,yy); }

/* ================= 루프 ================= */
function update(){ if(msg) updateMsg();
  else if(state==='title') updateTitle(); else if(state==='field') updateField();
  else if(state==='menu') updateMenu(); else if(state==='shop') updateShop(); else if(state==='battle') updateBattle();
  if(flash>0) flash--; if(shakeT>0) shakeT--; gtime++;
  if(pops.length){ for(const q of pops){ q.y-=0.5; q.t--; } pops=pops.filter(q=>q.t>0); }
  if(fx.length){ for(const f of fx) f.t--; fx=fx.filter(f=>f.t>0); }
  if(battle){ party.forEach(q=>{ if(q.hitFlash>0) q.hitFlash--; if(q.actAnim>0) q.actAnim--; }); battle.enemies.forEach(e=>{ if(e.dying>0) e.dying--; }); }
  clearPressed(); }
function draw(){ hotspots=[]; g.textAlign='left'; g.textBaseline='alphabetic'; g.font='12px sans-serif';
  if(state==='title') drawTitle(); else if(state==='field') drawField(); else if(state==='menu') drawMenu();
  else if(state==='shop') drawShop(); else if(state==='battle') drawBattle();
  if(state==='battle'){ drawFx(); drawPops(); }
  if(msg) drawMsgBox(); }
function loop(){ update(); draw(); requestAnimationFrame(loop); }
