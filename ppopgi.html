<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 뽑기</title>
<style>
  html,body{margin:0;height:100%;background:#120e1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
  canvas{display:block}
  /* 상단 목표 */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;pointer-events:none}
  #goalLbl{font-size:13px;color:#ffb0e6;letter-spacing:1px}
  #goal{font-size:24px;font-weight:900;margin-top:1px;text-shadow:0 0 16px rgba(255,120,220,.5)}
  #dex{font-size:13px;color:#9fe;margin-top:2px;font-weight:700}
  #hearts{font-size:14px;font-weight:800;color:#ff6a9a;margin-bottom:2px}
  #lives{font-size:16px;font-weight:800;margin-top:2px;min-height:20px}
  #lastAccTop{font-size:15px;font-weight:800;margin-top:3px;min-height:18px}
  #noheart{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.95);z-index:11;text-align:center;padding:24px}
  #streak{font-size:12px;color:#ffcf66;margin-top:2px;font-weight:800;min-height:16px}
  /* 하단 안내/버튼 */
  #hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:3;font-size:17px;font-weight:800;color:#ffe;pointer-events:none;min-height:24px}
  #ver{position:fixed;left:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;color:#5a4a70;z-index:4}
  .flash{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:40px;font-weight:900;z-index:8;pointer-events:none;text-align:center;white-space:nowrap;animation:fl 1s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
  .btn{background:#ff4db8;color:#fff;border:none;border-radius:16px;padding:15px 30px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #b81f7f;cursor:pointer}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.94);z-index:10;text-align:center;padding:24px}
  .hidden{display:none!important}
  h1{font-size:40px;margin:0;text-shadow:0 0 22px rgba(255,80,200,.5)}
  .sub{color:#e9c9ff;opacity:.9;font-size:15px;line-height:1.5}
  #changelog{margin-top:14px;font-size:12px;color:#9fe;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:7px 12px;max-width:320px}
  #dexGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 2px}
  .dcell{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:26px}
  .dcell.lock{filter:grayscale(1);opacity:.28}
  #overTitle{font-size:34px}
  #reviveBtn{background:#2ec77a;box-shadow:0 6px 0 #1a8a52}
  #gripWrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none}
  #gripLbl{font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,90,110,.6);margin-bottom:6px;animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  #gripBar{width:72%;max-width:300px;height:20px;margin:0 auto;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #gripFill{height:100%;width:100%;background:#5cffb0;border-radius:10px;transition:width .05s linear}
  #combo{font-size:22px;font-weight:900;margin-top:3px;min-height:26px;letter-spacing:1px;text-shadow:0 0 14px rgba(255,140,40,.7)}
  .dcell.secret{background:linear-gradient(135deg,rgba(255,92,225,.18),rgba(124,180,255,.18));border:1.5px solid rgba(255,120,220,.5)}
  .dcell.secret.ready{animation:secglow 1s ease-in-out infinite alternate;filter:none;opacity:1}
  @keyframes secglow{from{box-shadow:0 0 4px rgba(255,120,220,.4)}to{box-shadow:0 0 16px rgba(255,120,220,.95)}}
  #start{overflow-y:auto}
  #titleBadge{font-size:15px;font-weight:900;color:#ffd34d;text-shadow:0 0 10px rgba(255,211,77,.5);margin-top:-4px}
  #metaBox{font-size:12.5px;color:#cfe;opacity:.92;line-height:1.55}
  #missionBox{background:rgba(124,180,255,.1);border:1px solid rgba(124,180,255,.32);border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:330px;width:86%;text-align:left}
  #missionBox .mtit{font-weight:800;color:#bfe0ff;margin-bottom:3px}
  .mrow{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .mrow.done{color:#7cffb0;opacity:.75}
  #rank{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.96);z-index:12;padding:24px;text-align:center}
  #rank.show{display:flex}
  #rankList{width:88%;max-width:340px;text-align:left;font-size:14px}
  .rkrow{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05);margin:4px 0}
  #goldBar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none}
  #goldLbl{font-size:16px;font-weight:900;color:#ffd34d;text-shadow:0 0 12px rgba(255,211,77,.7)}
  #goldTrack{width:70%;max-width:300px;height:12px;margin:5px auto 0;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;border:2px solid #ffd34d}
  #goldFill{height:100%;background:linear-gradient(90deg,#ffe066,#ffb04d);width:100%;transition:width .1s linear}
</style></head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="top">
  <div id="hearts"></div>
  <div id="goalLbl">🎯 이번 목표</div>
  <div id="goal">–</div>
  <div id="dex">도감 0/10</div>
  <div id="lives"></div>
  <div id="combo"></div>
  <div id="lastAccTop"></div>
  <div id="streak"></div>
</div>
<div id="gripWrap" class="hidden"><div id="gripLbl">🔥 탭 연타! 꽉 잡아!</div><div id="gripBar"><div id="gripFill"></div></div></div>
<div id="goldBar" class="hidden"><div id="goldLbl">⚡ 황금 찬스!</div><div id="goldTrack"><div id="goldFill"></div></div></div>
<div id="hint"></div>
<div id="ver">v2.1 · 글로벌 랭킹 준비완료(Firebase URL 연결 시 활성) · 이름설정</div>

<div id="start">
  <h1>모두의 뽑기</h1>
  <div id="titleBadge"></div>
  <div class="sub" style="font-size:14px"><b>탭 2번</b>으로 <b style="color:#7cffb0">정가운데</b>에 멈추면 성공! (초반 크게→갈수록 작게)</div>
  <div class="sub" id="themeHdr" style="font-weight:800;font-size:15px;margin-bottom:4px"></div>
  <div id="dexGrid"></div>
  <div class="sub" id="startStats" style="font-size:13px;opacity:.85"></div>
  <div id="missionBox"></div>
  <div id="metaBox"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="startBtn">뽑으러 가기</button>
    <button class="btn" id="rankBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:15px 18px">🏅 랭킹</button>
    <button class="btn" id="shareBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:15px 18px">🔗 공유</button>
  </div>
  <div id="changelog">🆕 <b>v2.0</b> · ⚡황금 찬스 · 📅출석보상 · 🎯일일미션 · 👑칭호 · 🏅랭킹</div>
</div>

<div id="rank">
  <div style="font-size:30px;font-weight:900">🏅 명예의 전당</div>
  <div class="sub" id="rankMe" style="font-size:13px"></div>
  <div id="rankList"></div>
  <div class="sub" id="rankNote" style="font-size:11px;opacity:.6"></div>
  <button class="btn" id="rankClose" style="background:#3a4568;box-shadow:0 6px 0 #222a44">닫기</button>
</div>

<div id="noheart" class="hidden">
  <div style="font-size:56px">💔</div>
  <div style="font-size:30px;font-weight:900">하트를 다 썼어요</div>
  <div class="sub" id="heartMsg"></div>
  <button class="btn" id="heartAdBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52">🎬 광고 보고 하트 +5</button>
  <button class="btn" id="heartWaitBtn" style="background:#3a4568;box-shadow:0 6px 0 #222a44">기다리기 (첫 화면)</button>
</div>

<div id="over" class="hidden">
  <div id="overTitle">아—! 놓쳤다</div>
  <div class="sub" id="overMsg"></div>
  <button class="btn" id="reviveBtn">🎬 광고 보고 재도전 (집게 힘 +30%)</button>
  <button class="btn" id="retryBtn" style="background:#3a7bff;box-shadow:0 6px 0 #1f52c0">다시 도전</button>
  <div class="sub" style="opacity:.7">도감 <b id="overDex">0/10</b></div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.random()*(b-a)+a, clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ── 오디오 ──
let AC; function tone(f,d,type,g){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v);v.connect(AC.destination); const t=AC.currentTime;o.start(t); v.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1)); o.stop(t+(d||0.1)); }catch(e){} }
function chord(b){[0,4,7,12].forEach((s,i)=>setTimeout(()=>tone(b*Math.pow(2,s/12),0.18,'triangle',0.07),i*70));}
function vib(m){try{navigator.vibrate&&navigator.vibrate(m);}catch(e){}}
let heartT=0;
// ── 광고(리워드) ──
const AD_USE_TEST=true, AD_REWARD_TEST='ca-app-pub-3940256099942544/5224354917', AD_REWARD_REAL='';
let admobReady=false, adPlaying=false;
(async function(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob){ await C.Plugins.AdMob.initialize({initializeForTesting:AD_USE_TEST}); admobReady=true; } }catch(e){} })();
async function playAd(cb){ if(adPlaying)return; adPlaying=true; const C=window.Capacitor;
  if(admobReady&&C&&C.Plugins&&C.Plugins.AdMob){ const A=C.Plugins.AdMob; let ld=null,lf=null;
    try{ await A.prepareRewardVideoAd({adId:AD_USE_TEST?AD_REWARD_TEST:AD_REWARD_REAL});
      await new Promise(res=>{let d=false;const fin=()=>{if(d)return;d=true;res();};
        A.addListener('onRewardedVideoAdDismissed',fin).then(l=>ld=l); A.addListener('onRewardedVideoAdFailedToShow',fin).then(l=>lf=l);
        A.showRewardVideoAd().catch(fin); setTimeout(fin,40000);});
      if(ld&&ld.remove)ld.remove(); if(lf&&lf.remove)lf.remove(); adPlaying=false; cb(); return;
    }catch(e){ adPlaying=false; cb(); return; } }
  setTimeout(()=>{ adPlaying=false; cb(); },700); // 웹 시뮬
}

// ── 테마 도감 (5테마 × 10종 = 50) ──
const THEMES=[
  {key:'animal', name:'동물', ico:'🐻', dolls:[
    {e:'🐻',n:'곰돌이',r:1},{e:'🐰',n:'토끼',r:1},{e:'🐸',n:'개구리',r:1},
    {e:'🐱',n:'냥이',r:2},{e:'🐧',n:'펭귄',r:2},{e:'🐼',n:'판다',r:2},{e:'🐨',n:'코알라',r:2},
    {e:'🦊',n:'여우',r:3},{e:'🦁',n:'사자',r:3},{e:'🐯',n:'호랑이',r:3} ], secret:{e:'🦖',n:'공룡',r:4}},
  {key:'food', name:'음식', ico:'🍔', dolls:[
    {e:'🍔',n:'버거',r:1},{e:'🍕',n:'피자',r:1},{e:'🍟',n:'감자튀김',r:1},
    {e:'🍩',n:'도넛',r:2},{e:'🍰',n:'케이크',r:2},{e:'🍫',n:'초코',r:2},{e:'🍦',n:'아이스크림',r:2},
    {e:'🍣',n:'초밥',r:3},{e:'🍜',n:'라멘',r:3},{e:'🧁',n:'컵케이크',r:3} ], secret:{e:'🍭',n:'왕사탕',r:4}},
  {key:'space', name:'우주', ico:'🚀', dolls:[
    {e:'🚀',n:'로켓',r:1},{e:'🛸',n:'UFO',r:1},{e:'⭐',n:'별',r:1},
    {e:'🌙',n:'달',r:2},{e:'☄️',n:'혜성',r:2},{e:'🪐',n:'토성',r:2},{e:'👽',n:'외계인',r:2},
    {e:'🌌',n:'은하',r:3},{e:'🌠',n:'유성',r:3},{e:'🔭',n:'망원경',r:3} ], secret:{e:'🌟',n:'초신성',r:4}},
  {key:'sea', name:'바다', ico:'🐠', dolls:[
    {e:'🐠',n:'물고기',r:1},{e:'🐙',n:'문어',r:1},{e:'🦀',n:'게',r:1},
    {e:'🐬',n:'돌고래',r:2},{e:'🐳',n:'고래',r:2},{e:'🦈',n:'상어',r:2},{e:'🐢',n:'거북',r:2},
    {e:'🦑',n:'오징어',r:3},{e:'🐡',n:'복어',r:3},{e:'🧜',n:'인어',r:3} ], secret:{e:'🐋',n:'흰수염고래',r:4}},
  {key:'legend', name:'전설', ico:'🐉', dolls:[
    {e:'🐉',n:'용',r:1},{e:'🦄',n:'유니콘',r:1},{e:'🔥',n:'불사조',r:1},
    {e:'👑',n:'왕관',r:2},{e:'💎',n:'보석',r:2},{e:'🗡️',n:'성검',r:2},{e:'🏆',n:'트로피',r:2},
    {e:'🌈',n:'무지개',r:3},{e:'💫',n:'정령',r:3},{e:'👾',n:'전설몬',r:3} ], secret:{e:'🐲',n:'용왕',r:4}},
];
const TOTAL_DOLLS=THEMES.reduce((s,t)=>s+t.dolls.length+(t.secret?1:0),0);  // 기본 50 + 시크릿 5 = 55
let curTheme=+(localStorage.getItem('ppopgi_theme')||0); if(curTheme>=THEMES.length) curTheme=THEMES.length-1;
function THEME(){ return THEMES[curTheme]; }
function did(theme,name){ return theme.key+':'+name; }
function loadDex(){ try{ return JSON.parse(localStorage.getItem('ppopgi_dex2')||'[]'); }catch(e){ return []; } }
function saveDex(a){ try{ localStorage.setItem('ppopgi_dex2',JSON.stringify(a)); }catch(e){} }
let dex=loadDex();
function has(theme,d){ return dex.includes(did(theme,d.n)); }
function themeCaught(theme){ return theme.dolls.filter(d=>has(theme,d)).length; }  // 기본 10종 기준(테마 해금은 이걸로)
function totalCaughtDolls(){ return dex.length; }
function dexCount(){ return themeCaught(THEME()); }  // 현재 테마 수집 수(하위호환)
// ── 시크릿 인형: 테마 기본 10종을 다 모으면 "시크릿 보스"로 등장 ──
function secretUnlocked(theme){ return !!theme.secret && themeCaught(theme) >= theme.dolls.length; }
function secretCaught(theme){ return theme.secret && has(theme,theme.secret); }
function renderDexGrid(){ const g=$('dexGrid'); g.innerHTML='';
  THEME().dolls.forEach(d=>{ const got=has(THEME(),d); const c=document.createElement('div'); c.className='dcell'+(got?'':' lock'); c.textContent=got?d.e:'❔'; c.title=d.n+' '+'★'.repeat(d.r); g.appendChild(c); });
  const T=THEME(); if(T.secret){ const sc=document.createElement('div'); const caught=secretCaught(T), unlocked=secretUnlocked(T);
    sc.className='dcell secret'+(caught?'':(unlocked?' ready':' lock'));
    sc.textContent = caught? T.secret.e : '❔';
    sc.title = caught? (T.secret.n+' ✨시크릿') : (unlocked? '✨시크릿 등장! 잡아보세요' : '🔒 시크릿 — 기본 10종을 다 모으면 등장');
    g.appendChild(sc); } }

// ── 캔버스 ──
const cv=$('cv'), ctx=cv.getContext('2d'); let W=412,H=740,DPR=1, sc=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); const vw=innerWidth,vh=innerHeight; W=412; H=Math.round(W*vh/vw); cv.width=W*DPR; cv.height=H*DPR; cv.style.width=vw+'px'; cv.style.height=vh+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// 필드(유리장) 영역
function field(){ return {x:24, y:H*0.28, w:W-48, h:H*0.46}; }
let state='start';           // start|aimX|aimY|drop|result
let dolls=[];                // 화면 배치된 인형들
let target=-1;               // 목표 인형 index(dolls)
let cx=0, cy=0;              // 조준 십자
let sweep=0, sweepDir=1, sweepSpd=1;
let claw={x:W/2,y:0,open:1,holding:null,phase:'',sway:0};
let timeScale=1;   // 마지막 이동 구간 슬로모션
let outcome=null;            // {grab, success, nearMiss}
let anim=0, shakeN=0, shakeMag=0;
let gripVal=1, carryProg=0, aimAcc=0, drainRate=0.4;  // 능동 그립 사수
let playCount=+(localStorage.getItem('ppopgi_plays')||0);
let failStreak=+(localStorage.getItem('ppopgi_fs')||0);
let clawBonus=0;             // 광고 재도전 보너스(집게 힘)
let parts=[], screenShake=0, flashCol=null, flashA=0;
let lives=2; const MAX_LIVES=2;   // 인형 한 마리당 생명 2개(2번 실패해야 진짜 실패)
function renderLives(){ if(state==='start'){ $('lives').innerHTML=''; return; } let s=''; for(let i=0;i<MAX_LIVES;i++) s+= i<lives?'💗':'🖤'; $('lives').innerHTML='<span style="letter-spacing:2px">'+s+'</span>'; }
function confetti(x,y,n){ const cols=['#ff5ce1','#7cffb0','#ffd34d','#5ab0ff','#ff8a5a','#c9a3ff','#ffffff']; for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=rnd(2,9); parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,life:1.5,c:cols[i%cols.length],r:3+Math.random()*4}); } }

function pickTarget(){
  const T=THEME();
  let pool=T.dolls.filter(d=>!has(T,d));      // 현재 테마 미보유 우선
  if(secretUnlocked(T) && !secretCaught(T)) pool.push(T.secret);  // 시크릿 해금됐고 아직 못잡았으면 목표 후보(희귀)
  if(!pool.length){ pool=T.dolls.slice(); if(secretUnlocked(T)) pool.push(T.secret); }  // 다 모았으면 전체
  // 희귀도 가중: ★=3, ★★=2, ★★★=1, 시크릿=1 → 귀할수록 목표로 덜 나옴(간절함)
  const weighted=[]; pool.forEach(d=>{ const w=Math.max(1,4-d.r); for(let i=0;i<w;i++) weighted.push(d); });
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function layoutField(goal){
  const f=field(); dolls=[];
  // 인형 무더기: 현재 테마에서 여러 종류 흩뿌리기 + 목표 1개 확실히 포함
  const set=[goal]; const others=THEME().dolls.filter(d=>d.n!==goal.n);
  for(let i=0;i<7;i++) set.push(others[Math.floor(Math.random()*others.length)]);

function stepSpectate(dt){

  const dsz=dollSize(); const ringR=Math.round(dsz*0.78);
  for(let i=0;i<dolls.length;i++){ const d=dolls[i]; const held=(claw.holding===d);
    if(!held){ ctx.fillStyle='rgba(0,0,0,.30)'; ctx.beginPath(); ctx.ellipse(d.x,d.y+dsz*0.5,dsz*0.44,dsz*0.15,0,0,6.28); ctx.fill(); } // 바닥 그림자(인형 크기 비례)
    if(i===target && state!=='result' && !held){ const R=rar(d.r);
      if(isGolden){ ctx.save(); const gp=0.5+0.4*Math.sin(performance.now()/160); ctx.globalAlpha=gp; ctx.strokeStyle='#ffd34d'; ctx.lineWidth=4; ctx.shadowColor='rgba(255,211,77,.9)'; ctx.shadowBlur=18; ctx.beginPath(); ctx.arc(d.x,d.y,ringR+7,0,6.28); ctx.stroke();
        for(let k=0;k<6;k++){ const a=performance.now()/500+k*1.047; const rr2=ringR+13; ctx.globalAlpha=0.8*gp; ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(d.x+Math.cos(a)*rr2,d.y+Math.sin(a)*rr2,2.5,0,6.28); ctx.fill(); } ctx.restore(); }
      ctx.save(); ctx.globalAlpha=0.45+0.3*Math.sin(performance.now()/300); ctx.strokeStyle=R.hex; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(d.x,d.y,ringR,0,6.28); ctx.stroke(); ctx.restore();
      if(state==='aimX'||state==='aimY'){ ctx.save();
        const zoneR=Math.max(6,(1-successThreshold())*accRadius()); // 성공 존 반경(초반 큼→후반 작음·희귀도↑=작음)
        ctx.fillStyle='rgba('+R.c+',.16)'; ctx.beginPath(); ctx.arc(d.x,d.y,zoneR,0,6.28); ctx.fill();
        ctx.strokeStyle='rgba('+R.c+',.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(d.x,d.y,zoneR,0,6.28); ctx.stroke();
        ctx.fillStyle=R.hex; ctx.beginPath(); ctx.arc(d.x,d.y,2.5,0,6.28); ctx.fill();
        // 희귀도 라벨(★ 개수 + 등급) — 별이 많을수록 존이 작다는 걸 눈으로 확인
        ctx.globalAlpha=0.9; ctx.fillStyle=R.hex; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
        ctx.fillText('★'.repeat(d.r)+' '+R.name, d.x, d.y-zoneR-8); ctx.restore(); } // 정가운데 성공 존
    }
    ctx.font=dsz+'px system-ui';
    if(held){ ctx.save(); ctx.translate(d.x,d.y+2); ctx.rotate(claw.sway||0); ctx.fillText(d.e,0,2); ctx.restore(); } // 집게에 매달려 흔들림
    else ctx.fillText(d.e, d.x, d.y);
  }
  // 조준선/십자
  if(state==='aimX'){ ctx.strokeStyle='#ffec6b'; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(sweep,f.y-30); ctx.lineTo(sweep,f.y+f.h); ctx.stroke(); ctx.setLineDash([]); }
  else if(state==='aimY'){ ctx.strokeStyle='#ffec6b'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(cx,f.y-30); ctx.lineTo(cx,f.y+f.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x,sweep); ctx.lineTo(f.x+f.w,sweep); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ffec6b'; ctx.beginPath(); ctx.arc(cx,sweep,5,0,6.28); ctx.fill();
  }
  // 실시간 정확도 표시 (조준 중) — 첫 판만(튜토리얼)
  if((state==='aimX'||state==='aimY') && playCount===0){
    const liveAcc = (state==='aimX') ? accAt(sweep, dolls[target].y) : accAt(cx, sweep);
    const pct=Math.round(liveAcc*100), thr=Math.round(successThreshold()*100);
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 26px system-ui';
    ctx.fillStyle = pct>=thr?'#7cffb0':(pct>=thr-25?'#ffcf66':'#ff6a7a');
    ctx.fillText('정확도 '+pct+'%', W/2, f.y+22);
    if(pct>=thr){ ctx.font='bold 13px system-ui'; ctx.fillStyle='#7cffb0'; ctx.fillText('★ 성공권!', W/2, f.y+44); }
    ctx.restore();
  }
  // 집게
  drawClaw();
  // 파티클
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
  // 콤보 열기(연속 성공 3+): 화면 가장자리가 뜨겁게 맥동
  if(successStreak>=3 && (state==='aimX'||state==='aimY'||state==='drop')){ const heat=Math.min(successStreak,8); const puls=0.10+0.05*Math.sin(performance.now()/180); const a=(0.10+heat*0.03)+puls;
    const v=ctx.createRadialGradient(W/2,H*0.5,H*0.30,W/2,H*0.5,H*0.62); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(255,'+(140-heat*10)+',40,'+a.toFixed(2)+')'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }
  // 슬로모션 비네트(긴장 연출)
  if(timeScale<1){ const v=ctx.createRadialGradient(claw.x,H*0.5,H*0.16,claw.x,H*0.5,H*0.62); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(25,0,40,.5)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }
  if(flashA>0){ ctx.fillStyle='rgba('+(flashCol||'124,255,176')+','+(flashA*0.32).toFixed(2)+')'; ctx.fillRect(0,0,W,H); } // 성공 초록 플래시
  ctx.restore();
}
function drawClaw(){
  const f=field(); const railY=f.y-46;
  let cxp = (state==='drop')?claw.x : (state==='aimY'?cx : (state==='aimX'?sweep : W/2));
  let clawY = (state==='drop')?claw.y : railY+6;
  const open = (state==='drop')?claw.open:1;
  // 레일(금속)
  const rg=ctx.createLinearGradient(0,railY-5,0,railY+5); rg.addColorStop(0,'#c9b4f0'); rg.addColorStop(1,'#6a4fa0');
  ctx.fillStyle=rg; roundRect(f.x-10,railY-5,f.w+20,10,4); ctx.fill();
  // 캐리지(레일 위 이동부)
  ctx.fillStyle='#8a7ab8'; roundRect(cxp-14,railY-8,28,10,3); ctx.fill();
  // 케이블
  ctx.strokeStyle='#9a8ac0'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cxp,railY-2); ctx.lineTo(cxp,clawY-15); ctx.stroke();
  // 집게 헤드(금속 하우징)
  const hg=ctx.createLinearGradient(cxp-16,0,cxp+16,0); hg.addColorStop(0,'#f2f2fa'); hg.addColorStop(.5,'#aeaecb'); hg.addColorStop(1,'#78788f');
  ctx.fillStyle=hg; roundRect(cxp-15,clawY-15,30,16,5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cxp-9,clawY-11); ctx.lineTo(cxp+6,clawY-11); ctx.stroke();
  ctx.fillStyle='#5a5a78'; roundRect(cxp-5,clawY-2,10,5,2); ctx.fill(); // 축
  // 3발 집게 (금속, open=벌어짐/curl)
  const spread=7+open*19, curl=3+open*9;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#9a9ab8'; ctx.lineWidth=6; // 중앙(뒤)
  ctx.beginPath(); ctx.moveTo(cxp,clawY); ctx.lineTo(cxp,clawY+20+(1-open)*6); ctx.stroke();
  ctx.strokeStyle='#e4e4f2'; ctx.lineWidth=6; // 좌
  ctx.beginPath(); ctx.moveTo(cxp-3,clawY); ctx.lineTo(cxp-spread,clawY+15); ctx.lineTo(cxp-spread+curl,clawY+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxp+3,clawY); ctx.lineTo(cxp+spread,clawY+15); ctx.lineTo(cxp+spread-curl,clawY+30); ctx.stroke(); // 우
  // 관절 볼트
  ctx.fillStyle='#c0c0d8'; [[-spread,15],[spread,15]].forEach(o=>{ ctx.beginPath(); ctx.arc(cxp+o[0],clawY+o[1],3,0,6.28); ctx.fill(); });
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
requestAnimationFrame(loop);

// ── 하트(시도권) ──
const MAX_HEARTS=10, HEART_REGEN_MS=180000;   // 3분당 1개 회복
let hearts=MAX_HEARTS, heartTs=Date.now();
function loadHearts(){ try{ let h=parseInt(localStorage.getItem('ppopgi_hearts')), ts=parseInt(localStorage.getItem('ppopgi_heart_ts'));
  if(isNaN(h))h=MAX_HEARTS; if(isNaN(ts))ts=Date.now();
  const g=Math.floor((Date.now()-ts)/HEART_REGEN_MS); if(g>0&&h<MAX_HEARTS){ h=Math.min(MAX_HEARTS,h+g); ts+=g*HEART_REGEN_MS; } if(h>=MAX_HEARTS)ts=Date.now();
  hearts=h; heartTs=ts; saveHearts(); }catch(e){ hearts=MAX_HEARTS; heartTs=Date.now(); } }
function saveHearts(){ try{ localStorage.setItem('ppopgi_hearts',hearts); localStorage.setItem('ppopgi_heart_ts',heartTs); }catch(e){} }
function addHearts(n){ loadHearts(); hearts=Math.min(MAX_HEARTS,hearts+n); saveHearts(); renderHearts(); }
function heartTimer(){ if(hearts>=MAX_HEARTS) return ''; const left=Math.ceil((HEART_REGEN_MS-((Date.now()-heartTs)%HEART_REGEN_MS))/1000); return Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); }
function renderHearts(){ loadHearts(); const t=heartTimer(); $('hearts').innerHTML='❤️ '+hearts+' / '+MAX_HEARTS+(t?' <span style="opacity:.55;font-weight:600">(+1 '+t+')</span>':''); }
setInterval(()=>{ renderHearts(); if(!$('noheart').classList.contains('hidden')){ loadHearts(); if(hearts>0){ $('noheart').classList.add('hidden'); toStart(); } } },1000);

// ══════════ Phase 2: 칭호·출석·일일미션·황금찬스·랭킹 ══════════
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function ymd(off){ const d=new Date(); d.setDate(d.getDate()+off); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// ── 칭호(누적 수집 기반) ──
const TITLES=[{n:'뽑기 새내기',min:0},{n:'뽑기 입문',min:8},{n:'뽑기 중수',min:25},{n:'뽑기 고수',min:55},{n:'뽑기 달인',min:110},{n:'뽑기의 신',min:220}];
function curTitle(){ let t=TITLES[0]; for(const x of TITLES) if(totalCaught>=x.min) t=x; return t; }
function nextTitle(){ for(const x of TITLES) if(totalCaught<x.min) return x; return null; }

// ── 출석 보상(하루 1회, 연속일 보너스) ──
function checkAttendance(){
  const t=todayStr(); const last=localStorage.getItem('ppopgi_att_day'); let streak=+(localStorage.getItem('ppopgi_att_streak')||0);
  if(last===t) return {streak, reward:0, already:true};
  streak = (last===ymd(-1)) ? streak+1 : 1;
  try{ localStorage.setItem('ppopgi_att_day',t); localStorage.setItem('ppopgi_att_streak',streak); }catch(e){}
  const reward = (streak%7===0)?5:2;   // 7일마다 +5, 평소 +2
  addHearts(reward);
  return {streak, reward, already:false};
}
function attStreak(){ return +(localStorage.getItem('ppopgi_att_streak')||0); }

// ── 일일 미션(매일 3개, 완료 시 하트) ──
const MISSION_DEFS=[{t:'catch',goal:8,txt:'인형 8마리 잡기',rw:3},{t:'combo',goal:5,txt:'5연속 성공 달성',rw:3},{t:'rare',goal:1,txt:'★★★ 이상 1마리 잡기',rw:4}];
let missions=null;
function loadMissions(){ const t=todayStr(); let m=null; try{ m=JSON.parse(localStorage.getItem('ppopgi_missions')||'null'); }catch(e){}
  if(!m || m.day!==t){ m={day:t, prog:[0,0,0], claimed:[false,false,false]}; }
  missions=m; return m; }
function saveMissions(){ try{ localStorage.setItem('ppopgi_missions',JSON.stringify(missions)); }catch(e){} }
function missionOnWin(goal){ if(!missions) loadMissions();
  missions.prog[0]++;                                    // 잡은 수
  if(successStreak>missions.prog[1]) missions.prog[1]=successStreak;  // 최고 콤보
  if(goal.r>=3) missions.prog[2]=1;                      // ★★★+
  MISSION_DEFS.forEach((d,i)=>{ if(!missions.claimed[i] && missions.prog[i]>=d.goal){ missions.claimed[i]=true; addHearts(d.rw); setTimeout(()=>flash('🎯 미션 완료! '+d.txt+' ❤️+'+d.rw,'#7cf6ff'),700+i*120); } });
  saveMissions(); }
function renderMissions(){ if(!missions) loadMissions(); const el=$('missionBox'); if(!el) return;
  let done=missions.claimed.filter(Boolean).length;
  let h='<div class="mtit">🎯 오늘의 미션 ('+done+'/3)</div>';
  MISSION_DEFS.forEach((d,i)=>{ const ok=missions.claimed[i]; const p=Math.min(missions.prog[i],d.goal);
    h+='<div class="mrow'+(ok?' done':'')+'"><span>'+(ok?'✅ ':'▫️ ')+d.txt+'</span><span>'+(ok?'❤️+'+d.rw:p+'/'+d.goal)+'</span></div>'; });
  el.innerHTML=h; }

// ── 황금 찬스(제한시간 라운드, 큰 보상) ──
let isGolden=false, goldenT=0; const GOLDEN_MAX=8, GOLDEN_RW=3;
function rollGolden(isSecret){ isGolden=false; $('goldBar').classList.add('hidden');
  if(isSecret) return;
  if(Math.random()<0.15){ isGolden=true; goldenT=GOLDEN_MAX; $('goldBar').classList.remove('hidden'); $('goldFill').style.width='100%'; } }
function goldenExpire(){ isGolden=false; $('goldBar').classList.add('hidden'); flash('⏰ 황금 찬스 놓침!','#ffcf66'); tone(160,0.2,'sawtooth',0.1); setTimeout(()=>{ if(state==='aimX'||state==='aimY') newRound(); },700); }

// ── 랭킹(로컬 명예의 전당 + Firebase 글로벌) ──
// ▼▼▼ 글로벌 랭킹: Firebase Realtime DB URL만 넣으면 자동 활성화 (예: https://xxxx-default-rtdb.firebaseio.com) ▼▼▼
const PPOPGI_FB_URL = (window.PPOPGI_FB_URL||"").replace(/\/$/,'');
// ▲▲▲ 비워두면 로컬(내 기록)만 동작 ▲▲▲
function fbOn(){ return !!PPOPGI_FB_URL; }
function myUid(){ let u=localStorage.getItem('ppopgi_uid'); if(!u){ u='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); localStorage.setItem('ppopgi_uid',u); } return u; }
function myName(){ let n=localStorage.getItem('ppopgi_name'); if(!n){ n='뽑기러'+Math.floor(1000+Math.random()*9000); localStorage.setItem('ppopgi_name',n); } return n; }
function setMyName(n){ n=(n||'').trim().slice(0,12); if(n){ localStorage.setItem('ppopgi_name',n); submitScore(); } }
let _submitBusy=false;
function submitScore(){ if(!fbOn()||_submitBusy) return; _submitBusy=true;
  const sec=THEMES.filter(t=>secretCaught(t)).length;
  const body={ name:myName(), best:bestStreak, total:totalCaught, dex:totalCaughtDolls(), secret:sec, title:curTitle().n };
  fetch(PPOPGI_FB_URL+'/ppopgi_lb/'+myUid()+'.json',{method:'PUT',body:JSON.stringify(body)}).catch(()=>{}).finally(()=>{ _submitBusy=false; });
}
function fetchGlobalTop(cb){ if(!fbOn()){ cb(null); return; }
  fetch(PPOPGI_FB_URL+'/ppopgi_lb.json').then(r=>r.json()).then(obj=>{
    if(!obj){ cb([]); return; }
    const arr=Object.keys(obj).map(k=>({uid:k,...obj[k]})).filter(x=>x&&typeof x.best==='number');
    arr.sort((a,b)=> (b.best-a.best) || ((b.total||0)-(a.total||0)) );
    cb(arr);
  }).catch(()=>cb(null));
}
function renderRank(){
  const sec=THEMES.filter(t=>secretCaught(t)).length; const T=curTitle();
  $('rankMe').innerHTML='👑 <b style="color:#ffd34d">'+T.n+'</b> · <span style="opacity:.8">'+myName()+'</span> <span id="nameEdit" style="cursor:pointer;opacity:.7">✏️</span>';
  const localRows=[['🔥 최고 연속',bestStreak+'연속'],['🧸 누적 수집',totalCaught+'마리'],['📖 도감',totalCaughtDolls()+'/'+TOTAL_DOLLS],['✨ 시크릿',sec+'/'+THEMES.length],['📅 출석',attStreak()+'일']];
  if(!fbOn()){
    $('rankList').innerHTML=localRows.map(r=>'<div class="rkrow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
    $('rankNote').textContent='🌐 글로벌 랭킹은 서버 연결 시 활성화돼요 (지금은 내 기록).';
  } else {

    $('rankList').innerHTML='<div class="rkrow"><span>🌐 글로벌 랭킹 불러오는 중…</span></div>';
    $('rankNote').textContent='🌐 전 세계 최고 연속 기록 순위';
    fetchGlobalTop(top=>{
      if(!top){ $('rankList').innerHTML=localRows.map(r=>'<div class="rkrow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join(''); $('rankNote').textContent='⚠️ 글로벌 연결 실패 — 내 기록만 표시'; bindNameEdit(); return; }
      const uid=myUid(); const myIdx=top.findIndex(x=>x.uid===uid);
      let h='';
      top.slice(0,20).forEach((x,i)=>{ const me=x.uid===uid; const medal=['🥇','🥈','🥉'][i]||('<b style="opacity:.6">'+(i+1)+'</b>');
        h+='<div class="rkrow"'+(me?' style="background:rgba(255,211,77,.18);border:1px solid rgba(255,211,77,.5)"':'')+'><span>'+medal+' '+(x.name||'익명').replace(/[<>]/g,'')+(me?' <b>(나)</b>':'')+'</span><b>🔥'+x.best+' · 🧸'+(x.total||0)+'</b></div>'; });
      if(myIdx>=20){ h+='<div style="text-align:center;opacity:.5;font-size:12px">⋯</div>'; const x=top[myIdx]; h+='<div class="rkrow" style="background:rgba(255,211,77,.18);border:1px solid rgba(255,211,77,.5)"><span><b>'+(myIdx+1)+'위</b> '+(x.name||'나')+' <b>(나)</b></span><b>🔥'+x.best+'</b></div>'; }
      $('rankList').innerHTML=h || '<div class="rkrow"><span>아직 기록이 없어요 — 1등 도전!</span></div>';
      $('rankNote').textContent='🌐 전 세계 '+top.length+'명 중 '+(myIdx>=0?(myIdx+1)+'위':'미등록')+' · 최고 연속 기준';
      bindNameEdit();
    });
  }
  bindNameEdit();
}
function bindNameEdit(){ const e=$('nameEdit'); if(e) e.onclick=()=>{ const n=prompt('랭킹에 표시할 이름 (최대 12자)', myName()); if(n!=null){ setMyName(n); renderRank(); } }; }

  const T=curTitle(), nx=nextTitle();

// ── 배너광고 ──
let bannerShown=false;
async function showBanner(){ const C=window.Capacitor; if(!(C&&C.Plugins&&C.Plugins.AdMob)||bannerShown) return; bannerShown=true; try{ await C.Plugins.AdMob.showBanner({adId:'ca-app-pub-3940256099942544/6300978111',adSize:'BANNER',position:'BOTTOM_CENTER',margin:0,isTesting:true}); }catch(e){ bannerShown=false; } }
async function hideBanner(){ const C=window.Capacitor; if(!(C&&C.Plugins&&C.Plugins.AdMob)||!bannerShown) return; bannerShown=false; try{ await C.Plugins.AdMob.hideBanner(); }catch(e){} }

// ── 공유(바이럴) ──
function shareGame(){ const txt='모두의 뽑기 🧸 도감 '+totalCaughtDolls()+'/'+TOTAL_DOLLS+' · 최고 연속 '+bestStreak+'회! 나도 도전 👉\nhttps://seungiljang.github.io/games/ppopgi.html';
  try{ if(navigator.share){ navigator.share({title:'모두의 뽑기',text:txt}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(txt); flash('📋 복사됨!','#7cf6ff'); }catch(e){} }

// ── 화면 전환 ──
function toStart(){ state='start'; isGolden=false; $('goldBar').classList.add('hidden'); renderLives(); $('combo').textContent=''; $('lastAccTop').textContent=''; $('streak').textContent=''; $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); $('start').classList.remove('hidden'); renderHearts(); renderStartStats(); renderMeta(); renderDexGrid(); showBanner(); submitScore(); }
function showNoHearts(){ state='result'; $('over').classList.add('hidden'); $('start').classList.add('hidden'); $('heartMsg').innerHTML='다음 하트까지 <b>'+heartTimer()+'</b><br>지금 바로 하려면 광고로 하트 +5!'; $('noheart').classList.remove('hidden'); showBanner(); }
function startRound(goal){ loadHearts(); if(hearts<=0){ showNoHearts(); return; } if(hearts===MAX_HEARTS) heartTs=Date.now(); hearts--; saveHearts(); renderHearts(); lives=MAX_LIVES; renderLives(); $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); hideBanner(); newRound(goal); }

// 버튼
function begin(){ try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} $('start').classList.add('hidden'); clawBonus=0; startRound(); }
$('startBtn').onclick=begin;
$('shareBtn').onclick=shareGame;
$('retryBtn').onclick=()=>{ clawBonus=0; startRound(window._goal); };
$('reviveBtn').onclick=()=>{ playAd(()=>{ $('over').classList.add('hidden'); clawBonus=0.3; lives=MAX_LIVES; renderLives(); flash('집게 힘 +30% · 생명 💗💗 회복!','#7cf6ff'); hideBanner(); newRound(window._goal); }); };
$('heartAdBtn').onclick=()=>{ playAd(()=>{ addHearts(5); flash('❤️ 하트 +5!','#ff6a9a'); startRound(); }); };
$('heartWaitBtn').onclick=toStart;
$('rankBtn').onclick=()=>{ renderRank(); $('rank').classList.add('show'); };
$('rankClose').onclick=()=>{ $('rank').classList.remove('show'); };
// 초기 화면
(function initAds2(){ setTimeout(showBanner,800); })();
loadMissions();
(function initDaily(){ const a=checkAttendance(); if(!a.already && a.reward>0){ setTimeout(()=>flash('📅 출석 '+a.streak+'일차! ❤️+'+a.reward,'#7cf6ff'),900); } renderMeta(); })();
renderDexGrid(); loadHearts(); renderHearts(); renderStartStats(); renderMeta(); $('dex').textContent=THEME().ico+' '+THEME().name+' '+themeCaught(THEME())+'/'+THEME().dolls.length+' · 전체 '+totalCaughtDolls()+'/'+TOTAL_DOLLS;
</script>
</body></html>
