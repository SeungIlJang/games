<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 뽑기</title>
<style>
  html,body{margin:0;height:100%;background:#120e1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
  canvas{display:block}
  /* 상단 목표 */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;pointer-events:none}
  #goalLbl{font-size:13px;color:#ffb0e6;letter-spacing:1px}
  #goal{font-size:24px;font-weight:900;margin-top:1px;text-shadow:0 0 16px rgba(255,120,220,.5)}
  #dex{font-size:13px;color:#9fe;margin-top:2px;font-weight:700}
  #hearts{font-size:14px;font-weight:800;color:#ff6a9a;margin-bottom:2px}
  #lives{font-size:16px;font-weight:800;margin-top:2px;min-height:20px}
  #lastAccTop{font-size:15px;font-weight:800;margin-top:3px;min-height:18px}
  #noheart{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.95);z-index:11;text-align:center;padding:24px}
  #streak{font-size:12px;color:#ffcf66;margin-top:2px;font-weight:800;min-height:16px}
  /* 하단 안내/버튼 */
  #hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:3;font-size:17px;font-weight:800;color:#ffe;pointer-events:none;min-height:24px}
  #ver{position:fixed;left:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;color:#5a4a70;z-index:4}
  .flash{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:40px;font-weight:900;z-index:8;pointer-events:none;text-align:center;white-space:nowrap;animation:fl 1s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
  .btn{background:#ff4db8;color:#fff;border:none;border-radius:16px;padding:15px 30px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #b81f7f;cursor:pointer}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.94);z-index:10;text-align:center;padding:24px}
  .hidden{display:none!important}
  h1{font-size:40px;margin:0;text-shadow:0 0 22px rgba(255,80,200,.5)}
  .sub{color:#e9c9ff;opacity:.9;font-size:15px;line-height:1.5}
  #changelog{margin-top:14px;font-size:12px;color:#9fe;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:7px 12px;max-width:320px}
  #dexGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 2px}
  .dcell{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:26px}
  .dcell.lock{filter:grayscale(1);opacity:.28}
  #overTitle{font-size:34px}
  #reviveBtn{background:#2ec77a;box-shadow:0 6px 0 #1a8a52}
  #gripWrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none}
  #gripLbl{font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,90,110,.6);margin-bottom:6px;animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  #gripBar{width:72%;max-width:300px;height:20px;margin:0 auto;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #gripFill{height:100%;width:100%;background:#5cffb0;border-radius:10px;transition:width .05s linear}
  #combo{font-size:22px;font-weight:900;margin-top:3px;min-height:26px;letter-spacing:1px;text-shadow:0 0 14px rgba(255,140,40,.7)}
  .dcell.secret{background:linear-gradient(135deg,rgba(255,92,225,.18),rgba(124,180,255,.18));border:1.5px solid rgba(255,120,220,.5)}
  .dcell.secret.ready{animation:secglow 1s ease-in-out infinite alternate;filter:none;opacity:1}
  @keyframes secglow{from{box-shadow:0 0 4px rgba(255,120,220,.4)}to{box-shadow:0 0 16px rgba(255,120,220,.95)}}
  #start{overflow-y:auto;justify-content:flex-start;
    padding-top:calc(38px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}   /* 위=상태바 여백 */
  #over,#noheart{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  /* 배너 광고가 떠 있을 땐 오버레이를 배너 위에서 끝냄(겹침 원천 차단) */
  body.has-banner #start,body.has-banner #over,body.has-banner #noheart{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  /* 시작화면 압축 — 스크롤 없이 한 화면에 */
  #start{gap:5px;padding-top:calc(30px + env(safe-area-inset-top,0px));justify-content:space-between}
  #collWrap{width:86%;max-width:340px}
  #collBar{height:16px;background:rgba(255,255,255,.09);border-radius:9px;overflow:hidden;border:1px solid rgba(255,120,220,.35)}
  #collFill{height:100%;background:linear-gradient(90deg,#ff5ce1,#ffd34d);width:0%;transition:width .5s ease-out}
  #collTxt{font-size:12px;color:#ffd9f6;margin-top:4px;font-weight:800}
  #start h1{font-size:29px}
  #start .sub{font-size:12.5px;line-height:1.35}
  #start #titleBadge{font-size:13px;margin-top:-2px}
  #start #themeHdr{font-size:13.5px!important;margin-bottom:1px!important}
  #start #dexGrid{gap:5px;margin:1px 0}
  #start .dcell{width:33px;height:33px;font-size:18px;border-radius:8px}
  #start #trophyRow{gap:5px;margin:0}
  #start #trophyRow .trophy{width:27px;height:27px;font-size:14px}
  #start #startStats{font-size:11.5px!important}
  #start #missionBox{padding:6px 11px;font-size:11.5px}
  #start #missionBox .mtit{margin-bottom:1px}
  #start .mrow{padding:1px 0}
  #start #metaBox{font-size:11px;line-height:1.3}
  #start #changelog{margin-top:5px;font-size:10px;padding:5px 9px}
  #start .btn{padding:12px 20px;font-size:17px}
  #titleBadge{font-size:15px;font-weight:900;color:#ffd34d;text-shadow:0 0 10px rgba(255,211,77,.5);margin-top:-4px}
  #metaBox{font-size:12.5px;color:#cfe;opacity:.92;line-height:1.55}
  #missionBox{background:rgba(124,180,255,.1);border:1px solid rgba(124,180,255,.32);border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:330px;width:86%;text-align:left}
  #missionBox .mtit{font-weight:800;color:#bfe0ff;margin-bottom:3px}
  .mrow{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .mrow.done{color:#7cffb0;opacity:.75}
  #rank{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.96);z-index:12;padding:24px;text-align:center}
  #rank.show{display:flex}
  #rankList{width:88%;max-width:340px;text-align:left;font-size:14px}
  .rkrow{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05);margin:4px 0}
  #goldBar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none}
  #goldLbl{font-size:16px;font-weight:900;color:#ffd34d;text-shadow:0 0 12px rgba(255,211,77,.7)}
  #goldTrack{width:70%;max-width:300px;height:12px;margin:5px auto 0;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;border:2px solid #ffd34d}
  #goldFill{height:100%;background:linear-gradient(90deg,#ffe066,#ffb04d);width:100%;transition:width .1s linear}
  #trophyRow{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}
  .trophy{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.35;border:1px solid transparent}
  .trophy.master{filter:none;opacity:1;background:linear-gradient(135deg,#ffe066,#ffb04d);border:1px solid #fff2c0;box-shadow:0 0 10px rgba(255,211,77,.8);color:#4a2e00}
</style></head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="muteBtn" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:9;font-size:22px;cursor:pointer;pointer-events:auto;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6)">🔊</div>
<div id="top">
  <div id="hearts"></div>
  <div id="goalLbl">🎯 이번 목표</div>
  <div id="goal">–</div>
  <div id="dex">도감 0/10</div>
  <div id="lives"></div>
  <div id="combo"></div>
  <div id="lastAccTop"></div>
  <div id="streak"></div>
</div>
<div id="gripWrap" class="hidden"><div id="gripLbl">🔥 탭 연타! 꽉 잡아!</div><div id="gripBar"><div id="gripFill"></div></div></div>
<div id="goldBar" class="hidden"><div id="goldLbl">⚡ 황금 찬스!</div><div id="goldTrack"><div id="goldFill"></div></div></div>
<div id="hint"></div>
<div id="ver">v2.9 · 효과음 18종 적용 (합성음 폴백 유지)</div>

<div id="start">
  <h1>모두의 뽑기</h1>
  <div id="titleBadge"></div>
  <div class="sub" style="font-size:14px"><b>탭 2번</b>으로 <b style="color:#7cffb0">정가운데</b>에 멈추면 성공! (초반 크게→갈수록 작게)</div>
  <div class="sub" id="themeHdr" style="font-weight:800;font-size:15px;margin-bottom:4px"></div>
  <div id="trophyRow"></div>
  <div id="dexGrid"></div>
  <div class="sub" id="startStats" style="font-size:13px;opacity:.85"></div>
  <div id="missionBox"></div>
  <div id="metaBox"></div>
  <div id="collWrap"><div id="collBar"><div id="collFill"></div></div><div id="collTxt"></div></div>
  <div id="pending"></div>
  <button class="btn" id="startBtn" style="width:86%;max-width:340px">뽑으러 가기</button>
  <div style="display:flex;gap:8px;justify-content:center">
    <button class="btn" id="rankBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:13px 26px">🏅 랭킹</button>
    <button class="btn" id="shareBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:13px 26px">🔗 공유</button>
  </div>
  <div id="changelog">🆕 <b>v2.9</b> · 🔊효과음 18종! 집게·획득·등급별 팡파레<br><b>v2.8</b> · 🧸인형 55종 그림 · <b>v2.7</b> · ⚡황금 찬스 알림 · <b>v2.6</b> · 난이도 완화</div>
</div>

<div id="rank">
  <div style="font-size:30px;font-weight:900">🏅 명예의 전당</div>
  <div class="sub" id="rankMe" style="font-size:13px"></div>
  <div id="rankList"></div>
  <div class="sub" id="rankNote" style="font-size:11px;opacity:.6"></div>
  <button class="btn" id="rankClose" style="background:#3a4568;box-shadow:0 6px 0 #222a44">닫기</button>
</div>

<div id="noheart" class="hidden">
  <div style="font-size:56px">💔</div>
  <div style="font-size:30px;font-weight:900">하트를 다 썼어요</div>
  <div class="sub" id="heartMsg"></div>
  <button class="btn" id="heartAdBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52">🎬 광고 보고 하트 +5</button>
  <button class="btn" id="heartWaitBtn" style="background:#3a4568;box-shadow:0 6px 0 #222a44">기다리기 (첫 화면)</button>
</div>

<div id="over" class="hidden">
  <div id="overTitle">아—! 놓쳤다</div>
  <div class="sub" id="overMsg"></div>
  <div id="overPending"></div>
  <button class="btn" id="reviveBtn">🎬 광고 보고 재도전 (집게 힘 +30%)</button>
  <button class="btn" id="retryBtn" style="background:#3a7bff;box-shadow:0 6px 0 #1f52c0">다시 도전</button>
  <div class="sub" style="opacity:.7">도감 <b id="overDex">0/10</b></div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.random()*(b-a)+a, clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ── 음소거 ──
let muted = (()=>{ try{ return localStorage.getItem('ppopgi_mute')==='1'; }catch(e){ return false; } })();
function renderMute(){ const b=$('muteBtn'); if(b) b.textContent=muted?'🔇':'🔊'; }
// ── 오디오 ──
let AC; function tone(f,d,type,g){ if(muted)return; try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v);v.connect(AC.destination); const t=AC.currentTime;o.start(t); v.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1)); o.stop(t+(d||0.1)); }catch(e){} }
function chord(b){[0,4,7,12].forEach((s,i)=>setTimeout(()=>tone(b*Math.pow(2,s/12),0.18,'triangle',0.07),i*70));}
function vib(m){try{navigator.vibrate&&navigator.vibrate(m);}catch(e){}}
// ── 효과음 18종 (v2.9) ──
// assets/audio/sfx/*.wav 를 미리 디코딩해두고 재생한다. 파일이 없거나 디코딩에 실패하면
// 예전 합성음(tone/chord)으로 떨어진다 — 웹 배포본처럼 에셋이 없는 환경에서도 소리가 유지된다.
// 둘을 동시에 내지는 않는다(고음이 겹친다).
const SFX_DUR={ui_tap:0.13,aim_lock:0.32,claw_descend:0.65,claw_grab:0.25,claw_lift:0.8,grip_slip:0.29,
  tension_pulse:0.36,prize_drop:0.45,miss:0.52,near_miss:0.73,win_common:0.85,win_rare:1.18,win_legend:1.65,
  win_secret:2.4,new_collection:0.72,combo:0.62,theme_complete:2.2,golden_chance:1.0};
const sfxBuf={}; let voices=[]; const MAX_VOICES=4;
function audioCtx(){ try{ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function loadSfx(){ const ctx=audioCtx(); if(!ctx) return;
  Object.keys(SFX_DUR).forEach(id=>{ if(id in sfxBuf) return; sfxBuf[id]=undefined;
    fetch('assets/audio/sfx/'+id+'.wav').then(r=>r.ok?r.arrayBuffer():Promise.reject(0))
      .then(ab=>new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no)))
      .then(b=>{ sfxBuf[id]=b; }).catch(()=>{ sfxBuf[id]=null; }); });   // null = 폴백 대상
}
function play(id,opt){ opt=opt||{};
  if(muted) return;
  const buf=sfxBuf[id];
  if(!buf){ if(!opt.delay) sfxFallback(id); else setTimeout(()=>sfxFallback(id),opt.delay*1000); return; }
  const ctx=audioCtx(); if(!ctx) return;
  voices=voices.filter(v=>!v.done);
  while(voices.length>=MAX_VOICES){ const v=voices.shift(); try{ v.src.stop(); }catch(e){} v.done=true; }
  try{
    const src=ctx.createBufferSource(), g=ctx.createGain();
    src.buffer=buf; g.gain.value=(opt.gain==null?1:opt.gain);
    src.connect(g); g.connect(ctx.destination);
    src.start(ctx.currentTime+(opt.delay||0));     // 실제 오디오 시간 — 슬로모션 dt를 쓰지 않는다
    const v={src:src,tag:opt.tag||'',done:false};
    src.onended=()=>{ v.done=true; };
    voices.push(v);
  }catch(e){}
}
function stopTag(tag){ voices.forEach(v=>{ if(v.tag===tag&&!v.done){ try{ v.src.stop(); }catch(e){} v.done=true; } }); }
function stopAllSfx(){ voices.forEach(v=>{ try{ v.src.stop(); }catch(e){} v.done=true; }); voices=[]; }
let lastTap=0;
function uiTap(){ const n=performance.now(); if(n-lastTap<60) return; lastTap=n; play('ui_tap'); }  // 연타 제한
function sfxFallback(id){ switch(id){           // 파일이 없을 때만 쓰는 예전 합성음
  case 'ui_tap': case 'aim_lock': tone(700,0.05,'square',0.08); break;
  case 'claw_grab': tone(180,0.08,'square',0.12); break;
  case 'grip_slip': tone(110,0.07,'sawtooth',0.12); break;
  case 'tension_pulse': tone(70,0.09,'sine',0.16); break;
  case 'prize_drop': tone(220,0.09,'sine',0.10); break;
  case 'miss': case 'near_miss': tone(150,0.3,'sawtooth',0.12); setTimeout(()=>tone(100,0.3,'sawtooth',0.1),100); break;
  case 'win_common': chord(523); setTimeout(()=>chord(784),150); break;
  case 'win_rare': chord(523); setTimeout(()=>chord(784),150); setTimeout(()=>chord(1046),300); break;
  case 'win_legend': chord(523); setTimeout(()=>chord(784),150); setTimeout(()=>chord(1046),300); setTimeout(()=>chord(1318),450); break;
  case 'win_secret': chord(523); setTimeout(()=>chord(1046),200); setTimeout(()=>chord(1568),400); setTimeout(()=>chord(2637),620); break;
  case 'new_collection': tone(1200,0.09,'triangle',0.09); break;
  case 'combo': chord(880); break;
  case 'theme_complete': chord(659); setTimeout(()=>chord(988),200); break;
  case 'golden_chance': chord(1046); break;
} }
// 앱이 가려지면 재생 중인 소리와 예약된 소리를 모두 끊는다(복귀 시 밀린 소리가 몰리지 않게)
addEventListener('visibilitychange',()=>{ if(document.hidden) stopAllSfx(); });
// 첫 터치에서 AudioContext 잠금 해제. 디코딩은 suspended 상태에서도 되므로 미리 돌려둔다
// (시작 화면의 랭킹·공유 버튼은 begin() 전에 눌리기 때문)
addEventListener('pointerdown',()=>{ audioCtx(); },{once:true});
let pulseT=0;
// ── 광고(리워드/전면/배너) ──
// 출시 절차: AdMob에서 광고단위 3종을 만들어 _REAL 에 채우고 AD_USE_TEST=false 로만 바꾼다.
// _REAL 이 비어 있으면 광고 호출 자체를 건너뛴다(빈 adId 로 요청하지 않음).
const AD_USE_TEST=true, AD_REWARD_TEST='ca-app-pub-3940256099942544/5224354917', AD_REWARD_REAL='';
const AD_INTER_TEST='ca-app-pub-3940256099942544/1033173712', AD_INTER_REAL='';
// 배너는 showBanner() 안에 테스트 ID가 직접 박혀 있어 실유닛으로 못 바꾸는 상태였다.
const AD_BANNER_TEST='ca-app-pub-3940256099942544/6300978111', AD_BANNER_REAL='';
const AD_BANNER = AD_USE_TEST ? AD_BANNER_TEST : AD_BANNER_REAL;
const AD_REWARD = AD_USE_TEST ? AD_REWARD_TEST : AD_REWARD_REAL;
const AD_INTER  = AD_USE_TEST ? AD_INTER_TEST  : AD_INTER_REAL;
let admobReady=false, adPlaying=false, interCount=0;
(async function(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob){ await C.Plugins.AdMob.initialize({initializeForTesting:AD_USE_TEST}); admobReady=true; } }catch(e){} })();
// 전면광고 — 게임오버 "다시 도전" 3회당 1번(너무 자주 X). 실패 시 조용히 넘어감.
async function showInterstitial(){ const C=window.Capacitor; if(!AD_INTER||!(admobReady&&C&&C.Plugins&&C.Plugins.AdMob))return; stopAllSfx(); const A=C.Plugins.AdMob; try{ await A.prepareInterstitial({adId:AD_INTER,isTesting:AD_USE_TEST}); await A.showInterstitial(); }catch(e){} }
async function playAd(cb){ if(adPlaying)return; adPlaying=true; stopAllSfx(); const C=window.Capacitor;

function pickTarget(){
  const T=THEME();

  if(secretUnlocked(T) && !secretCaught(T)) pool.push(T.secret);  // 시크릿 해금됐고 아직 못잡았으면 목표 후보(희귀)
  if(!pool.length){ pool=T.dolls.slice(); if(secretUnlocked(T)) pool.push(T.secret); }  // 다 모았으면 전체
  // 희귀도 가중: ★=3, ★★=2, ★★★=1, 시크릿=1 → 귀할수록 목표로 덜 나옴(간절함)
  const weighted=[]; pool.forEach(d=>{ const w=Math.max(1,4-d.r); for(let i=0;i<w;i++) weighted.push(d); });
  return weighted[Math.floor(Math.random()*weighted.length)];

function layoutField(goal){

  const set=[goal]; const others=THEME().dolls.filter(d=>d.n!==goal.n);
  for(let i=0;i<7;i++) set.push(others[Math.floor(Math.random()*others.length)]);
  // v2.8: 아트가 이모지보다 프레임을 꽉 채워서, 겹치면 목표 인형과 성공 존이 가려진다.
  // 목표(set[0])를 먼저 놓고 나머지가 피해 가도록 최소 간격을 두고 재추첨한다.
  // 세로가 짧은 화면에선 요구 간격이 물리적으로 불가능해질 수 있어 배치 가능 면적으로 상한을 둔다

      ok=dolls.every(o=>Math.hypot(o.x-x,o.y-y)>=minD);

const DIFF_SPAN=40;                           // 도감 40종까지 상승, 이후 고정
const DIFF_CAP=[null,0.72,0.76,0.80,0.83];    // ★ / ★★ / ★★★ / ✨시크릿 각각의 상한
function progress(){ return Math.min(totalCaughtDolls(),DIFF_SPAN)/DIFF_SPAN; }  // 0~1
function successThreshold(){
  const r=(dolls[target]&&dolls[target].r)||1;
  const base = 0.52                           // 첫 수집: 허용 오차 약 36px (아주 관대)
    + progress()*0.20                         // 도감 40종까지 완만히 상승
    + (r-1)*0.045                             // 희귀도 (★★ +4.5%p · ★★★ +9%p · 시크릿 +13.5%p)
    + Math.min(successStreak,5)*0.012;        // 연승 중엔 살짝 조임 (정방향 조정)
  const capped=Math.min(base, DIFF_CAP[r]||0.72);
  return clamp(capped - clawBonus*0.1 - Math.min(failStreak,6)*0.04, 0.40, 0.84); // 광고/연속실패 구제(최대 -0.24)
}
function dollSize(){ return Math.round(56 - progress()*10); } // 56px → 46px (과녁도 이 크기에 비례)
function accAt(px,py){ const t=dolls[target]; return clamp(1-Math.hypot(px-t.x,py-t.y)/accRadius(),0,1); }
function commit(){
  const t=dolls[target]; const dist=Math.hypot(cx-t.x, cy-t.y);
  const acc=clamp(1-dist/accRadius(),0,1);          // 1 = 정가운데
  window.lastAcc=Math.round(acc*100); const thr=successThreshold(); window.lastThresh=Math.round(thr*100);
  const grab = acc>=0.45;                            // 어느정도 가까우면 집긴 함(니어미스 연출)
  const success = acc>=thr;                          // 성공 존 안이면 성공(초반 큼→후반 작음)
  outcome={grab, success, nearMiss:grab&&!success, acc};
  const col = success?'#7cffb0':(outcome.nearMiss?'#ffcf66':'#ff8a8a');
  $('lastAccTop').innerHTML='🎯 최종 정확도 <b style="color:'+col+'">'+window.lastAcc+'%</b> <span style="opacity:.6">(성공 '+window.lastThresh+'%↑)</span> '+(success?'✅':'❌');
  playCount++; try{localStorage.setItem('ppopgi_plays',playCount);}catch(e){}
  startSpectate();
}
function startSpectate(){
  state='drop'; claw.phase='descend'; claw.x=cx; anim=0; pulseT=performance.now(); shakeN=0; claw.grip=1;
  play('claw_descend',{tag:'motor'});
  $('hint').textContent=''; $('gripWrap').classList.add('hidden'); $('goldBar').classList.add('hidden'); // 조준 완료 → 황금 타이머 멈춤(결정됨)
}

// 관전 시퀀스 진행
function stepSpectate(dt){
  const t=dolls[target]; anim+=dt;
  // 하강·집기=정상속도 / 들어올려 가져오는 순간부터 슬로모션(긴장감)
  timeScale = (claw.phase==='descend'||claw.phase==='close') ? 1 : 0.5;
  // 매달린 인형 흔들림(진자)
  if(claw.holding){ claw.sway = Math.sin(anim*7)*0.12 + Math.sin(anim*40)*shakeMag*0.01; }
  // 긴장음: 슬로모션 dt가 아니라 실제 시간 기준 950ms 간격, 투입 단계에선 멈춘다
  if(claw.phase!=='deposit'){ const nw=performance.now(); if(nw-pulseT>=950){ pulseT=nw; play('tension_pulse',{tag:'motor',gain:0.85}); } }
  if(claw.phase==='descend'){
    claw.y += 420*dt;
    const ty = outcome.grab ? t.y : cy;
    if(claw.y>=ty){ claw.y=ty; claw.open=0; claw.phase='close'; anim=0; stopTag('motor'); play('claw_grab'); vib(20); }
  } else if(claw.phase==='close'){
    if(anim>0.28){
      if(outcome.grab){ t.held=true; claw.holding=t; claw.phase='lift'; }
      else { claw.phase='liftEmpty'; } // 빗나감
      anim=0; play('claw_lift',{tag:'motor'});   // 상태 전환 시 1회 (매 프레임 아님)
    }
  } else if(claw.phase==='lift'){
    // 니어미스면 들어올릴 때부터 그립이 스멀스멀 풀림 → "떨어질 것 같다" 예감
    if(outcome.nearMiss) claw.grip=Math.max(0.45, claw.grip - dt*0.30); else claw.grip=1;
    claw.open=clamp((1-claw.grip)*0.7+0.05,0.05,0.5);
    const slipL=(1-claw.grip)*16;
    claw.y-=300*dt; if(claw.holding){ claw.holding.x=claw.x; claw.holding.y=claw.y+34+slipL; }
    if(claw.y<=field().y-30){ claw.y=field().y-30; claw.phase='carry'; anim=0; shakeN=0; }
  } else if(claw.phase==='carry'){
    // 출구로 이동 (탭 없음 — 성공/실패는 조준 정밀도로 이미 결정됨)
    claw.x += (34-claw.x)*Math.min(1,dt*2.0);
    if(outcome.nearMiss){
      claw.grip -= dt*0.5;                                             // 계속 풀림
      const shakeAt=[0.35,0.8];
      if(shakeN<shakeAt.length && anim>=shakeAt[shakeN]){ shakeN++; shakeMag=16; screenShake=Math.max(screenShake,6); claw.grip-=0.18; play('grip_slip'); vib([15,35]); burst(claw.x-4,claw.y+44,'#bfe0ff',6); }
      $('hint').textContent = claw.grip<0.5?'앗, 미끄러진다…!':'불안하게 흔들린다…';
      if(claw.grip<=0.02){ $('hint').textContent=''; claw.phase='drop'; anim=0; }
    } else { claw.grip=1; }
    const g=claw.grip;
    claw.open=clamp((1-g)*0.75+0.05,0.05,0.85);
    const slip=(1-g)*30;
    if(claw.holding){ claw.holding.x=claw.x+Math.sin(anim*30)*shakeMag*0.2; claw.holding.y=claw.y+34+slip; }
    shakeMag*=0.92;
    timeScale = (outcome.nearMiss && g<0.45)?0.4:0.6;                  // 위기 슬로모
    if(outcome.success && anim>1.6){ claw.phase='deposit'; anim=0; }
  } else if(claw.phase==='drop'){
    claw.open=0.9; // 집게 완전히 벌어짐(놓침)
    // 출구 바로 앞에서 낙하 (아—! 놓쳤다)
    if(claw.holding){ claw.holding.vy=(claw.holding.vy||0)+900*dt; claw.holding.y+=claw.holding.vy*dt; claw.holding.x+=20*dt;
      if(claw.holding.y>field().y+field().h-20){ endResult(false,'near'); } }
    else endResult(false,'near');
  } else if(claw.phase==='liftEmpty'){
    claw.y-=300*dt; if(claw.y<=field().y-30){ endResult(false,'miss'); }
  } else if(claw.phase==='deposit'){
    if(claw.holding){ claw.holding.y+=500*dt; claw.holding.x=claw.x; if(claw.holding.y>H*0.9){ endResult(true); } }
    else endResult(true);
  }
}
function endResult(win, kind){
  if(state==='result') return; state='result'; timeScale=1; claw.sway=0; $('gripWrap').classList.add('hidden');
  const goal=window._goal;
  if(win){
    const T=THEME(); const id=did(T,goal.n); const wasNew=!dex.includes(id);
    const isSecret = goal.r>=4;
    if(wasNew){ dex.push(id); saveDex(dex); }
    failStreak=0; try{localStorage.setItem('ppopgi_fs',0);}catch(e){}
    clawBonus=0;
    successStreak++; totalCaught++; if(successStreak>bestStreak) bestStreak=successStreak; saveStats();
    renderCombo(); missionOnWin(goal);
    const wasGolden=isGolden; isGolden=false; $('goldBar').classList.add('hidden');
    const R=rar(goal.r); const rr=Math.min(goal.r,3);
    // 보상: 희귀도(★★=1·★★★=2·시크릿=3) + 콤보 마일스톤(3·6·9…연속마다 +1) + 황금찬스(+3)
    const comboBonus = (successStreak>=3 && successStreak%3===0) ? 1 : 0;
    const revBonus = isRevenge ? 1 : 0;   // v2.7: 복수 성공에 실제 보상(예전엔 글자만 바뀌고 얻는 게 없었다)
    const heartReward = (goal.r-1) + comboBonus + revBonus + (wasGolden?GOLDEN_RW:0); if(heartReward>0){ addHearts(heartReward); }
    if(wasGolden){ setTimeout(()=>{ flash('⚡ 황금 대박! ❤️+'+GOLDEN_RW,'#ffd34d'); confetti(claw.x,H*0.42,120); burst(claw.x,H*0.42,'#ffd34d',50); },300); screenShake=Math.max(screenShake,12); } // 소리는 등급 획득음 하나로 통일(겹침 방지)
    const head = isSecret ? '✨🌟 시크릿 GET! 🌟✨' : (goal.r>=3 ? '🌟 전설 GET! 🌟' : (goal.r===2 ? '✨ GET! ' : '🎉 GET! '));
    const revTxt = isRevenge ? ' 😤복수성공! ❤️+1' : ''; if(isRevenge) setRevenge(null);
    flash(head+goal.e+' '+goal.n+revTxt+(successStreak>=3?(' 🔥'+successStreak+'연속!'):'')+(heartReward>0?(' ❤️+'+heartReward):''), R.hex);
    const conf=(50+rr*rr*35)+successStreak*15;          // 희귀도 제곱 + 콤보 가중
    confetti(claw.x,H*0.42,conf); burst(claw.x,H*0.5,'#ffffff',20+rr*14);
    // ── 결과음: 등급에 맞는 획득음 하나만 고른다 ──
    stopTag('motor');
    const winId = isSecret?'win_secret':(goal.r>=3?'win_legend':(goal.r===2?'win_rare':'win_common'));
    let soundEnd;
    if(isSecret){ stopAllSfx(); play('win_secret',{delay:0.12}); soundEnd=0.12+SFX_DUR.win_secret; }  // 기대 정적 120ms
    else { play('prize_drop'); play(winId,{delay:0.18}); soundEnd=0.18+SFX_DUR[winId]; }
    if(goal.r>=3){ setTimeout(()=>burst(claw.x,H*0.42,R.hex,50),200); }
    if(isSecret){ setTimeout(()=>{confetti(W/2,H*0.4,140);burst(W/2,H*0.42,R.hex,60);},300); }
    if(comboBonus){ setTimeout(()=>flash('🔥 '+successStreak+'콤보! ❤️+1','#ff8a4d'),520); }
    vib(goal.r>=3?[20,40,20,40,20,40,120]:[20,40,20,40,90]); screenShake=8+rr*rr*2; flashA=1; flashCol=R.c;
    renderDexGrid();
    const done=themeCaught(T);
    $('dex').textContent=T.ico+' '+T.name+' '+done+'/'+T.dolls.length+(secretCaught(T)?' +✨':'')+' · 전체 '+totalCaughtDolls()+'/'+TOTAL_DOLLS;
    let delay=1200, milestone=false;   // milestone = 완성음을 쓴 경우(콤보·신규등록음을 대체한다)
    const baseComplete = done>=T.dolls.length;
    if(baseComplete && T.secret && !secretCaught(T)){
      // 기본 10종 완성 → 시크릿 보스 등장 예고 (테마 유지, 다음 목표=시크릿)
      if(wasNew && !isSecret){
        milestone=true; play('theme_complete',{delay:soundEnd+0.15});
        setTimeout(()=>{ flash('🎊 기본 10종 완성! ✨ 시크릿 '+T.secret.e+' 등장!','#ff5ce1'); burst(W/2,H*0.42,'#ff5ce1',80); screenShake=12; },900);
        delay=2600;
      }
    } else if(baseComplete && (!T.secret || secretCaught(T))){
      // 테마 완전 마스터(기본10 + 시크릿)
      milestone=true; play('theme_complete',{delay:soundEnd+0.15});
      if(curTheme < THEMES.length-1){
        const nx=THEMES[curTheme+1];
        setTimeout(()=>{ flash((isSecret?'✨ 시크릿까지 완성! ':'')+T.name+' 테마 마스터!','#ffd34d'); burst(W/2,H*0.4,'#ffd34d',90); screenShake=14; },900);
        setTimeout(()=>flash('🏆 '+T.ico+' 황금 '+T.name+' 테마 해금!','#ffe066'),1500);
        setTimeout(()=>{ curTheme++; try{localStorage.setItem('ppopgi_theme',curTheme);}catch(e){} flash('🔓 새 테마 해금! '+nx.ico+' '+nx.name,'#7cf6ff'); preloadTheme(THEME(),renderDexGrid); renderStartStats(); },2100);
        delay=3200;
      } else {
        setTimeout(()=>{ flash('👑 전체 마스터! 55종 완성!','#ffd34d'); burst(W/2,H*0.4,'#ffd34d',120); screenShake=18; },900);
        delay=3000;
      }
    }
    // 완성음이 없을 때만 — 신규 등록이 우선, 그 외 연속 성공이면 콤보음 (획득음과 겹치지 않게 뒤에 붙인다)
    if(!milestone){
      if(wasNew) play('new_collection',{delay:soundEnd+0.10});
      else if(successStreak>=2) play('combo',{delay:soundEnd+0.10});
    }
    rollNextGolden();   // v2.7: 다음 판 황금 찬스를 '지금' 굴려서 끝나는 순간 예고 → "한 판 더"의 이유
    if(nextGolden) setTimeout(()=>flash('⚡ 다음 판 황금 찬스!','#ffd34d'), Math.max(600,delay-600));
    setTimeout(()=>{ startRound(); },delay);
  } else {
    isGolden=false; $('goldBar').classList.add('hidden');
    const brokeCombo = successStreak;   // 끊긴 콤보 수
    failStreak++; try{localStorage.setItem('ppopgi_fs',failStreak);}catch(e){}
    successStreak=0; renderCombo();
    setRevenge(did(THEME(),goal.n));    // 이 인형에 복수전 예약(앱을 꺼도 유지)
    const near = kind==='near';
    const gap = Math.max(0,(window.lastThresh||0)-(window.lastAcc||0));   // 성공까지 몇 %p 모자랐나
    const soClose = near && gap>0 && gap<=8;                              // 한 끗 차이
    flash(soClose?('😭 딱 '+gap+'% 차이!'):(near?'아—! 놓쳤다 😫':'빗나갔다 💨'), '#ff6a7a');
    // 집었다 놓친 경우만 낙하음 → 80ms 뒤 아쉬움음. 헛잡음은 miss 하나로 끝낸다(실패음 둘을 겹치지 않음)
    if(near){ play('prize_drop'); play('near_miss',{delay:SFX_DUR.prize_drop+0.08}); } else play('miss');
    if(brokeCombo>=3) setTimeout(()=>flash('💥 '+brokeCombo+'콤보 끊김!','#ff8a8a'),450);   // 콤보 상실 sting
    vib(200); screenShake=near?14:6;
    lives--; renderLives();
    if(lives>0){ // 생명 남음 → 같은 인형 다시 도전(하트 소모 없음)
      setTimeout(()=>flash((soClose?'🔥 한 끗! ':'')+'💗 생명 -1 · 남은 '+lives+'개, 다시!','#ffcf66'),700);
      setTimeout(()=>{ newRound(window._goal); },1550);
    } else { // 생명 소진 → 진짜 실패
      showBanner();
      $('overTitle').textContent = soClose?('😭 딱 '+gap+'% 차이!'):(near?'아—! 놓쳤다 😫':'빗나갔다 💨');
      $('overMsg').innerHTML = '정확도 <b style="color:'+(near?'#ffcf66':'#ff8a8a')+'">'+(window.lastAcc||0)+'%</b> <span style="opacity:.7">(성공 '+(window.lastThresh||95)+'%↑, '+(gap>0?gap+'% 부족':'아깝게')+')</span> · 💔 생명 0<br>'+(soClose?'진짜 아까웠어요! 다음엔 꼭 잡아요 🔥':(near?'중앙에서 살짝 벗어나 미끄러졌어요!':'중앙에서 많이 빗나갔어요'))+'<br><b style="color:#ffcf66">'+goal.e+' '+goal.n+'</b> — 🔥복수전이 기다려요!';
      $('overDex').textContent=totalCaughtDolls()+'/'+TOTAL_DOLLS;
      submitScore();   // 글로벌 랭킹에 이번 판 기록 반영
      interCount++;    // 전면광고 카운터(다시도전 3회당 1번)
      rollNextGolden(); renderPending();   // v2.7: 패배 화면에도 '남겨둔 것'을 보여줘 좌절로 끝나지 않게
      setTimeout(()=>$('over').classList.remove('hidden'),700);
    }
  }
}

// 입력
function tap(){
  if(state==='aimX'){ cx=sweep; state='aimY'; sweep=field().y; sweepDir=1; $('hint').textContent='② 앞뒤 맞춰 탭! (빠름)'; play('aim_lock'); vib(12);}
  else if(state==='aimY'){ cy=sweep; $('hint').textContent='내려—!'; play('aim_lock'); vib([10,30]); commit(); }
}
addEventListener('pointerdown',e=>{ if(e.target&&e.target.closest&&e.target.closest('.btn'))return; if(state==='aimX'||state==='aimY') tap(); });

function flash(txt,col){ const d=document.createElement('div'); d.className='flash'; d.textContent=txt; d.style.color=col; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=rnd(1,5); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c,r:2+Math.random()*3}); } }

// 렌더 루프
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; dt*=timeScale;
  if(state==='aimX'||state==='aimY'){ const f=field();
    if(state==='aimX'){ sweep+=sweepDir*(f.w*1.15)*dt; if(sweep>f.x+f.w){sweep=f.x+f.w;sweepDir=-1;} if(sweep<f.x){sweep=f.x;sweepDir=1;} }
    else { sweep+=sweepDir*(f.w*1.35)*dt; if(sweep>f.y+f.h){sweep=f.y+f.h;sweepDir=-1;} if(sweep<f.y){sweep=f.y;sweepDir=1;} } // v2.6: 앞뒤 속도를 필드 '높이'가 아닌 '가로폭' 기준으로 — 세로로 긴 기기일수록 빨라져 난이도가 달랐다
    if(isGolden){ goldenT-=dt; const w=Math.max(0,goldenT/GOLDEN_MAX)*100; $('goldFill').style.width=w.toFixed(1)+'%'; if(goldenT<=0){ goldenExpire(); } }
  }
  if(state==='drop') stepSpectate(dt);
  // 파티클
  for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.02; }
  parts=parts.filter(p=>p.life>0);
  if(flashA>0) flashA=Math.max(0,flashA-0.035);
  draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0; if(screenShake>0){ sx=(Math.random()-.5)*screenShake; sy=(Math.random()-.5)*screenShake; screenShake*=0.85; if(screenShake<.4)screenShake=0; }
  ctx.save(); ctx.translate(sx,sy);
  const f=field();
  // 배경 그라데이션 (마스터한 테마는 황금 배경 보상)
  const goldBg = (state!=='start') && themeMastered(THEME());
  const bg=ctx.createLinearGradient(0,0,0,H);
  if(goldBg){ bg.addColorStop(0,'#4a3410'); bg.addColorStop(1,'#1c1405'); } else { bg.addColorStop(0,'#2a1140'); bg.addColorStop(1,'#120e1e'); }
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(goldBg){ // 은은한 황금 반짝이
    for(let i=0;i<5;i++){ const t2=performance.now()/1000+i*1.3; const gx=(Math.sin(t2*0.7+i)*0.4+0.5)*W, gy=((t2*0.15+i*0.2)%1)*H; ctx.globalAlpha=0.25+0.15*Math.sin(t2*3); ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(gx,gy,1.6,0,6.28); ctx.fill(); } ctx.globalAlpha=1; }
  // 유리장
  ctx.fillStyle='rgba(120,80,200,.10)'; roundRect(f.x-8,f.y-46,f.w+16,f.h+70,18); ctx.fill();
  ctx.strokeStyle='rgba(200,150,255,.5)'; ctx.lineWidth=3; roundRect(f.x-8,f.y-46,f.w+16,f.h+70,18); ctx.stroke();
  // 출구(좌상단)
  ctx.fillStyle='rgba(0,0,0,.35)'; roundRect(f.x-6,f.y-44,54,30,8); ctx.fill();
  ctx.fillStyle='#ffcf66'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.fillText('출구',f.x+21,f.y-25);
  // 인형들

function drawClaw(){
  const f=field(); const railY=f.y-46;
  let cxp = (state==='drop')?claw.x : (state==='aimY'?cx : (state==='aimX'?sweep : W/2));

  ctx.fillStyle=rg; roundRect(f.x-10,railY-5,f.w+20,10,4); ctx.fill();
  // 캐리지(레일 위 이동부)
  ctx.fillStyle='#8a7ab8'; roundRect(cxp-14,railY-8,28,10,3); ctx.fill();
  // 케이블
  ctx.strokeStyle='#9a8ac0'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cxp,railY-2); ctx.lineTo(cxp,clawY-15); ctx.stroke();
  // 집게 헤드(금속 하우징)
  const hg=ctx.createLinearGradient(cxp-16,0,cxp+16,0); hg.addColorStop(0,'#f2f2fa'); hg.addColorStop(.5,'#aeaecb'); hg.addColorStop(1,'#78788f');
  ctx.fillStyle=hg; roundRect(cxp-15,clawY-15,30,16,5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cxp-9,clawY-11); ctx.lineTo(cxp+6,clawY-11); ctx.stroke();
  ctx.fillStyle='#5a5a78'; roundRect(cxp-5,clawY-2,10,5,2); ctx.fill(); // 축
  // 3발 집게 (금속, open=벌어짐/curl)
  const spread=7+open*19, curl=3+open*9;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#9a9ab8'; ctx.lineWidth=6; // 중앙(뒤)

}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function checkAttendance(){
  const t=todayStr(); const last=localStorage.getItem('ppopgi_att_day'); let streak=+(localStorage.getItem('ppopgi_att_streak')||0);
  if(last===t) return {streak, reward:0, already:true};
  streak = (last===ymd(-1)) ? streak+1 : 1;
  try{ localStorage.setItem('ppopgi_att_day',t); localStorage.setItem('ppopgi_att_streak',streak); }catch(e){}
  const reward = (streak%7===0)?5:2;   // 7일마다 +5, 평소 +2
  addHearts(reward);
  return {streak, reward, already:false};
}

      const uid=myUid(); const myIdx=top.findIndex(x=>x.uid===uid);
      let h='';
      top.slice(0,20).forEach((x,i)=>{ const me=x.uid===uid; const medal=['🥇','🥈','🥉'][i]||('<b style="opacity:.6">'+(i+1)+'</b>');
        h+='<div class="rkrow"'+(me?' style="background:rgba(255,211,77,.18);border:1px solid rgba(255,211,77,.5)"':'')+'><span>'+medal+' '+(x.name||'익명').replace(/[<>]/g,'')+(me?' <b>(나)</b>':'')+'</span><b>🔥'+x.best+' · 🧸'+(x.total||0)+'</b></div>'; });
      if(myIdx>=20){ h+='<div style="text-align:center;opacity:.5;font-size:12px">⋯</div>'; const x=top[myIdx]; h+='<div class="rkrow" style="background:rgba(255,211,77,.18);border:1px solid rgba(255,211,77,.5)"><span><b>'+(myIdx+1)+'위</b> '+(x.name||'나')+' <b>(나)</b></span><b>🔥'+x.best+'</b></div>'; }
      $('rankList').innerHTML=h || '<div class="rkrow"><span>아직 기록이 없어요 — 1등 도전!</span></div>';
      $('rankNote').textContent='🌐 전 세계 '+top.length+'명 중 '+(myIdx>=0?(myIdx+1)+'위':'미등록')+' · 최고 연속 기준';
      bindNameEdit();
    });
  }
  bindNameEdit();
}
function bindNameEdit(){ const e=$('nameEdit'); if(e) e.onclick=()=>{ const n=prompt('랭킹에 표시할 이름 (최대 12자)', myName()); if(n!=null){ setMyName(n); renderRank(); } }; }
function renderMeta(){
  const T=curTitle(), nx=nextTitle(); const mc=masteredCount();
  $('titleBadge').innerHTML = (mc>=THEMES.length?'👑 뽑기 마스터 · ':'')+'👑 '+T.n;
  let m='📅 출석 <b>'+attStreak()+'일</b> 연속 · 🏆 테마 <b>'+mc+'/'+THEMES.length+'</b> 마스터';
  if(nx) m+=' · 다음 칭호 <b>'+nx.n+'</b>까지 🧸'+(nx.min-totalCaught);
  $('metaBox').innerHTML=m;
  const cf=$('collFill'); if(cf){ const pct=Math.round(totalCaughtDolls()/TOTAL_DOLLS*100); cf.style.width=pct+'%'; $('collTxt').innerHTML='🧸 도감 컬렉션 <b>'+totalCaughtDolls()+'/'+TOTAL_DOLLS+'</b> · '+pct+'% 완성'; }
  renderTrophies();
  renderMissions();
}

// ── 배너광고 ──
let bannerShown=false, bannerCreated=false;
// 제스처 바(홈 인디케이터) 높이만큼 배너를 띄운다. viewport-fit=cover 필요.
function safeBottomInset(){ try{ const p=document.createElement('div'); p.style.cssText='position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none'; document.body.appendChild(p); const h=Math.round(p.getBoundingClientRect().height); p.remove(); return h; }catch(e){ return 0; } }
async function showBanner(){ const C=window.Capacitor; if(!AD_BANNER||!(C&&C.Plugins&&C.Plugins.AdMob)||bannerShown) return; bannerShown=true; try{document.body.classList.add('has-banner');}catch(e){} const _A=C.Plugins.AdMob; const _opt={adId:AD_BANNER,adSize:'BANNER',position:'BOTTOM_CENTER',margin:safeBottomInset(),isTesting:AD_USE_TEST}; try{ if(bannerCreated){ try{ await _A.resumeBanner(); }catch(_e){ await _A.showBanner(_opt); } } else { await _A.showBanner(_opt); bannerCreated=true; } }catch(e){ bannerShown=false; try{document.body.classList.remove('has-banner');}catch(e2){} } }
async function hideBanner(){ const C=window.Capacitor; if(!(C&&C.Plugins&&C.Plugins.AdMob)||!bannerShown) return; bannerShown=false; try{document.body.classList.remove('has-banner');}catch(e){} try{ await C.Plugins.AdMob.hideBanner(); }catch(e){} }

// ── 공유(바이럴) ──
function shareGame(){ const txt='모두의 뽑기 🧸 도감 '+totalCaughtDolls()+'/'+TOTAL_DOLLS+' · 최고 연속 '+bestStreak+'회! 나도 도전 👉\nhttps://seungiljang.github.io/games/ppopgi.html';
  try{ if(navigator.share){ navigator.share({title:'모두의 뽑기',text:txt}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(txt); flash('📋 복사됨!','#7cf6ff'); }catch(e){} }

// ── 화면 전환 ──
function toStart(){ state='start'; isGolden=false; $('goldBar').classList.add('hidden'); $('top').style.visibility='hidden'; renderLives(); $('combo').textContent=''; $('lastAccTop').textContent=''; $('streak').textContent=''; $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); $('start').classList.remove('hidden'); renderHearts(); renderStartStats(); renderMeta(); renderDexGrid(); renderPending(); showBanner(); submitScore(); }
function showNoHearts(){ state='result'; $('over').classList.add('hidden'); $('start').classList.add('hidden'); $('heartMsg').innerHTML='다음 하트까지 <b>'+heartTimer()+'</b><br>지금 바로 하려면 광고로 하트 +5!'+pendingHTML(); $('noheart').classList.remove('hidden'); showBanner(); }
function startRound(goal){ loadHearts(); if(hearts<=0){ showNoHearts(); return; } if(hearts===MAX_HEARTS) heartTs=Date.now(); hearts--; saveHearts(); renderHearts(); lives=MAX_LIVES; renderLives(); $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); hideBanner(); newRound(goal); }

// 버튼
function begin(){ audioCtx(); loadSfx(); uiTap(); $('start').classList.add('hidden'); clawBonus=0; startRound(); }  // 첫 터치에서 오디오 활성화 + 프리로드
$('startBtn').onclick=begin;
$('shareBtn').onclick=()=>{ uiTap(); shareGame(); };
$('retryBtn').onclick=()=>{ uiTap(); clawBonus=0; if(interCount>0&&interCount%3===0) showInterstitial(); startRound(window._goal); };
$('reviveBtn').onclick=()=>{ playAd(()=>{ $('over').classList.add('hidden'); clawBonus=0.3; lives=MAX_LIVES; renderLives(); flash('집게 힘 +30% · 생명 💗💗 회복!','#7cf6ff'); hideBanner(); newRound(window._goal); }); };
$('heartAdBtn').onclick=()=>{ playAd(()=>{ addHearts(5); flash('❤️ 하트 +5!','#ff6a9a'); startRound(); }); };
$('heartWaitBtn').onclick=()=>{ uiTap(); toStart(); };
$('rankBtn').onclick=()=>{ uiTap(); renderRank(); $('rank').classList.add('show'); };
$('rankClose').onclick=()=>{ uiTap(); $('rank').classList.remove('show'); };
$('muteBtn').onclick=()=>{ muted=!muted; try{localStorage.setItem('ppopgi_mute',muted?'1':'0');}catch(e){} renderMute(); if(muted) stopAllSfx(); else play('ui_tap'); }; renderMute();
// 초기 화면
(function initAds2(){ setTimeout(showBanner,800); })();
loadMissions();
(function initDaily(){ const a=checkAttendance(); if(!a.already && a.reward>0){ setTimeout(()=>flash('📅 출석 '+a.streak+'일차! ❤️+'+a.reward,'#7cf6ff'),900); } renderMeta(); })();
$('top').style.visibility='hidden'; renderDexGrid(); preloadTheme(THEME(),renderDexGrid); loadSfx(); loadHearts(); renderHearts(); renderStartStats(); renderMeta(); renderPending(); $('dex').textContent=THEME().ico+' '+THEME().name+' '+themeCaught(THEME())+'/'+THEME().dolls.length+' · 전체 '+totalCaughtDolls()+'/'+TOTAL_DOLLS;
</script>
