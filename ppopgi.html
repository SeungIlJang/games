<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 뽑기</title>
<style>
  html,body{margin:0;height:100%;background:#120e1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
  canvas{display:block}
  /* 상단 목표 */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;pointer-events:none}
  #goalLbl{font-size:13px;color:#ffb0e6;letter-spacing:1px}
  #goal{font-size:24px;font-weight:900;margin-top:1px;text-shadow:0 0 16px rgba(255,120,220,.5)}
  #dex{font-size:13px;color:#9fe;margin-top:2px;font-weight:700}
  #hearts{font-size:14px;font-weight:800;color:#ff6a9a;margin-bottom:2px}
  #lastAccTop{font-size:15px;font-weight:800;margin-top:3px;min-height:18px}
  #noheart{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.95);z-index:11;text-align:center;padding:24px}
  #streak{font-size:12px;color:#ffcf66;margin-top:2px;font-weight:800;min-height:16px}
  /* 하단 안내/버튼 */
  #hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:3;font-size:17px;font-weight:800;color:#ffe;pointer-events:none;min-height:24px}
  #ver{position:fixed;left:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;color:#5a4a70;z-index:4}
  .flash{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:40px;font-weight:900;z-index:8;pointer-events:none;text-align:center;white-space:nowrap;animation:fl 1s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
  .btn{background:#ff4db8;color:#fff;border:none;border-radius:16px;padding:15px 30px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #b81f7f;cursor:pointer}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,14,30,.94);z-index:10;text-align:center;padding:24px}
  .hidden{display:none!important}
  h1{font-size:40px;margin:0;text-shadow:0 0 22px rgba(255,80,200,.5)}
  .sub{color:#e9c9ff;opacity:.9;font-size:15px;line-height:1.5}
  #changelog{margin-top:14px;font-size:12px;color:#9fe;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:7px 12px;max-width:320px}
  #dexGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 2px}
  .dcell{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:26px}
  .dcell.lock{filter:grayscale(1);opacity:.28}
  #overTitle{font-size:34px}
  #reviveBtn{background:#2ec77a;box-shadow:0 6px 0 #1a8a52}
  #gripWrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;pointer-events:none}
  #gripLbl{font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,90,110,.6);margin-bottom:6px;animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  #gripBar{width:72%;max-width:300px;height:20px;margin:0 auto;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #gripFill{height:100%;width:100%;background:#5cffb0;border-radius:10px;transition:width .05s linear}
</style></head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="top">
  <div id="hearts"></div>
  <div id="goalLbl">🎯 이번 목표</div>
  <div id="goal">–</div>
  <div id="dex">도감 0/10</div>
  <div id="lastAccTop"></div>
  <div id="streak"></div>
</div>
<div id="gripWrap" class="hidden"><div id="gripLbl">🔥 탭 연타! 꽉 잡아!</div><div id="gripBar"><div id="gripFill"></div></div></div>
<div id="hint"></div>
<div id="ver">v1.0 · 하트·기록·연속실패보너스·공유·배너·도감완성</div>

<div id="start">
  <h1>모두의 뽑기</h1>
  <div class="sub"><b>탭 2번</b>으로 집게를 <b style="color:#7cffb0">정가운데(초록 점)</b>에 정확히!<br><b style="color:#ffcf66">초록 성공존</b> 안에 멈추면 성공! (초반엔 크고 갈수록 작아져요)<br><span style="opacity:.7;font-size:13px">중앙에서 벗어난 만큼 놓칠 확률↑</span></div>
  <div id="dexGrid"></div>
  <div class="sub" id="startStats" style="font-size:13px;opacity:.85"></div>
  <div style="display:flex;gap:10px">
    <button class="btn" id="startBtn">뽑으러 가기</button>
    <button class="btn" id="shareBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:15px 22px">🏆 공유</button>
  </div>
  <div id="changelog">🆕 <b>v1.0</b> · 하트·연속성공 기록·연속실패 보너스·공유·배너·도감완성 (탑100 세트)</div>
</div>

<div id="noheart" class="hidden">
  <div style="font-size:56px">💔</div>
  <div style="font-size:30px;font-weight:900">하트를 다 썼어요</div>
  <div class="sub" id="heartMsg"></div>
  <button class="btn" id="heartAdBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52">🎬 광고 보고 하트 +5</button>
  <button class="btn" id="heartWaitBtn" style="background:#3a4568;box-shadow:0 6px 0 #222a44">기다리기 (첫 화면)</button>
</div>

<div id="over" class="hidden">
  <div id="overTitle">아—! 놓쳤다</div>
  <div class="sub" id="overMsg"></div>
  <button class="btn" id="reviveBtn">🎬 광고 보고 재도전 (집게 힘 +30%)</button>
  <button class="btn" id="retryBtn" style="background:#3a7bff;box-shadow:0 6px 0 #1f52c0">다시 도전</button>
  <div class="sub" style="opacity:.7">도감 <b id="overDex">0/10</b></div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.random()*(b-a)+a, clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ── 오디오 ──
let AC; function tone(f,d,type,g){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v);v.connect(AC.destination); const t=AC.currentTime;o.start(t); v.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1)); o.stop(t+(d||0.1)); }catch(e){} }
function chord(b){[0,4,7,12].forEach((s,i)=>setTimeout(()=>tone(b*Math.pow(2,s/12),0.18,'triangle',0.07),i*70));}
function vib(m){try{navigator.vibrate&&navigator.vibrate(m);}catch(e){}}
let heartT=0;
// ── 광고(리워드) ──
const AD_USE_TEST=true, AD_REWARD_TEST='ca-app-pub-3940256099942544/5224354917', AD_REWARD_REAL='';
let admobReady=false, adPlaying=false;
(async function(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob){ await C.Plugins.AdMob.initialize({initializeForTesting:AD_USE_TEST}); admobReady=true; } }catch(e){} })();
async function playAd(cb){ if(adPlaying)return; adPlaying=true; const C=window.Capacitor;
  if(admobReady&&C&&C.Plugins&&C.Plugins.AdMob){ const A=C.Plugins.AdMob; let ld=null,lf=null;
    try{ await A.prepareRewardVideoAd({adId:AD_USE_TEST?AD_REWARD_TEST:AD_REWARD_REAL});
      await new Promise(res=>{let d=false;const fin=()=>{if(d)return;d=true;res();};
        A.addListener('onRewardedVideoAdDismissed',fin).then(l=>ld=l); A.addListener('onRewardedVideoAdFailedToShow',fin).then(l=>lf=l);
        A.showRewardVideoAd().catch(fin); setTimeout(fin,40000);});
      if(ld&&ld.remove)ld.remove(); if(lf&&lf.remove)lf.remove(); adPlaying=false; cb(); return;
    }catch(e){ adPlaying=false; cb(); return; } }
  setTimeout(()=>{ adPlaying=false; cb(); },700); // 웹 시뮬
}

// ── 인형 도감 ──
const DOLLS=[
  {e:'🐻',n:'곰돌이',r:1},{e:'🐰',n:'토끼',r:1},{e:'🐸',n:'개구리',r:1},
  {e:'🐱',n:'냥이',r:2},{e:'🐧',n:'펭귄',r:2},{e:'🐼',n:'판다',r:2},{e:'⭐',n:'별님',r:2},
  {e:'🦆',n:'황금오리',r:3},{e:'🦄',n:'유니콘',r:3},{e:'💎',n:'보석',r:3},
];
function loadDex(){ try{ return JSON.parse(localStorage.getItem('ppopgi_dex')||'[]'); }catch(e){ return []; } }
function saveDex(a){ try{ localStorage.setItem('ppopgi_dex',JSON.stringify(a)); }catch(e){} }
let dex=loadDex();
function dexCount(){ return dex.length; }
function renderDexGrid(){ const g=$('dexGrid'); g.innerHTML=''; DOLLS.forEach(d=>{ const c=document.createElement('div'); c.className='dcell'+(dex.includes(d.n)?'':' lock'); c.textContent=dex.includes(d.n)?d.e:'❔'; g.appendChild(c); }); }

// ── 캔버스 ──
const cv=$('cv'), ctx=cv.getContext('2d'); let W=412,H=740,DPR=1, sc=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); const vw=innerWidth,vh=innerHeight; W=412; H=Math.round(W*vh/vw); cv.width=W*DPR; cv.height=H*DPR; cv.style.width=vw+'px'; cv.style.height=vh+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// 필드(유리장) 영역
function field(){ return {x:24, y:H*0.28, w:W-48, h:H*0.46}; }
let state='start';           // start|aimX|aimY|drop|result
let dolls=[];                // 화면 배치된 인형들
let target=-1;               // 목표 인형 index(dolls)
let cx=0, cy=0;              // 조준 십자
let sweep=0, sweepDir=1, sweepSpd=1;
let claw={x:W/2,y:0,open:1,holding:null,phase:'',sway:0};
let timeScale=1;   // 마지막 이동 구간 슬로모션
let outcome=null;            // {grab, success, nearMiss}
let anim=0, shakeN=0, shakeMag=0;
let gripVal=1, carryProg=0, aimAcc=0, drainRate=0.4;  // 능동 그립 사수
let playCount=+(localStorage.getItem('ppopgi_plays')||0);
let failStreak=+(localStorage.getItem('ppopgi_fs')||0);
let clawBonus=0;             // 광고 재도전 보너스(집게 힘)
let parts=[], screenShake=0, flashCol=null, flashA=0;

function pickTarget(){
  // 미보유 우선(간절함)
  const missing=DOLLS.filter(d=>!dex.includes(d.n));
  const pool=missing.length?missing:DOLLS;
  return pool[Math.floor(Math.random()*pool.length)];
}
function layoutField(goal){
  const f=field(); dolls=[];
  // 인형 무더기: 여러 종류 흩뿌리기 + 목표 1개 확실히 포함
  const set=[goal]; const others=DOLLS.filter(d=>d.n!==goal.n);
  for(let i=0;i<7;i++) set.push(others[Math.floor(Math.random()*others.length)]);
  set.forEach((d,i)=>{ dolls.push({...d, x:f.x+rnd(0.14,0.86)*f.w, y:f.y+rnd(0.32,0.9)*f.h, wob:0, vy:0, held:false, fall:false}); });
  target=0; // goal은 첫 요소
}
function newRound(keepTarget){
  const goal = keepTarget||pickTarget();
  window._goal=goal;
  layoutField(goal);
  $('goal').textContent=goal.e+' '+goal.n+' '+('★'.repeat(goal.r));
  $('dex').textContent='도감 '+dexCount()+'/'+DOLLS.length;
  $('streak').textContent = failStreak>=2 ? ('😤 '+failStreak+'연속 실패 — 이번엔 과녁 커짐!') : (successStreak>=2?('🔥 '+successStreak+'연속 성공 중!'):'');
  claw={x:W/2,y:field().y-40,open:1,holding:null,phase:'',sway:0}; timeScale=1;
  state='aimX'; sweep=field().x; sweepDir=1; sweepSpd=1;
  $('hint').textContent='① 좌우 맞춰 탭!';
}
const ACC_R_BASE=72;                                // 정확도 환산 반경
function accRadius(){ return ACC_R_BASE*(1+clawBonus*0.5); }
function successThreshold(){ const base=clamp(0.74+playCount*0.017, 0.55, 0.90); return clamp(base - clawBonus*0.1 - Math.min(failStreak,4)*0.025, 0.5, 0.90); } // 판마다 축소(상한90%) 후 광고/연속실패로 완화(매몰비용 오기)
function accAt(px,py){ const t=dolls[target]; return clamp(1-Math.hypot(px-t.x,py-t.y)/accRadius(),0,1); }
function commit(){
  const t=dolls[target]; const dist=Math.hypot(cx-t.x, cy-t.y);
  const acc=clamp(1-dist/accRadius(),0,1);          // 1 = 정가운데
  window.lastAcc=Math.round(acc*100); const thr=successThreshold(); window.lastThresh=Math.round(thr*100);
  const grab = acc>=0.45;                            // 어느정도 가까우면 집긴 함(니어미스 연출)
  const success = acc>=thr;                          // 성공 존 안이면 성공(초반 큼→후반 작음)
  outcome={grab, success, nearMiss:grab&&!success, acc};
  const col = success?'#7cffb0':(outcome.nearMiss?'#ffcf66':'#ff8a8a');
  $('lastAccTop').innerHTML='🎯 최종 정확도 <b style="color:'+col+'">'+window.lastAcc+'%</b> <span style="opacity:.6">(성공 '+window.lastThresh+'%↑)</span> '+(success?'✅':'❌');
  playCount++; try{localStorage.setItem('ppopgi_plays',playCount);}catch(e){}
  startSpectate();
}
function startSpectate(){
  state='drop'; claw.phase='descend'; claw.x=cx; anim=0; heartT=0; shakeN=0; claw.grip=1;
  $('hint').textContent=''; $('gripWrap').classList.add('hidden');
}

// 관전 시퀀스 진행
function stepSpectate(dt){
  const t=dolls[target]; anim+=dt;
  // 하강·집기=정상속도 / 들어올려 가져오는 순간부터 슬로모션(긴장감)
  timeScale = (claw.phase==='descend'||claw.phase==='close') ? 1 : 0.5;
  // 매달린 인형 흔들림(진자)
  if(claw.holding){ claw.sway = Math.sin(anim*7)*0.12 + Math.sin(anim*40)*shakeMag*0.01; }
  heartT-=dt; if(heartT<=0){ tone(70,0.09,'sine',0.16); heartT=0.62; } // 심장박동
  if(claw.phase==='descend'){
    claw.y += 420*dt;
    const ty = outcome.grab ? t.y : cy;
    if(claw.y>=ty){ claw.y=ty; claw.open=0; claw.phase='close'; anim=0; tone(180,0.08,'square',0.12); vib(20); }
  } else if(claw.phase==='close'){
    if(anim>0.28){
      if(outcome.grab){ t.held=true; claw.holding=t; claw.phase='lift'; }
      else { claw.phase='liftEmpty'; } // 빗나감
      anim=0;
    }
  } else if(claw.phase==='lift'){
    // 니어미스면 들어올릴 때부터 그립이 스멀스멀 풀림 → "떨어질 것 같다" 예감
    if(outcome.nearMiss) claw.grip=Math.max(0.45, claw.grip - dt*0.30); else claw.grip=1;
    claw.open=clamp((1-claw.grip)*0.7+0.05,0.05,0.5);
    const slipL=(1-claw.grip)*16;
    claw.y-=300*dt; if(claw.holding){ claw.holding.x=claw.x; claw.holding.y=claw.y+34+slipL; }
    if(claw.y<=field().y-30){ claw.y=field().y-30; claw.phase='carry'; anim=0; shakeN=0; }
  } else if(claw.phase==='carry'){
    // 출구로 이동 (탭 없음 — 성공/실패는 조준 정밀도로 이미 결정됨)
    claw.x += (34-claw.x)*Math.min(1,dt*2.0);
    if(outcome.nearMiss){
      claw.grip -= dt*0.5;                                             // 계속 풀림
      const shakeAt=[0.35,0.8];
      if(shakeN<shakeAt.length && anim>=shakeAt[shakeN]){ shakeN++; shakeMag=16; screenShake=Math.max(screenShake,6); claw.grip-=0.18; tone(110,0.07,'sawtooth',0.12); vib([15,35]); burst(claw.x-4,claw.y+44,'#bfe0ff',6); }
      $('hint').textContent = claw.grip<0.5?'앗, 미끄러진다…!':'불안하게 흔들린다…';
      if(claw.grip<=0.02){ $('hint').textContent=''; claw.phase='drop'; anim=0; }
    } else { claw.grip=1; }
    const g=claw.grip;
    claw.open=clamp((1-g)*0.75+0.05,0.05,0.85);
    const slip=(1-g)*30;
    if(claw.holding){ claw.holding.x=claw.x+Math.sin(anim*30)*shakeMag*0.2; claw.holding.y=claw.y+34+slip; }
    shakeMag*=0.92;
    timeScale = (outcome.nearMiss && g<0.45)?0.4:0.6;                  // 위기 슬로모
    if(outcome.success && anim>1.6){ claw.phase='deposit'; anim=0; }
  } else if(claw.phase==='drop'){
    claw.open=0.9; // 집게 완전히 벌어짐(놓침)
    // 출구 바로 앞에서 낙하 (아—! 놓쳤다)
    if(claw.holding){ claw.holding.vy=(claw.holding.vy||0)+900*dt; claw.holding.y+=claw.holding.vy*dt; claw.holding.x+=20*dt;
      if(claw.holding.y>field().y+field().h-20){ endResult(false,'near'); } }
    else endResult(false,'near');
  } else if(claw.phase==='liftEmpty'){
    claw.y-=300*dt; if(claw.y<=field().y-30){ endResult(false,'miss'); }
  } else if(claw.phase==='deposit'){
    if(claw.holding){ claw.holding.y+=500*dt; claw.holding.x=claw.x; if(claw.holding.y>H*0.9){ endResult(true); } }
    else endResult(true);
  }
}
function endResult(win, kind){
  if(state==='result') return; state='result'; timeScale=1; claw.sway=0; $('gripWrap').classList.add('hidden');
  const goal=window._goal;
  if(win){
    const wasNew=!dex.includes(goal.n);
    if(wasNew){ dex.push(goal.n); saveDex(dex); }
    failStreak=0; try{localStorage.setItem('ppopgi_fs',0);}catch(e){}
    clawBonus=0;
    successStreak++; totalCaught++; if(successStreak>bestStreak) bestStreak=successStreak; saveStats();
    flash((successStreak>=3?('🔥'+successStreak+'연속! '):'')+'🎯'+(window.lastAcc||100)+'% '+goal.e+' 획득!','#7cffb0'); chord(523); vib([20,50,30]);
    burst(claw.x,H*0.5,'#7cffb0',40); screenShake=6;
    $('dex').textContent='도감 '+dexCount()+'/'+DOLLS.length; renderDexGrid();
    if(wasNew && dexCount()>=DOLLS.length){ setTimeout(()=>{ flash('🎉 도감 완성! 대단해요!','#ffd34d'); chord(659); burst(W/2,H*0.4,'#ffd34d',60); screenShake=10; },900); }
    setTimeout(()=>{ startRound(); },1200);
  } else {
    failStreak++; try{localStorage.setItem('ppopgi_fs',failStreak);}catch(e){}
    successStreak=0;
    const near = kind==='near';
    flash(near?'아—! 놓쳤다 😫':'빗나갔다 💨', '#ff6a7a'); tone(150,0.3,'sawtooth',0.12); setTimeout(()=>tone(100,0.3,'sawtooth',0.1),100);
    vib(200); screenShake=near?14:6; showBanner();
    $('overTitle').textContent = near?'아—! 놓쳤다 😫':'빗나갔다 💨';
    $('overMsg').innerHTML = '정확도 <b style="color:'+(near?'#ffcf66':'#ff8a8a')+'">'+(window.lastAcc||0)+'%</b> <span style="opacity:.7">(성공 '+(window.lastThresh||95)+'%↑)</span><br>'+(near?'중앙에서 살짝 벗어나 미끄러졌어요!':'중앙에서 많이 빗나갔어요')+'<br><b style="color:#ffcf66">'+goal.e+' '+goal.n+'</b> 조금만 더 정확히!';
    $('overDex').textContent=dexCount()+'/'+DOLLS.length;
    setTimeout(()=>$('over').classList.remove('hidden'),700);
  }
}

// 입력
function tap(){
  if(state==='aimX'){ cx=sweep; state='aimY'; sweep=field().y; sweepDir=1; $('hint').textContent='② 앞뒤 맞춰 탭! (빠름)'; tone(660,0.05,'square',0.08); vib(12); }
  else if(state==='aimY'){ cy=sweep; $('hint').textContent='내려—!'; tone(880,0.06,'square',0.1); vib([10,30]); commit(); }
}
addEventListener('pointerdown',e=>{ if(e.target.closest('.btn'))return; if(state==='aimX'||state==='aimY') tap(); });

function flash(txt,col){ const d=document.createElement('div'); d.className='flash'; d.textContent=txt; d.style.color=col; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=rnd(1,5); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c,r:2+Math.random()*3}); } }

// 렌더 루프
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; dt*=timeScale;
  if(state==='aimX'||state==='aimY'){ const f=field();
    if(state==='aimX'){ sweep+=sweepDir*(f.w*1.15)*dt; if(sweep>f.x+f.w){sweep=f.x+f.w;sweepDir=-1;} if(sweep<f.x){sweep=f.x;sweepDir=1;} }
    else { sweep+=sweepDir*(f.h*1.6)*dt; if(sweep>f.y+f.h){sweep=f.y+f.h;sweepDir=-1;} if(sweep<f.y){sweep=f.y;sweepDir=1;} } // 앞뒤 1.4배↑
  }
  if(state==='drop') stepSpectate(dt);
  // 파티클
  for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.02; }
  parts=parts.filter(p=>p.life>0);
  draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0; if(screenShake>0){ sx=(Math.random()-.5)*screenShake; sy=(Math.random()-.5)*screenShake; screenShake*=0.85; if(screenShake<.4)screenShake=0; }
  ctx.save(); ctx.translate(sx,sy);
  const f=field();
  // 배경 그라데이션
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2a1140'); bg.addColorStop(1,'#120e1e'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 유리장
  ctx.fillStyle='rgba(120,80,200,.10)'; roundRect(f.x-8,f.y-46,f.w+16,f.h+70,18); ctx.fill();
  ctx.strokeStyle='rgba(200,150,255,.5)'; ctx.lineWidth=3; roundRect(f.x-8,f.y-46,f.w+16,f.h+70,18); ctx.stroke();
  // 출구(좌상단)
  ctx.fillStyle='rgba(0,0,0,.35)'; roundRect(f.x-6,f.y-44,54,30,8); ctx.fill();
  ctx.fillStyle='#ffcf66'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.fillText('출구',f.x+21,f.y-25);
  // 인형들
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<dolls.length;i++){ const d=dolls[i]; const held=(claw.holding===d);
    if(!held){ ctx.fillStyle='rgba(0,0,0,.30)'; ctx.beginPath(); ctx.ellipse(d.x,d.y+17,15,5,0,0,6.28); ctx.fill(); } // 바닥 그림자
    if(i===target && state!=='result' && !held){ ctx.save(); ctx.globalAlpha=0.45+0.3*Math.sin(performance.now()/300); ctx.strokeStyle='#ff5ce1'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(d.x,d.y,26,0,6.28); ctx.stroke(); ctx.restore();
      if(state==='aimX'||state==='aimY'){ ctx.save();
        const zoneR=Math.max(6,(1-successThreshold())*accRadius()); // 성공 존 반경(초반 큼→후반 작음)
        ctx.fillStyle='rgba(124,255,176,.16)'; ctx.beginPath(); ctx.arc(d.x,d.y,zoneR,0,6.28); ctx.fill();
        ctx.strokeStyle='rgba(124,255,176,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(d.x,d.y,zoneR,0,6.28); ctx.stroke();
        ctx.fillStyle='#7cffb0'; ctx.beginPath(); ctx.arc(d.x,d.y,2.5,0,6.28); ctx.fill(); ctx.restore(); } // 정가운데 성공 존
    }
    ctx.font='34px system-ui';
    if(held){ ctx.save(); ctx.translate(d.x,d.y+2); ctx.rotate(claw.sway||0); ctx.fillText(d.e,0,2); ctx.restore(); } // 집게에 매달려 흔들림
    else ctx.fillText(d.e, d.x, d.y);
  }
  // 조준선/십자
  if(state==='aimX'){ ctx.strokeStyle='#ffec6b'; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(sweep,f.y-30); ctx.lineTo(sweep,f.y+f.h); ctx.stroke(); ctx.setLineDash([]); }
  else if(state==='aimY'){ ctx.strokeStyle='#ffec6b'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(cx,f.y-30); ctx.lineTo(cx,f.y+f.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x,sweep); ctx.lineTo(f.x+f.w,sweep); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ffec6b'; ctx.beginPath(); ctx.arc(cx,sweep,5,0,6.28); ctx.fill();
  }
  // 실시간 정확도 표시 (조준 중) — 첫 판만(튜토리얼)
  if((state==='aimX'||state==='aimY') && playCount===0){
    const liveAcc = (state==='aimX') ? accAt(sweep, dolls[target].y) : accAt(cx, sweep);
    const pct=Math.round(liveAcc*100), thr=Math.round(successThreshold()*100);
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 26px system-ui';
    ctx.fillStyle = pct>=thr?'#7cffb0':(pct>=thr-25?'#ffcf66':'#ff6a7a');
    ctx.fillText('정확도 '+pct+'%', W/2, f.y+22);
    if(pct>=thr){ ctx.font='bold 13px system-ui'; ctx.fillStyle='#7cffb0'; ctx.fillText('★ 성공권!', W/2, f.y+44); }
    ctx.restore();
  }
  // 집게
  drawClaw();
  // 파티클
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
  // 슬로모션 비네트(긴장 연출)
  if(timeScale<1){ const v=ctx.createRadialGradient(claw.x,H*0.5,H*0.16,claw.x,H*0.5,H*0.62); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(25,0,40,.5)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}
function drawClaw(){
  const f=field(); const railY=f.y-46;
  let cxp = (state==='drop')?claw.x : (state==='aimY'?cx : (state==='aimX'?sweep : W/2));
  let clawY = (state==='drop')?claw.y : railY+6;
  const open = (state==='drop')?claw.open:1;
  // 레일(금속)
  const rg=ctx.createLinearGradient(0,railY-5,0,railY+5); rg.addColorStop(0,'#c9b4f0'); rg.addColorStop(1,'#6a4fa0');
  ctx.fillStyle=rg; roundRect(f.x-10,railY-5,f.w+20,10,4); ctx.fill();
  // 캐리지(레일 위 이동부)
  ctx.fillStyle='#8a7ab8'; roundRect(cxp-14,railY-8,28,10,3); ctx.fill();
  // 케이블
  ctx.strokeStyle='#9a8ac0'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cxp,railY-2); ctx.lineTo(cxp,clawY-15); ctx.stroke();
  // 집게 헤드(금속 하우징)
  const hg=ctx.createLinearGradient(cxp-16,0,cxp+16,0); hg.addColorStop(0,'#f2f2fa'); hg.addColorStop(.5,'#aeaecb'); hg.addColorStop(1,'#78788f');
  ctx.fillStyle=hg; roundRect(cxp-15,clawY-15,30,16,5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cxp-9,clawY-11); ctx.lineTo(cxp+6,clawY-11); ctx.stroke();
  ctx.fillStyle='#5a5a78'; roundRect(cxp-5,clawY-2,10,5,2); ctx.fill(); // 축
  // 3발 집게 (금속, open=벌어짐/curl)
  const spread=7+open*19, curl=3+open*9;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#9a9ab8'; ctx.lineWidth=6; // 중앙(뒤)
  ctx.beginPath(); ctx.moveTo(cxp,clawY); ctx.lineTo(cxp,clawY+20+(1-open)*6); ctx.stroke();
  ctx.strokeStyle='#e4e4f2'; ctx.lineWidth=6; // 좌
  ctx.beginPath(); ctx.moveTo(cxp-3,clawY); ctx.lineTo(cxp-spread,clawY+15); ctx.lineTo(cxp-spread+curl,clawY+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxp+3,clawY); ctx.lineTo(cxp+spread,clawY+15); ctx.lineTo(cxp+spread-curl,clawY+30); ctx.stroke(); // 우
  // 관절 볼트
  ctx.fillStyle='#c0c0d8'; [[-spread,15],[spread,15]].forEach(o=>{ ctx.beginPath(); ctx.arc(cxp+o[0],clawY+o[1],3,0,6.28); ctx.fill(); });
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
requestAnimationFrame(loop);

// ── 하트(시도권) ──
const MAX_HEARTS=10, HEART_REGEN_MS=180000;   // 3분당 1개 회복
let hearts=MAX_HEARTS, heartTs=Date.now();
function loadHearts(){ try{ let h=parseInt(localStorage.getItem('ppopgi_hearts')), ts=parseInt(localStorage.getItem('ppopgi_heart_ts'));
  if(isNaN(h))h=MAX_HEARTS; if(isNaN(ts))ts=Date.now();
  const g=Math.floor((Date.now()-ts)/HEART_REGEN_MS); if(g>0&&h<MAX_HEARTS){ h=Math.min(MAX_HEARTS,h+g); ts+=g*HEART_REGEN_MS; } if(h>=MAX_HEARTS)ts=Date.now();
  hearts=h; heartTs=ts; saveHearts(); }catch(e){ hearts=MAX_HEARTS; heartTs=Date.now(); } }
function saveHearts(){ try{ localStorage.setItem('ppopgi_hearts',hearts); localStorage.setItem('ppopgi_heart_ts',heartTs); }catch(e){} }
function addHearts(n){ loadHearts(); hearts=Math.min(MAX_HEARTS,hearts+n); saveHearts(); renderHearts(); }
function heartTimer(){ if(hearts>=MAX_HEARTS) return ''; const left=Math.ceil((HEART_REGEN_MS-((Date.now()-heartTs)%HEART_REGEN_MS))/1000); return Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); }
function renderHearts(){ loadHearts(); const t=heartTimer(); $('hearts').innerHTML='❤️ '+hearts+' / '+MAX_HEARTS+(t?' <span style="opacity:.55;font-weight:600">(+1 '+t+')</span>':''); }
setInterval(()=>{ renderHearts(); if(!$('noheart').classList.contains('hidden')){ loadHearts(); if(hearts>0){ $('noheart').classList.add('hidden'); toStart(); } } },1000);

// ── 기록/스트릭 ──
let successStreak=0, bestStreak=+(localStorage.getItem('ppopgi_best')||0), totalCaught=+(localStorage.getItem('ppopgi_total')||0);
function saveStats(){ try{ localStorage.setItem('ppopgi_best',bestStreak); localStorage.setItem('ppopgi_total',totalCaught); }catch(e){} }
function renderStartStats(){ $('startStats').innerHTML='🏆 최고 연속 <b>'+bestStreak+'</b> · 🧸 누적 <b>'+totalCaught+'</b>'; }

// ── 배너광고 ──
let bannerShown=false;
async function showBanner(){ const C=window.Capacitor; if(!(C&&C.Plugins&&C.Plugins.AdMob)||bannerShown) return; bannerShown=true; try{ await C.Plugins.AdMob.showBanner({adId:'ca-app-pub-3940256099942544/6300978111',adSize:'BANNER',position:'BOTTOM_CENTER',margin:0,isTesting:true}); }catch(e){ bannerShown=false; } }
async function hideBanner(){ const C=window.Capacitor; if(!(C&&C.Plugins&&C.Plugins.AdMob)||!bannerShown) return; bannerShown=false; try{ await C.Plugins.AdMob.hideBanner(); }catch(e){} }

// ── 공유(바이럴) ──
function shareGame(){ const txt='모두의 뽑기 🧸 도감 '+dexCount()+'/'+DOLLS.length+' · 최고 연속 '+bestStreak+'회! 나도 도전 👉\nhttps://seungiljang.github.io/games/ppopgi.html';
  try{ if(navigator.share){ navigator.share({title:'모두의 뽑기',text:txt}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(txt); flash('📋 복사됨!','#7cf6ff'); }catch(e){} }

// ── 화면 전환 ──
function toStart(){ state='start'; $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); $('start').classList.remove('hidden'); renderHearts(); renderStartStats(); renderDexGrid(); showBanner(); }
function showNoHearts(){ state='result'; $('over').classList.add('hidden'); $('start').classList.add('hidden'); $('heartMsg').innerHTML='다음 하트까지 <b>'+heartTimer()+'</b><br>지금 바로 하려면 광고로 하트 +5!'; $('noheart').classList.remove('hidden'); showBanner(); }
function startRound(goal){ loadHearts(); if(hearts<=0){ showNoHearts(); return; } if(hearts===MAX_HEARTS) heartTs=Date.now(); hearts--; saveHearts(); renderHearts(); $('over').classList.add('hidden'); $('noheart').classList.add('hidden'); hideBanner(); newRound(goal); }

// 버튼
function begin(){ try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} $('start').classList.add('hidden'); clawBonus=0; startRound(); }
$('startBtn').onclick=begin;
$('shareBtn').onclick=shareGame;
$('retryBtn').onclick=()=>{ clawBonus=0; startRound(window._goal); };
$('reviveBtn').onclick=()=>{ playAd(()=>{ $('over').classList.add('hidden'); clawBonus=0.3; flash('집게 힘 +30%! 💪','#7cf6ff'); hideBanner(); newRound(window._goal); }); };
$('heartAdBtn').onclick=()=>{ playAd(()=>{ addHearts(5); flash('❤️ 하트 +5!','#ff6a9a'); startRound(); }); };
$('heartWaitBtn').onclick=toStart;
// 초기 화면
(function initAds2(){ setTimeout(showBanner,800); })();
renderDexGrid(); loadHearts(); renderHearts(); renderStartStats(); $('dex').textContent='도감 '+dexCount()+'/'+DOLLS.length;
</script>
