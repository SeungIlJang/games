<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>딱! 딱지치기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#2a1d12;overflow:hidden;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;user-select:none;touch-action:none}
  #cv{display:block;position:fixed;inset:0;margin:auto}
  .ui{position:fixed;left:0;right:0;pointer-events:none;color:#fff;text-align:center;z-index:5}
  #topbar{top:calc(env(safe-area-inset-top,0px) + 10px);font-size:15px;font-weight:800;text-shadow:0 2px 4px #000;display:flex;justify-content:space-around;align-items:center;padding:0 14px}
  #topbar .pill{background:rgba(0,0,0,.35);border-radius:20px;padding:6px 14px;min-width:70px}
  #topbar .k{font-size:10px;opacity:.7;font-weight:600;display:block}
  #ver{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10px;color:#8a6b4a;z-index:6}
  #msg{top:38%;font-size:30px;font-weight:900;text-shadow:0 3px 0 #0007;transition:opacity .2s;opacity:0}
  #sub{top:calc(38% + 40px);font-size:15px;font-weight:700;color:#ffe9b0;text-shadow:0 2px 3px #000;opacity:0;transition:opacity .2s}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:15px;font-weight:800;color:#ffe9b0;text-shadow:0 2px 4px #000;animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 50% 20%,#3a281700,#1a110a 90%);color:#fff;text-align:center;padding:24px}
  #start h1{font-size:46px;font-weight:900;color:#ffcf5c;text-shadow:0 0 2px #7a4a12,4px 4px 0 #7a4a12;letter-spacing:-1px}
  #start p{font-size:15px;line-height:1.7;color:#e9d6bf;max-width:300px}
  #start .btn{pointer-events:auto;margin-top:8px;background:#ffcf5c;color:#5a3a10;font-size:22px;font-weight:900;border:none;border-radius:16px;padding:16px 46px;box-shadow:0 6px 0 #b5831f;cursor:pointer}
  #start .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b5831f}
  .hidden{display:none!important}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="ui" id="topbar">
  <div class="pill"><span class="k">점수</span><span id="score">0</span></div>
  <div class="pill"><span class="k">스테이지</span><span id="stage">1</span></div>
  <div class="pill"><span class="k">연속</span><span id="combo">0</span></div>
  <div class="pill"><span class="k">최고</span><span id="best">0</span></div>
</div>
<div class="ui" id="msg"></div>
<div class="ui" id="sub"></div>
<div class="ui hidden" id="hint">화면을 탭해서 내리쳐요!</div>
<div id="ver">v0.2 · 스테이지 난이도 램프(초록↓·파워바↑)</div>
<div id="start">
  <h1>딱! 딱지치기</h1>
  <p>초록 구간에서 <b>탭</b>해서 딱지를 내리쳐요.<br/>상대 딱지가 <b>90°를 넘기면</b> 뒤집혀서 따먹어요!<br/>스테이지 올라갈수록 <b>초록은 좁아지고 파워바는 빨라져요</b> 🟫<br/><span id="bstage" style="color:#ffcf5c;font-weight:800"></span></p>
  <button class="btn" id="startBtn">시작</button>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// ---- Audio (code-gen, no files) ----
let AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type,g,slide){ if(!AC) return; const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),AC.currentTime+d); v.gain.value=g||0.15; v.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }
function noise(d,g){ if(!AC) return; const n=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,n,AC.sampleRate), dt=buf.getChannelData(0); for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(); s.buffer=buf; const v=AC.createGain(); v.gain.value=g||0.3; s.connect(v); v.connect(AC.destination); s.start(); }
const sfx={ slam(){ noise(0.18,0.5); tone(90,0.18,'square',0.25,40); }, whoosh(){ tone(300,0.25,'sine',0.08,700); }, teeter(){ tone(520,0.07,'sine',0.08); }, win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.18),i*80)); }, fail(){ tone(180,0.3,'sawtooth',0.18,70); noise(0.2,0.25); }, vib(ms){ try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){} } };

// ---- State ----
let state='start'; // start | ready | slam | flip | result
let score=0, combo=0, won=0, best=0, stage=1, bestStage=1;
try{ best=parseInt(localStorage.getItem('ddakji_best')||'0')||0; bestStage=parseInt(localStorage.getItem('ddakji_bstage')||'1')||1; }catch(e){}
let power=0, pdir=1;                 // 파워 바 (0..1 핑퐁)
let GREEN=[0.70,0.92];              // 성공 구간(초록). 스테이지별로 좁아지고 위로. 아래 0.5~0.69는 '아깝다' 니어미스
let barSpeed=1.35;                  // 파워바 속도(스테이지↑ = 빨라짐)
function applyDifficulty(){ const s=stage;
  barSpeed=Math.min(3.0, 1.2 + (s-1)*0.12);            // 파워바 점점 빠르게(아슬아슬)
  Gcur=Math.min(13.5, 9 + (s-1)*0.42);                 // 딱지 점점 무겁게 → 뒤집기 임계 힘 상승
  const pstar=(Math.sqrt(2*Gcur)-1.5)/4.6;             // 이론 임계 파워(ω0=1.5+power*4.6 기준)
  GREEN=[ Math.min(0.90, pstar+0.095), 1.0 ];          // 초록=실제 성공구간(임계+여유 ~ 최대). 스테이지↑ = 좁아짐(최고도 band≥0.10)
}
let theta=0, omega=0, maxTheta=0;   // 뒤집기 물리(라디안, 0=평평, PI=뒤집힘)
let Gcur=9.0;                       // 중력 토크(=딱지 무게). 스테이지↑ = 무거워짐 = 더 센 힘 필요
let slamT=0, resultT=0, shake=0, flash=0;
let parts=[];                       // 먼지/파편
let dropY=0;                        // 내리치는 딱지 낙하
let pattern=0;                      // 상대 딱지 무늬
const COLORS=[['#e8534e','#b23a36'],['#4e86e8','#3a62b2'],['#4eb86a','#36934f'],['#e8b24e','#b2832f'],['#a24ee8','#7a36b2'],['#3fb8c8','#2a8794']];
let nearMiss=0;

function $(id){ return document.getElementById(id); }
function setTop(){ $('score').textContent=score; $('combo').textContent=combo; $('stage').textContent=stage; $('best').textContent=best; }
function showMsg(t,c){ const m=$('msg'); m.textContent=t; m.style.color=c||'#fff'; m.style.opacity=1; }
function showSub(t){ const s=$('sub'); s.textContent=t||''; s.style.opacity=t?1:0; }
function clearMsg(){ $('msg').style.opacity=0; $('sub').style.opacity=0; }

function newRound(){ pattern=(pattern+1)%COLORS.length; theta=0; omega=0; maxTheta=0; power=0; pdir=1; applyDifficulty(); state='ready'; clearMsg(); $('hint').classList.remove('hidden'); }

function slam(){
  if(state!=='ready') return;
  state='slam'; slamT=0; dropY=-220; $('hint').classList.add('hidden');
  initAudio(); sfx.whoosh();
}
function doImpact(){
  shake=10; flash=0.5; sfx.slam(); sfx.vib(30);
  for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*3; parts.push({x:0,y:0,vx:Math.cos(a)*sp,vy:-Math.random()*4-1,life:0.5,r:2+Math.random()*3}); }
  // 파워 → 초기 각속도(ω0). 임계값 sqrt(2G)=~4.24 를 넘겨야 90° 통과
  omega = 1.5 + power*4.6;   // power>~0.595 이면 뒤집힘 가능
  theta=0.001; maxTheta=0; state='flip';
}

function endFlip(success){
  state='result'; resultT=0;
  const deg=Math.round(maxTheta*180/Math.PI);
  if(success){
    won++; combo++; const gain=10+stage*3+combo*2; score+=gain;
    if(score>best){ best=score; try{localStorage.setItem('ddakji_best',best);}catch(e){} }
    stage++; if(stage>bestStage){ bestStage=stage; try{localStorage.setItem('ddakji_bstage',bestStage);}catch(e){} }
    showMsg('뒤집기 성공! 🟫','#aef5b0'); showSub('+'+gain+'점 · STAGE '+stage+' ▶'+(combo>1?' ('+combo+'연속)':''));
    sfx.win(); sfx.vib([20,40,30]);
    for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*5; parts.push({x:0,y:-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:0.9,r:3+Math.random()*4,c:['#ffcf5c','#ff7a5c','#5cff9e','#5cc8ff'][i%4]}); }
  } else {
    combo=0;
    const lack=Math.max(1,90-deg);
    showMsg('아깝다! 😫','#ff9a9a');
    showSub(deg>=80? `90°까지 딱 ${lack}° 모자랐어요!` : `${deg}°까지 올라갔어요 · 조금 더 세게!`);
    sfx.fail(); sfx.vib(60);
  }
  setTop();
}

function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(flash>0) flash=Math.max(0,flash-dt*2);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=dt; } parts=parts.filter(p=>p.life>0);

  if(state==='ready'){
    power+=pdir*dt*barSpeed; if(power>=1){power=1;pdir=-1;} else if(power<=0){power=0;pdir=1;}
  } else if(state==='slam'){
    slamT+=dt; dropY=-220*(1-Math.min(1,slamT/0.22))**1.4 + Math.min(1,slamT/0.22)*0;
    dropY=-220*(1-Math.min(1,slamT/0.22)); if(slamT>=0.22){ dropY=0; doImpact(); }
  } else if(state==='flip'){
    // 역진자: 평형 0·π(안정), π/2(불안정 정점). α=-G·cos(θ)
    const steps=3; const h=dt/steps;
    for(let i=0;i<steps;i++){
      const a=-Gcur*Math.cos(theta);
      omega+=a*h; omega*=0.999; theta+=omega*h;
      if(theta>maxTheta) maxTheta=theta;
    }
    if(Math.abs(theta*180/Math.PI-90)<6 && Math.abs(omega)<2.2) { if(Math.random()<0.25) sfx.teeter(); }
    if(theta>=Math.PI){ theta=Math.PI; endFlip(true); }
    else if(theta<=0 && omega<=0){ theta=0; endFlip(false); }
  } else if(state==='result'){
    resultT+=dt;
  }
}

// ---- Render ----
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawDdakji(cx,cy,size,th,cols,flippedFaceUp){
  // th: 0=평평(윗면), PI=완전히 뒤집힘(아랫면). 세로 스케일=|cos|, 들림 높이=sin
  const sc=Math.abs(Math.cos(th));
  const lift=Math.sin(th)*size*0.5;
  const faceUp = th<Math.PI/2;   // 윗면 보이는 중
  const c = faceUp?cols:[cols[1],cols[0]];
  const h=size*sc;
  const y=cy-lift;
  ctx.save();
  // 그림자 (들릴수록 작고 흐려짐)
  ctx.globalAlpha=0.3*(1-Math.sin(th)*0.6); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,cy+size*0.52,size*0.56*(1-sc*0.2),size*0.14,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  // 접힌 종이 딱지 몸통(정사각 느낌, 세로눌림)
  const w=size*1.08;
  const grad=ctx.createLinearGradient(cx-w/2,y-h/2,cx+w/2,y+h/2); grad.addColorStop(0,c[0]); grad.addColorStop(1,c[1]);
  ctx.fillStyle=grad; roundRect(cx-w/2,y-h/2,w,Math.max(3,h),Math.min(10,h/2)); ctx.fill();
  // 대각선 접힘 무늬
  if(h>8){ ctx.save(); ctx.beginPath(); roundRect(cx-w/2,y-h/2,w,h,Math.min(10,h/2)); ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-w/2,y); ctx.lineTo(cx+w/2,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y-h/2); ctx.lineTo(cx,y+h/2); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx-w/2,y-h/2); ctx.lineTo(cx+w/2,y+h/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+w/2,y-h/2); ctx.lineTo(cx-w/2,y+h/2); ctx.stroke();
    ctx.restore();
    // 중앙 무늬 점
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(cx,y,Math.min(w,h)*0.14,0,Math.PI*2); ctx.fill();
  }
  // 윗면 하이라이트
  ctx.globalAlpha=0.25; ctx.fillStyle='#fff'; roundRect(cx-w/2+3,y-h/2+2,w-6,Math.max(2,h*0.3),4); ctx.fill(); ctx.globalAlpha=1;
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // 바닥(흙/마당)
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#4a3420'); bg.addColorStop(0.5,'#5c4028'); bg.addColorStop(1,'#3a281a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 바닥 질감 점
  ctx.fillStyle='rgba(0,0,0,.08)'; for(let i=0;i<40;i++){ const x=(i*97%W), y=(i*53%H); ctx.fillRect(x,y,3,3); }

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const CX=W/2, CY=H*0.46, SZ=Math.min(W*0.26,120);

  // 바닥 원(치는 자리)
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.arc(CX,CY+SZ*0.5,SZ*1.3,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  // 상대 딱지
  drawDdakji(CX,CY,SZ,theta,COLORS[pattern]);

  // 내리치는 내 딱지 (slam)
  if(state==='slam'){
    drawDdakji(CX,CY+dropY,SZ*0.92,0,COLORS[(pattern+3)%COLORS.length]);
  }

  // 먼지/파편
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life*1.5); ctx.fillStyle=p.c||'#d8c3a0'; ctx.beginPath(); ctx.arc(CX+p.x,CY+p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.restore();

  // 충격 플래시
  if(flash>0){ ctx.fillStyle='rgba(255,240,200,'+(flash*0.5)+')'; ctx.fillRect(0,0,W,H); }

  // 파워 바 (ready)
  if(state==='ready'){
    const bw=Math.min(W*0.8,340), bx=(W-bw)/2, by=H*0.78, bh=26;
    ctx.fillStyle='rgba(0,0,0,.4)'; roundRect(bx-3,by-3,bw+6,bh+6,10); ctx.fill();
    // 눈금 배경
    ctx.fillStyle='#2e2416'; roundRect(bx,by,bw,bh,8); ctx.fill();
    // 초록 구간
    ctx.fillStyle='rgba(90,220,120,.55)'; ctx.fillRect(bx+bw*GREEN[0],by,bw*(GREEN[1]-GREEN[0]),bh);
    ctx.fillStyle='rgba(120,255,150,.9)'; ctx.fillRect(bx+bw*GREEN[0],by,3,bh); ctx.fillRect(bx+bw*GREEN[1]-3,by,3,bh);
    // 마커
    const mx=bx+bw*power;
    ctx.fillStyle='#ffcf5c'; roundRect(mx-5,by-6,10,bh+12,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 12px system-ui'; ctx.textAlign='center'; ctx.fillText('힘',bx+bw/2,by-10);
  }
}

let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(state==='start'){ lastTs=ts; return; }
  let dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  update(dt); render();
}
requestAnimationFrame(loop);

// ---- Input ----
function tap(){
  initAudio();
  if(state==='ready'){ slam(); }
  else if(state==='result'){
    if(resultT<0.35) return;    // 결과 잠깐 보여주기
    newRound();
  }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
document.addEventListener('pointerdown',e=>{ if(state==='result'&&!e.target.closest('#start')) tap(); },{passive:false});

$('startBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); initAudio(); score=0; combo=0; won=0; stage=1; $('start').classList.add('hidden'); setTop(); newRound(); lastTs=performance.now(); });
setTop(); if(bestStage>1) $('bstage').textContent='🏆 최고 스테이지 '+bestStage;
</script>
</body></html>
