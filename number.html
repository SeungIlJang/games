<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 숫자</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e1a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#eef;touch-action:none;user-select:none;-webkit-user-select:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 120px 10px rgba(0,0,0,.5)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .16s ease-out}
  #target{font-size:16px;color:#8fa;letter-spacing:1px;margin-bottom:4px;font-weight:700}
  #targetN{font-size:78px;font-weight:900;color:#7cf6ff;text-shadow:0 0 24px rgba(124,246,255,.55);line-height:1;letter-spacing:2px}
  #tbar{width:70%;max-width:280px;height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:16px 0 24px}
  #tfill{height:100%;width:100%;background:linear-gradient(90deg,#5cffb0,#ffd34d,#ff5a6e);border-radius:6px}
  #choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:360px}
  .choice{background:#20304e;color:#fff;border:2px solid rgba(124,246,255,.4);border-radius:18px;padding:20px 26px;font-size:40px;font-weight:900;min-width:118px;cursor:pointer;box-shadow:0 6px 0 #12203a;transition:transform .05s}
  .choice:active{transform:translateY(3px);box-shadow:0 3px 0 #12203a}
  .choice.ok{background:#1f7a4d;border-color:#5cffb0;box-shadow:0 6px 0 #0e4a2c}
  .choice.bad{background:#7a2432;border-color:#ff5a6e;box-shadow:0 6px 0 #4a1420}
  #hint{font-size:14px;color:#8892b0;margin-top:16px;height:20px;font-weight:700}
  #banner{position:fixed;top:20%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;z-index:6;pointer-events:none;opacity:0}
  #banner.show{animation:bn .9s ease-out}
  @keyframes bn{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.1)}82%{opacity:1}100%{opacity:0;transform:scale(1)}}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-weight:800;font-size:15px;z-index:3}
  #combo{color:#ffd34d;font-weight:900}
  #ver{position:absolute;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:#3a4560;z-index:3}
  .float{position:fixed;left:50%;top:44%;transform:translateX(-50%);font-size:34px;font-weight:900;z-index:7;pointer-events:none;animation:fl .7s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
  #over,#start,#lb{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,22,.92);gap:10px;padding:24px;text-align:center;z-index:10}
  #lb{z-index:12;justify-content:flex-start;padding-top:calc(28px + env(safe-area-inset-top,0px))}
  #lbX{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#cfe;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:50%;cursor:pointer;z-index:13}
  #lbX:active{background:rgba(255,255,255,.2)}
  #lbList{width:100%;max-width:340px;margin:6px 0;max-height:60vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .lbrow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;margin:5px 0;border-radius:10px;font-size:17px;font-weight:700}
  #lbEdit{color:#7cf6ff;text-decoration:underline;margin-left:8px;font-size:13px}
  .hidden{display:none!important}
  h1{font-size:40px;margin:0 0 4px;text-shadow:0 0 22px rgba(124,246,255,.4)}
  .sub{color:#9fb;opacity:.85;font-size:15px}
  .miss{color:#ff6a7a;font-size:22px;font-weight:800}
  .rec{color:#ffd34d;font-weight:800}
  .btn{background:#3a7bff;color:#fff;border:none;border-radius:16px;padding:16px 34px;font-size:20px;font-weight:800;box-shadow:0 6px 0 #1f52c0;margin-top:8px;cursor:pointer}
  #changelog{margin-top:18px;font-size:13px;color:#9fb;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:8px 14px;max-width:300px}
  #changelog b{color:#7cf6ff}
</style></head>
<body>
<div id="vig"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="hud"><div>점수 <span id="score">0</span> <span id="hearts" style="color:#ffd34d;font-weight:900"></span></div><div id="combo"></div><div>최고 <span id="best">0</span></div></div>
<div id="wrap">
  <div id="target">🎯 같은 숫자를 고르세요!</div>
  <div id="targetN">–</div>
  <div id="tbar"><div id="tfill"></div></div>
  <div id="choices"></div>
  <div id="hint"></div>
</div>

<div id="start">
  <h1>모두의 숫자</h1>
  <div class="sub">위에 나온 <b style="color:#7cf6ff">목표 숫자</b>와 <b>같은 수</b>를 보기에서 <b>빠르게 탭</b>!</div>
  <div class="sub" style="opacity:.85;font-size:13.5px;">난이도가 오르면 보기가 <b>2 → 3 → 4개</b>, 숫자도 길어지고 <b style="color:#ff9a5a">비슷한 숫자</b>로 헷갈려요</div>
  <div class="sub" style="opacity:.6;font-size:13px;"><b style="color:#ffd34d">💛 8연속마다 생명 +1</b> · 틀리거나 <b>시간초과</b>면 끝(생명 0)<br/>갈수록 제한시간 짧아짐 — 순발력 승부!</div>
  <button class="btn" id="startBtn">시작</button>
  <div class="sub" style="margin-top:6px;">최고 <b id="best2">0</b></div>
  <button class="btn" id="lbBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:11px 24px;font-size:16px;margin-top:10px">🏆 랭킹</button>
  <div id="changelog">🆕 <b id="clVer">v2.0.0</b> · <span id="clNote">멈추기 → <b>고르기</b>로 대변신! 목표와 같은 수를 빠르게 선택 · 보기 2→3→4개</span></div>
</div>

<div id="over" class="hidden">
  <h1 id="overTitle">아깝다!</h1>
  <div class="miss" id="overMsg"></div>
  <div class="sub">점수 <b id="overScore">0</b> <span id="overRec"></span></div>
  <div class="sub" id="overRank" style="color:#ffd34d;font-weight:800;min-height:20px"></div>
  <div class="sub" style="opacity:.7">최고 <b id="overBest">0</b></div>
  <button class="btn" id="reviveBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52;display:none">🎬 광고 보고 이어하기</button>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn" id="retryBtn" style="padding:14px 22px;font-size:18px">한 판 더</button>
    <button class="btn" id="shareBtn" style="padding:14px 22px;font-size:18px;background:#20263c;box-shadow:0 6px 0 #10131f">🏆 공유</button>
  </div>
  <div id="overLbBtn" style="margin-top:12px;color:#7cf6ff;font-size:15px;text-decoration:underline">🏆 랭킹 보기</div>
</div>

<div id="lb" class="hidden">
  <div id="lbX" role="button" aria-label="닫기">✕</div>
  <h1>🏆 랭킹</h1>
  <div class="sub" id="lbName"></div>
  <div id="lbList"></div>
  <button class="btn" id="lbClose" style="margin-top:6px">닫기</button>
</div>
<div id="ver">v2.0.0 · 선택형(목표와 같은 수 고르기)</div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

let AC; function tone(f,d,type,g){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v); v.connect(AC.destination); const t=AC.currentTime; o.start(t); v.gain.setValueAtTime(v.gain.value,t); v.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1)); o.stop(t+(d||0.1)); }catch(e){} }
function chord(base){ [0,4,7].forEach((s,i)=>setTimeout(()=>tone(base*Math.pow(2,s/12),0.14,'triangle',0.06),i*35)); }
function vib(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }

// ── 광고(AdMob) — 폰(AAB)=실광고, 웹=시뮬. ⚠️ AD_USE_TEST=true 유지(실광고 직접 클릭시 계정정지). 출시 때만 false ──
const AD_USE_TEST=true;
const AD_REWARD_TEST='ca-app-pub-3940256099942544/5224354917';
const AD_INTER_TEST ='ca-app-pub-3940256099942544/1033173712';
const AD_BANNER_TEST='ca-app-pub-3940256099942544/6300978111';
const AD_REWARD_REAL=''; const AD_INTER_REAL=''; const AD_BANNER_REAL='';
let admobReady=false, adPlaying=false;
(async function initAdMob(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob){ await C.Plugins.AdMob.initialize({initializeForTesting:AD_USE_TEST}); admobReady=true; if(state==='start') showBanner(); } }catch(e){ admobReady=false; } })();
async function playAd(onReward){
  if(adPlaying) return; adPlaying=true;
  const _done=(cb)=>{ adPlaying=false; if(cb) cb(); };
  const C=window.Capacitor;
  if(admobReady && C && C.Plugins && C.Plugins.AdMob){
    const AdMob=C.Plugins.AdMob; let lr=null, ld=null, lf=null;
    try{
      lr=await AdMob.addListener('onRewardedVideoAdReward',()=>{});
      await AdMob.prepareRewardVideoAd({ adId: AD_USE_TEST?AD_REWARD_TEST:AD_REWARD_REAL });
      await new Promise((resolve)=>{ let done=false; const fin=()=>{ if(done)return; done=true; resolve(); };
        AdMob.addListener('onRewardedVideoAdDismissed',fin).then(l=>{ ld=l; });
        AdMob.addListener('onRewardedVideoAdFailedToShow',fin).then(l=>{ lf=l; });
        AdMob.showRewardVideoAd().catch(fin); setTimeout(fin,40000); });
      if(lr&&lr.remove)lr.remove(); if(ld&&ld.remove)ld.remove(); if(lf&&lf.remove)lf.remove();
      _done(onReward); return;
    }catch(e){ if(lr&&lr.remove)lr.remove(); if(ld&&ld.remove)ld.remove(); _done(onReward); return; }
  }
  setTimeout(()=>{ _done(onReward); }, 700);
}
let bannerShown=false;
async function showBanner(){ const C=window.Capacitor; if(!admobReady || !(C&&C.Plugins&&C.Plugins.AdMob) || bannerShown) return; bannerShown=true;
  try{ await C.Plugins.AdMob.showBanner({ adId: AD_USE_TEST?AD_BANNER_TEST:AD_BANNER_REAL, adSize:'BANNER', position:'BOTTOM_CENTER', margin:0, isTesting:AD_USE_TEST }); }catch(e){ bannerShown=false; } }
async function hideBanner(){ const C=window.Capacitor; if(!admobReady || !(C&&C.Plugins&&C.Plugins.AdMob) || !bannerShown) return; bannerShown=false; try{ await C.Plugins.AdMob.hideBanner(); }catch(e){} }

// ── 랭킹 (갤로그의 귀환과 같은 Firebase 재사용, 컬렉션 number_lb) ──
window.FB_CONFIG = window.FB_CONFIG || { apiKey:"AIzaSyDUanex0x7CmvCQxBK2d3a7SkyscuEGzwY", authDomain:"gallog-return-be90f.firebaseapp.com", projectId:"gallog-return-be90f", appId:"1:317854999265:web:c78708adabdef449a08da0" };
let myName = (function(){ try{ return localStorage.getItem('num_name')||'나'; }catch(e){ return '나'; } })();
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function loadLB(){ try{ return JSON.parse(localStorage.getItem('num_lb')||'[]'); }catch(e){ return []; } }
function saveLB(a){ try{ localStorage.setItem('num_lb', JSON.stringify(a)); }catch(e){} }
function insertScore(sc){ let a=loadLB(); a.forEach(e=>e.me=false); const entry={name:myName,score:sc,me:true}; a.push(entry); a.sort((x,y)=>y.score-x.score); a=a.slice(0,10); saveLB(a); return a.findIndex(e=>e.me)+1; }
let fbReady=false, fbDb=null, fbApi=null;
(async function initFB(){ try{
  if(!window.FB_CONFIG || !FB_CONFIG.apiKey) return;
  const appM=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const fsM =await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const app=appM.initializeApp(FB_CONFIG); fbDb=fsM.getFirestore(app); fbApi=fsM; fbReady=true;
}catch(e){ fbReady=false; } })();
async function fbSubmit(name,sc){ if(!fbReady) return; try{ await fbApi.addDoc(fbApi.collection(fbDb,'number_lb'),{ name:String(name).slice(0,16), score:Math.floor(sc), ts:fbApi.serverTimestamp() }); }catch(e){} }
async function fbTop(){ if(!fbReady) return null; try{ const q=fbApi.query(fbApi.collection(fbDb,'number_lb'), fbApi.orderBy('score','desc'), fbApi.limit(20)); const s=await fbApi.getDocs(q); return s.docs.map(d=>d.data()); }catch(e){ return null; } }
function renderList(a, mineFn){ const box=$('lbList');
  if(!a || !a.length){ box.innerHTML='<div class="sub" style="opacity:.6;padding:24px">아직 기록이 없어요.<br/>첫 주인공이 되어보세요! 🎯</div>'; return; }
  box.innerHTML=a.map((e,i)=>{ const me=mineFn?mineFn(e,i):e.me; const medal=['🥇','🥈','🥉'][i]||('<span style="opacity:.55;display:inline-block;width:1.4em">'+(i+1)+'</span>');
    return '<div class="lbrow" style="background:'+(me?'rgba(124,246,255,.16)':'rgba(255,255,255,.045)')+';border:1px solid '+(me?'rgba(124,246,255,.55)':'transparent')+'"><span>'+medal+' '+esc(e.name)+'</span><b style="color:#7cf6ff">'+e.score+'</b></div>'; }).join('');
}
function lbHeader(mode){ $('lbName').innerHTML=mode+' · 닉네임: <b>'+esc(myName)+'</b><span id="lbEdit">✏️ 변경</span>'; $('lbEdit').onclick=editName; }
function renderLB(){ lbHeader('📱 내 기기'); renderList(loadLB(), e=>e.me); }
function editName(){ const n=prompt('닉네임 (최대 8자)', myName); if(n && n.trim()){ myName=n.trim().slice(0,8); try{localStorage.setItem('num_name',myName);}catch(e){} showLB(); } }
let _mineMark=null;
async function showLB(){ $('lb').classList.remove('hidden');
  if(fbReady){ lbHeader('🌐 전세계'); $('lbList').innerHTML='<div class="sub" style="opacity:.6;padding:24px">🌐 전세계 순위 불러오는 중…</div>';
    const arr=await fbTop();
    if(arr===null){ $('lbList').innerHTML='<div class="sub" style="opacity:.6;padding:24px">순위를 못 불러왔어요.<br/>잠시 후 다시 시도해주세요.</div>'; return; }
    let marked=false; renderList(arr, (e)=>{ if(marked||!_mineMark) return false; if(e.name===_mineMark.name && e.score===_mineMark.score){ marked=true; return true; } return false; });
  } else { renderLB(); }
}
function hideLB(){ $('lb').classList.add('hidden'); }
function shareScore(){
  const txt='모두의 숫자 '+score+'점! 🔢 목표와 같은 숫자 빠르게 고르기 — 도전해봐!\nhttps://seungiljang.github.io/games/number.html';
  try{ if(navigator.share){ navigator.share({title:'모두의 숫자', text:txt}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(txt); floatText('📋 복사됨!','#7cf6ff'); }catch(e){}
}

const fx=$('fx'), fc=fx.getContext('2d'); let FW,FH,DPR=1, parts=[], shake=0;
function fxresize(){ DPR=Math.min(devicePixelRatio||1,2); FW=innerWidth; FH=innerHeight; fx.width=FW*DPR; fx.height=FH*DPR; fc.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',fxresize); fxresize();
function burst(x,y,col,n,spd){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=spd*(0.4+Math.random()); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col,r:2+Math.random()*3}); } }
function centerXY(){ const r=$('targetN').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function fxloop(){ requestAnimationFrame(fxloop);
  fc.clearRect(0,0,FW,FH);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.022; }
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){ fc.globalAlpha=Math.max(0,p.life); fc.fillStyle=p.col; fc.beginPath(); fc.arc(p.x,p.y,p.r,0,6.283); fc.fill(); }
  fc.globalAlpha=1;
  let sx=0,sy=0; if(shake>0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; shake*=0.86; if(shake<0.4)shake=0; }
  $('wrap').style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)';
}
fxloop();
function floatText(txt,col){ const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.color=col; document.body.appendChild(d); setTimeout(()=>d.remove(),720); }
function hitFlash(col){ const f=$('flash'); f.style.background='radial-gradient(circle at 50% 42%,'+col+'66,transparent 62%)'; f.style.opacity='1'; setTimeout(()=>{ f.style.opacity='0'; },120); }
function banner(txt,col){ const b=$('banner'); b.textContent=txt; b.style.color=col||'#fff'; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }

// ===== 선택형 코어 =====
let best=+(localStorage.getItem('num_best')||0);
$('best').textContent=best; $('best2').textContent=best; $('overBest').textContent=best;
let state='start', score=0, hits=0, hearts=0;
let target=0, choices=[], answerIdx=-1, qDur=0, qTO=null, locked=false;
let reviveCount=0; const MAX_REVIVE=5;
function renderHearts(){ const e=$('hearts'); if(e) e.textContent = hearts>0 ? ('💛×'+hearts) : ''; }

function numChoices(){ return hits<3?2 : hits<8?3 : 4; }
function numDigits(){ return hits<5?2 : hits<12?3 : (hits<22?4:5); }
function qTime(){ return Math.max(1100, 3200 - hits*95); }   // 제한시간 점점 짧게
function makeDecoy(t,digits,lo,hi){
  if(Math.random()<0.5){ const s=String(t).split(''); if(s.length>=2){ let i=rnd(0,s.length-1),j=rnd(0,s.length-1),g=0; while(j===i&&g++<6)j=rnd(0,s.length-1); const tmp=s[i];s[i]=s[j];s[j]=tmp; const v=+s.join(''); if(v!==t && v>=lo && v<=hi) return v; } }
  const off=pick([-3,-2,-1,1,2,3,10,-10,11,-11,-1,1]); let v=t+off; if(v<lo)v+=20; if(v>hi)v-=20; if(v===t)v=(t<hi?t+1:t-1); return v;
}
function newQuestion(){
  locked=false; const nc=numChoices(), digits=numDigits(), lo=Math.pow(10,digits-1), hi=Math.pow(10,digits)-1;
  target=rnd(lo,hi);
  const set=new Set([target]), arr=[target]; let guard=0;
  while(arr.length<nc && guard++<300){ const d=makeDecoy(target,digits,lo,hi); if(!set.has(d)){ set.add(d); arr.push(d); } }
  while(arr.length<nc){ const d=rnd(lo,hi); if(!set.has(d)){ set.add(d); arr.push(d); } }
  for(let i=arr.length-1;i>0;i--){ const j=rnd(0,i); const t=arr[i];arr[i]=arr[j];arr[j]=t; }
  choices=arr; answerIdx=arr.indexOf(target); qDur=qTime();
  renderQ(); startQTimer();
}
function renderQ(){
  $('targetN').textContent=target; $('score').textContent=score; $('best').textContent=best;
  $('combo').textContent=hits>=2?('🔥 '+hits+' 연속'):''; $('hint').textContent='';
  const box=$('choices'); box.innerHTML='';
  choices.forEach((v,i)=>{ const b=document.createElement('button'); b.className='choice'; b.textContent=v; b.onclick=(e)=>{ e.stopPropagation(); onChoice(i,b); }; box.appendChild(b); });
  const heat=Math.min(1,hits/16); $('vig').style.boxShadow='inset 0 0 '+(120-heat*40)+'px 10px rgba('+Math.round(60*heat)+',0,0,'+(0.5+heat*0.3).toFixed(2)+')';
}
function startQTimer(){ clearTimeout(qTO); const f=$('tfill'); f.style.transition='none'; f.style.width='100%'; void f.offsetWidth;
  f.style.transition='width '+qDur+'ms linear'; f.style.width='0%';
  qTO=setTimeout(()=>{ if(!locked && state==='play'){ locked=true; if(answerIdx>=0){ const ok=$('choices').children[answerIdx]; if(ok)ok.classList.add('ok'); } die('timeout'); } }, qDur);
}
function onChoice(i,btn){ if(locked || state!=='play') return; locked=true; clearTimeout(qTO);
  const f=$('tfill'); const w=getComputedStyle(f).width; f.style.transition='none'; f.style.width=w;
  if(i===answerIdx){ if(btn)btn.classList.add('ok'); correct(); }
  else { if(btn)btn.classList.add('bad'); const ok=$('choices').children[answerIdx]; if(ok)ok.classList.add('ok'); die('wrong', choices[i]); }
}
function correct(){
  hits++; score += 10 + (hits-1)*2;
  const [x,y]=centerXY();
  if(hits%8===0){ hearts++; renderHearts(); burst(x,y,'#ffd34d',50,8); hitFlash('#ffd34d'); floatText('💛 생명 +1! ('+hits+'연속)','#ffd34d'); chord(523); setTimeout(()=>chord(784),120); vib([20,40,20,40,60]); shake=7; }
  else if(hits%5===0){ burst(x,y,'#ffd34d',42,8); hitFlash('#ffd34d'); floatText('🔥 '+hits+' 연속!','#ffd34d'); chord(440); vib([15,30,15]); shake=6; }
  else { burst(x,y,'#5cffb0',24,6); hitFlash('#5cffb0'); floatText(pick(['정답!','NICE!','좋아!','굿!']),'#5cffb0'); tone(720+Math.min(hits,20)*8,0.07,'square',0.07); vib(16); }
  $('score').textContent=score;
  setTimeout(newQuestion, 230);
}
function die(reason, picked){
  clearTimeout(qTO); locked=true;
  const correctVal=target;
  hitFlash('#ff5a6e'); shake=16; vib(120); tone(200,0.16,'sawtooth',0.09);
  const msg = reason==='timeout' ? ('⏰ 시간 초과! 정답 <b style="color:#5cffb0">'+correctVal+'</b>')
    : ('❌ 틀림! 정답 <b style="color:#5cffb0">'+correctVal+'</b>'+(picked!=null?(' <span style="opacity:.7">(고른 값 '+picked+')</span>'):''));
  banner(reason==='timeout'?'⏰ 시간 초과!':'❌ 틀렸어요','#ff5a6e');
  if(hearts>0 && state==='play'){ hearts--; renderHearts();
    setTimeout(()=>{ banner('💛 생명 사용! 계속 GO!','#ffd34d'); tone(660,0.12,'sine',0.09); setTimeout(()=>tone(880,0.12,'sine',0.08),110); newQuestion(); }, 900);
    return;
  }
  state='over';
  const [x,y]=centerXY(); burst(x,y,'#ff5a6e',54,9); shake=24; vib(200); setTimeout(()=>tone(110,0.3,'sawtooth',0.08),90);
  let rec=false; if(score>best){ best=score; try{localStorage.setItem('num_best',best);}catch(e){} rec=true; }
  $('best').textContent=best; $('overBest').textContent=best;
  $('overTitle').textContent = rec?'🏆 신기록!':'❌ 실패!';
  $('overMsg').innerHTML = msg;
  $('overScore').textContent=score;
  $('overRec').innerHTML = rec?'<span class="rec">최고 갱신!</span>' : (best>0?('(최고까지 '+(best-score)+'점!)'):'');
  const rank = score>0 ? insertScore(score) : 0;
  if(score>0 && fbReady){ _mineMark={name:myName,score:Math.floor(score)}; fbSubmit(myName,score); $('overRank').textContent='🌐 전세계 랭킹 등록! (랭킹 보기)'; }
  else $('overRank').textContent = rank>0 ? ('🏆 랭킹 '+rank+'위'+(rank===1?' — 1등!':(rank<=3?' 진입!':''))) : '';
  showBanner();
  const canRevive = reviveCount<MAX_REVIVE && score>0;
  $('reviveBtn').style.display = canRevive ? 'block' : 'none';
  if(canRevive) $('reviveBtn').textContent = '🎬 광고 보고 이어하기 ('+(MAX_REVIVE-reviveCount)+'회 남음)';
  setTimeout(()=>{ $('over').classList.remove('hidden'); },750);
  if(score>0) setTimeout(()=>{ if(state==='over' && $('lb').classList.contains('hidden')) showLB(); }, 2100);
}
function start(){ score=0; hits=0; hearts=1; reviveCount=0; hideBanner(); $('start').classList.add('hidden'); $('over').classList.add('hidden'); state='play';
  try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  renderHearts(); newQuestion(); }
function revive(){ if(reviveCount>=MAX_REVIVE || state!=='over') return; reviveCount++;
  playAd(()=>{ $('over').classList.add('hidden'); $('reviveBtn').style.display='none'; state='play'; hideBanner(); floatText('🔥 이어하기!','#2ec77a'); vib([20,40,20]); newQuestion(); }); }
function retryGame(){ start(); }
$('startBtn').onclick=()=>start();
$('retryBtn').onclick=()=>retryGame();
$('reviveBtn').onclick=()=>revive();
$('shareBtn').onclick=()=>shareScore();
$('lbBtn').onclick=()=>showLB();
$('overLbBtn').onclick=()=>showLB();
$('lbClose').onclick=()=>hideLB();
$('lbX').onclick=()=>hideLB();
</script>
</body></html>
