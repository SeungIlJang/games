<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 숫자</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e1a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#eef;touch-action:none;user-select:none;-webkit-user-select:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 120px 10px rgba(0,0,0,.5)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .16s ease-out}
  #wrap.slow #cur{transition:transform .12s ease-out;transform:scale(1.14)}
  #target{font-size:15px;color:#8fa;letter-spacing:1px;margin-bottom:2px}
  #targetN{font-size:46px;font-weight:900;color:#7cf6ff;text-shadow:0 0 20px rgba(124,246,255,.55);line-height:1}
  #cur{font-size:126px;font-weight:900;line-height:1;margin:16px 0}
  #cur.roll{color:#c9a3ff!important;text-shadow:0 0 4px #c9a3ff, 0 -14px 16px rgba(201,163,255,.5), 0 14px 16px rgba(201,163,255,.5)}
  #seq{font-size:21px;color:#5a6684;letter-spacing:1px;min-height:26px;font-weight:700}
  #hint{font-size:14px;color:#8892b0;margin-top:8px;height:20px;font-weight:700}
  #banner{position:fixed;top:24%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;z-index:6;pointer-events:none;opacity:0}
  #banner.show{animation:bn .9s ease-out}
  @keyframes bn{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.1)}82%{opacity:1}100%{opacity:0;transform:scale(1)}}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-weight:800;font-size:15px;z-index:3}
  #combo{color:#ffd34d;font-weight:900}
  #ver{position:absolute;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:#3a4560;z-index:3}
  .big{animation:pop .13s ease-out}
  @keyframes pop{0%{transform:scale(1.42)}55%{transform:scale(.94)}100%{transform:scale(1)}}
  .near{animation:near .18s ease-in-out infinite alternate}
  @keyframes near{0%{transform:scale(1)}100%{transform:scale(1.09)}}
  .float{position:fixed;left:50%;top:46%;transform:translateX(-50%);font-size:34px;font-weight:900;z-index:7;pointer-events:none;animation:fl .7s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
  #over,#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,22,.92);gap:10px;padding:24px;text-align:center;z-index:10}
  .hidden{display:none!important}
  h1{font-size:40px;margin:0 0 4px;text-shadow:0 0 22px rgba(124,246,255,.4)}
  .sub{color:#9fb;opacity:.85;font-size:15px}
  .miss{color:#ff6a7a;font-size:22px;font-weight:800}
  .rec{color:#ffd34d;font-weight:800}
  .btn{background:#3a7bff;color:#fff;border:none;border-radius:16px;padding:16px 34px;font-size:20px;font-weight:800;box-shadow:0 6px 0 #1f52c0;margin-top:8px;cursor:pointer}
  #changelog{margin-top:18px;font-size:13px;color:#9fb;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:8px 14px;max-width:300px}
  #changelog b{color:#7cf6ff}
</style></head>
<body>
<div id="vig"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="hud"><div>점수 <span id="score">0</span></div><div id="combo"></div><div>최고 <span id="best">0</span></div></div>
<div id="wrap">
  <div id="target">🎯 이 숫자에서 멈춰!</div>
  <div id="targetN">–</div>
  <div id="cur">–</div>
  <div id="seq"></div>
  <div id="hint"></div>
</div>

<div id="start">
  <h1>모두의 숫자</h1>
  <div class="sub">숫자가 <b>규칙</b>대로 바뀝니다. 수열을 읽고 <b style="color:#7cf6ff">목표</b>에서 <b>탭</b>!<br/>가끔 <b style="color:#c9a3ff">⚡ 롤링</b>은 초고속 — <b>감으로</b> 멈추세요!</div>
  <div class="sub" style="opacity:.6;font-size:13px;">틀리거나 놓치면 즉시 끝 · 갈수록 빨라짐<br/><b style="color:#ff9a5a">처음 3판만 슬로모로 도와줘요 · 4판부터 실전!</b></div>
  <button class="btn" id="startBtn">시작</button>
  <div class="sub" style="margin-top:6px;">최고 <b id="best2">0</b></div>
  <div id="changelog">🆕 <b id="clVer">v0.9</b> · <span id="clNote">광고 이어하기 · 점수 공유 · 전면광고(탑100 기본세트)</span></div>
</div>

<div id="over" class="hidden">
  <h1 id="overTitle">아깝다!</h1>
  <div class="miss" id="overMsg"></div>
  <div class="sub">점수 <b id="overScore">0</b> <span id="overRec"></span></div>
  <div class="sub" style="opacity:.7">최고 <b id="overBest">0</b></div>
  <button class="btn" id="reviveBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52;display:none">🎬 광고 보고 이어하기</button>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn" id="retryBtn" style="padding:14px 24px;font-size:18px">한 판 더</button>
    <button class="btn" id="shareBtn" style="padding:14px 24px;font-size:18px;background:#20263c;box-shadow:0 6px 0 #10131f">🏆 공유</button>
  </div>
</div>
<div id="ver">v0.9 · 광고이어하기·공유·전면광고</div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const ROLL_MS=70;

let AC; function tone(f,d,type,g){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v); v.connect(AC.destination); const t=AC.currentTime; o.start(t); v.gain.setValueAtTime(v.gain.value,t); v.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1)); o.stop(t+(d||0.1)); }catch(e){} }
function chord(base){ [0,4,7].forEach((s,i)=>setTimeout(()=>tone(base*Math.pow(2,s/12),0.14,'triangle',0.06),i*35)); }
function vib(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }

// ── 광고(AdMob) — 폰(AAB)=실광고, 웹=시뮬. ⚠️ AD_USE_TEST=true 유지(실광고 직접 클릭시 계정정지). 출시 때만 false ──
const AD_USE_TEST=true;
const AD_REWARD_TEST='ca-app-pub-3940256099942544/5224354917';   // 구글 공식 테스트 리워드
const AD_INTER_TEST ='ca-app-pub-3940256099942544/1033173712';   // 구글 공식 테스트 전면
const AD_REWARD_REAL=''; const AD_INTER_REAL='';                  // 출시 시 실제 광고단위 ID 입력
let admobReady=false, adPlaying=false;
(async function initAdMob(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob){ await C.Plugins.AdMob.initialize({initializeForTesting:AD_USE_TEST}); admobReady=true; } }catch(e){ admobReady=false; } })();
function adLoading(on){ let el=document.getElementById('adLoading');
  if(!el){ if(!document.getElementById('adSpKf')){ const st=document.createElement('style'); st.id='adSpKf'; st.textContent='@keyframes sp{to{transform:rotate(360deg)}}'; document.head.appendChild(st); }
    el=document.createElement('div'); el.id='adLoading';
    el.innerHTML='<div class="sp" style="width:38px;height:38px;border:5px solid rgba(255,255,255,.15);border-top-color:#7cf6ff;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px;"></div><div>🎬 광고 준비중…</div>';
    el.style.cssText='position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;background:rgba(8,10,22,.82);color:#fff;font-size:19px;font-weight:800;';
    document.body.appendChild(el); }
  el.style.display=on?'flex':'none'; }
async function playAd(onReward){   // 리워드 광고 (부활)
  if(adPlaying) return; adPlaying=true; adLoading(true);
  const _done=(cb)=>{ adPlaying=false; adLoading(false); if(cb) cb(); };
  const C=window.Capacitor;
  if(admobReady && C && C.Plugins && C.Plugins.AdMob){
    const AdMob=C.Plugins.AdMob; let lr=null, ld=null, lf=null;
    try{
      lr=await AdMob.addListener('onRewardedVideoAdReward',()=>{});
      await AdMob.prepareRewardVideoAd({ adId: AD_USE_TEST?AD_REWARD_TEST:AD_REWARD_REAL });
      await new Promise((resolve)=>{ let done=false; const fin=()=>{ if(done)return; done=true; resolve(); };
        AdMob.addListener('onRewardedVideoAdDismissed',fin).then(l=>{ ld=l; });
        AdMob.addListener('onRewardedVideoAdFailedToShow',fin).then(l=>{ lf=l; });
        AdMob.showRewardVideoAd().catch(fin); setTimeout(fin,40000); });
      if(lr&&lr.remove)lr.remove(); if(ld&&ld.remove)ld.remove(); if(lf&&lf.remove)lf.remove();
      _done(onReward); return;
    }catch(e){ if(lr&&lr.remove)lr.remove(); if(ld&&ld.remove)ld.remove(); _done(onReward); return; }
  }
  setTimeout(()=>{ _done(onReward); }, 700);   // 웹 시뮬
}
async function playInterstitial(done){   // 전면 광고 (라운드 사이)
  const C=window.Capacitor;
  if(admobReady && C && C.Plugins && C.Plugins.AdMob){
    const AdMob=C.Plugins.AdMob; let ld=null, lf=null;
    try{
      await AdMob.prepareInterstitial({ adId: AD_USE_TEST?AD_INTER_TEST:AD_INTER_REAL });
      await new Promise((resolve)=>{ let d=false; const fin=()=>{ if(d)return; d=true; resolve(); };
        AdMob.addListener('interstitialAdDismissed',fin).then(l=>{ ld=l; });
        AdMob.addListener('interstitialAdFailedToShow',fin).then(l=>{ lf=l; });
        AdMob.showInterstitial().catch(fin); setTimeout(fin,30000); });
      if(ld&&ld.remove)ld.remove(); if(lf&&lf.remove)lf.remove();
    }catch(e){}
  }
  if(done) done();
}
function shareScore(){
  const txt='모두의 숫자 '+score+'점! 🎯 규칙 읽고 목표에서 STOP — 도전해봐!\nhttps://seungiljang.github.io/games/number.html';
  try{ if(navigator.share){ navigator.share({title:'모두의 숫자', text:txt}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(txt); floatText('📋 복사됨!','#7cf6ff'); }catch(e){}
}

const fx=$('fx'), fc=fx.getContext('2d'); let FW,FH,DPR=1, parts=[], shake=0;
function fxresize(){ DPR=Math.min(devicePixelRatio||1,2); FW=innerWidth; FH=innerHeight; fx.width=FW*DPR; fx.height=FH*DPR; fc.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',fxresize); fxresize();
function burst(x,y,col,n,spd){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=spd*(0.4+Math.random()); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col,r:2+Math.random()*3}); } }
function centerXY(){ const r=$('cur').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function fxloop(){ requestAnimationFrame(fxloop);
  fc.clearRect(0,0,FW,FH);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.022; }
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){ fc.globalAlpha=Math.max(0,p.life); fc.fillStyle=p.col; fc.beginPath(); fc.arc(p.x,p.y,p.r,0,6.283); fc.fill(); }
  fc.globalAlpha=1;
  let sx=0,sy=0; if(shake>0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; shake*=0.86; if(shake<0.4)shake=0; }
  $('wrap').style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)';
}
fxloop();
function floatText(txt,col){ const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.color=col; document.body.appendChild(d); setTimeout(()=>d.remove(),720); }
function hitFlash(col){ const f=$('flash'); f.style.background='radial-gradient(circle at 50% 46%,'+col+'66,transparent 62%)'; f.style.opacity='1'; setTimeout(()=>{ f.style.opacity='0'; },120); }
function banner(txt,col){ const b=$('banner'); b.textContent=txt; b.style.color=col||'#fff'; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }

let best=+(localStorage.getItem('num_best')||0);
$('best').textContent=best; $('best2').textContent=best; $('overBest').textContent=best;
let state='start', cur=0, target=0, score=0, hits=0, rule=null, ti=0, seq=[], timer=null;
let curIsRoll=false, rollLo=0, rollHi=0, rollTO=null, slowEndShown=false;
let reviveUsed=false, deathCount=0;   // 부활 1회/판, 전면광고 주기 카운터

function makeRule(){
  if(hits<2) return {type:'add',s:1};                         // 온보딩 2판
  const r=Math.random();
  if(hits>=4 && r<0.22) return {type:'roll'};                 // ⚡ 감 롤링 라운드
  if(hits<6)  return {type:'add', s:pick([2,3,4,5])};
  if(hits<11) return Math.random()<0.62? {type:'add', s:pick([2,3,4,5,6,7])} : {type:'alt', a:pick([2,3,4]), b:pick([1,2,3])};
  const q=Math.random();
  return q<0.4? {type:'add', s:pick([-4,-3,3,4,5,6,7,8])} : q<0.78? {type:'alt', a:pick([2,3,4,5]), b:pick([1,2,3,4])} : {type:'add', s:pick([6,7,8,9])};
}
function stepAt(i){ return rule.type==='add'? rule.s : (i%2===0? rule.a : rule.b); }
function speed(){ return Math.max(195, 640 - hits*23); }

function newRound(keepCur){
  clearTimeout(rollTO); rule=makeRule(); ti=0; curIsRoll = rule.type==='roll';
  $('cur').classList.toggle('roll', curIsRoll); $('wrap').classList.remove('slow');
  if(curIsRoll){
    target = rnd(8,40); rollLo=target-6; rollHi=target+2; cur=rollLo; seq=[];
    banner('⚡ 롤링! 감으로 STOP','#c9a3ff'); vib(30);
    // 롤링은 누를 때까지 여유있게 대기 (제한시간 없음)
  } else {
    if(!keepCur) cur = hits<2 ? 1 : rnd(4,16);
    const k=rnd(3,5); let t=cur; for(let i=0;i<k;i++) t+=stepAt(i); target=t; seq=[cur];
    if(hits>=3 && !slowEndShown){ slowEndShown=true; banner('🔥 슬로모 끝! 이제 실전','#ff9a5a'); vib([20,40,20]); }
  }
  render(false);
}
function render(pulse){
  $('targetN').textContent=target;
  const c=$('cur'); c.textContent=cur;
  if(curIsRoll){
    $('seq').textContent=''; $('hint').textContent='⚡ 감으로 멈춰!'; $('combo').textContent=hits>=2?('🔥 '+hits+' 연속'):''; $('score').textContent=score;
    $('vig').style.boxShadow='inset 0 0 90px 10px rgba(90,50,160,.55)';
    return;
  }
  const heat=Math.min(1,hits/14); c.style.color='rgb('+Math.round(238+17*heat)+','+Math.round(238-130*heat)+','+Math.round(255-210*heat)+')';
  const nextVal=cur+stepAt(ti); const near=hits<3 && (target-cur)!==0 && nextVal===target;   // 텔레그래프도 3판까지만
  c.classList.toggle('near', !!near);
  if(pulse && !near){ c.classList.remove('big'); void c.offsetWidth; c.classList.add('big'); }
  $('seq').textContent=seq.join('  →  ');
  $('score').textContent=score; $('combo').textContent=hits>=2?('🔥 '+hits+' 연속'):'';
  $('hint').textContent = hits<3 ? (near?'⚡ 다음이 목표! 탭!' : (cur===target?'👆 지금!':'')) : '';
  $('vig').style.boxShadow='inset 0 0 '+(120-heat*40)+'px 10px rgba('+Math.round(60*heat)+',0,0,'+(0.5+heat*0.35).toFixed(2)+')';
}
function tick(){
  if(curIsRoll){
    cur++; if(cur>rollHi) cur=rollLo; render(false);
    tone(520+ (cur%9)*30, 0.02, 'square', 0.025);
    timer=setTimeout(tick, ROLL_MS); return;
  }
  cur+=stepAt(ti); ti++; seq.push(cur); if(seq.length>4) seq.shift();
  const dir=Math.sign(target-(seq[0]));
  if((dir>=0 && cur>target) || (dir<0 && cur<target)){ die('놓쳤다! '+target+' 지나감'); return; }
  render(true);
  const nv=cur+stepAt(ti), slow=(hits<3 && target-cur!==0 && nv===target);   // 슬로모는 3판까지만(그 뒤엔 실력)
  $('wrap').classList.toggle('slow', slow);
  if(slow) tone(880,0.05,'sine',0.05); else tone(300+Math.min(hits,22)*11, 0.03, 'sine', 0.03);
  timer=setTimeout(tick, slow ? Math.round(speed()*1.9)+140 : speed());
}
function nextTick(first){ clearTimeout(timer); timer=setTimeout(tick, curIsRoll?ROLL_MS:first); }
function start(){ score=0; hits=0; slowEndShown=false; reviveUsed=false; $('start').classList.add('hidden'); $('over').classList.add('hidden'); state='play';
  try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  newRound(false); nextTick(560); }
function hitOK(){
  const wasRoll=curIsRoll; clearTimeout(rollTO);
  hits++; score += (wasRoll?25:10) + (hits-1)*2;
  const [x,y]=centerXY();
  if(wasRoll){ burst(x,y,'#c9a3ff',46,8); hitFlash('#c9a3ff'); floatText(cur===target?'⚡ 완벽!':'⚡ 굿!','#c9a3ff'); chord(523); vib([20,40,20]); }
  else if(hits%5===0){ burst(x,y,'#ffd34d',48,8); hitFlash('#ffd34d'); floatText('🔥 '+hits+' 연속!','#ffd34d'); chord(440); vib([15,30,15]); shake=8; }
  else { burst(x,y,'#5cffb0',28,6); hitFlash('#5cffb0'); floatText(pick(['PERFECT!','NICE!','좋아!','정확!']),'#5cffb0'); tone(720+hits*8,0.07,'square',0.07); vib(18); }
  newRound(true); nextTick(Math.max(220, speed()));
}
function tap(){
  if(state!=='play'){ start(); return; }
  const ok = curIsRoll ? Math.abs(cur-target)<=1 : cur===target;   // 롤링은 ±1까지 인정(관대)
  if(ok){ hitOK(); }
  else { die((curIsRoll?'아깝다! (롤링) ':'아깝다! ')+'목표 '+target+', '+cur+'에서 멈춤 (差 '+Math.abs(target-cur)+')'); }
}
function die(msg){
  clearTimeout(timer); clearTimeout(rollTO); state='over';
  $('wrap').classList.remove('slow');
  const [x,y]=centerXY(); burst(x,y,'#ff5a6e',54,9); hitFlash('#ff5a6e'); shake=24; vib(200); tone(160,0.28,'sawtooth',0.09); setTimeout(()=>tone(110,0.3,'sawtooth',0.08),90);
  let rec=false; if(score>best){ best=score; try{localStorage.setItem('num_best',best);}catch(e){} rec=true; }
  $('best').textContent=best; $('overBest').textContent=best;
  $('overTitle').textContent = rec?'🏆 신기록!':'아깝다!';
  $('overMsg').textContent=msg; $('overScore').textContent=score;
  $('overRec').innerHTML = rec?'<span class="rec">최고 갱신!</span>' : (best>0?('(최고까지 '+(best-score)+'점!)'):'');
  deathCount++;
  // 이어하기(광고) 버튼: 판당 1회 · 점수>0 일 때만
  $('reviveBtn').style.display = (!reviveUsed && score>0) ? 'block' : 'none';
  setTimeout(()=>$('over').classList.remove('hidden'),260);
}
function revive(){
  if(reviveUsed || state!=='over') return; reviveUsed=true;
  playAd(()=>{
    $('over').classList.add('hidden'); $('reviveBtn').style.display='none'; state='play';
    floatText('🔥 이어하기!','#2ec77a'); vib([20,40,20]);
    newRound(true); nextTick(curIsRoll?ROLL_MS:Math.max(220,speed()));
  });
}
function retryGame(){
  // 3번째 죽을 때마다 전면광고 → 재시작
  if(deathCount % 3 === 0){ playInterstitial(()=>start()); }
  else start();
}
addEventListener('pointerdown', e=>{ if(e.target.closest('.btn')) return; if(state!=='play') return; tap(); });
$('startBtn').onclick=()=>start();
$('retryBtn').onclick=()=>retryGame();
$('reviveBtn').onclick=()=>revive();
$('shareBtn').onclick=()=>shareScore();
</script>
</body></html>
