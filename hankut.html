<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 한끗</title>
<style>
  html,body{margin:0;height:100%;background:#0c1522;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;pointer-events:none}
  #vs{font-size:15px;font-weight:800;color:#cfe;min-height:20px}
  #streak{font-size:14px;font-weight:800;color:#ffd34d;min-height:18px;margin-top:1px}
  #wind{font-size:13px;font-weight:700;color:#9fd0ff;margin-top:1px;min-height:16px}
  #hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:3;font-size:18px;font-weight:800;color:#ffe;pointer-events:none;min-height:26px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #ver{position:fixed;left:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;color:#42506a;z-index:4}
  .flash{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:38px;font-weight:900;z-index:8;pointer-events:none;text-align:center;white-space:nowrap;animation:fl 1.2s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}16%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
  .btn{background:#3a7bff;color:#fff;border:none;border-radius:16px;padding:15px 30px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #1f52c0;cursor:pointer}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,16,28,.95);z-index:10;text-align:center;padding:24px}
  .hidden{display:none!important}
  h1{font-size:42px;margin:0;color:#ffd34d;text-shadow:0 0 22px rgba(255,211,77,.5)}
  .sub{color:#bcd;opacity:.92;font-size:15px;line-height:1.55}
  #howto{background:rgba(124,180,255,.1);border:1px solid rgba(124,180,255,.3);border-radius:12px;padding:12px 16px;max-width:330px;font-size:14px;text-align:left;line-height:1.7}
  #changelog{margin-top:6px;font-size:12px;color:#9fe;background:rgba(90,246,180,.1);border:1px solid rgba(90,246,180,.3);border-radius:10px;padding:8px 12px;max-width:330px}
  #overTitle{font-size:38px;font-weight:900}
  #overMsg{font-size:17px}
  #country{font-size:15px;font-weight:800;color:#ffe;min-height:20px}
  #travel{font-size:13px;color:#cfe;opacity:.9}
  #travelBar{width:86%;max-width:320px;height:14px;background:rgba(255,255,255,.09);border-radius:8px;overflow:hidden;border:1px solid rgba(255,211,77,.35);margin:2px auto 0}
  #travelFill{height:100%;background:linear-gradient(90deg,#ffd34d,#7cffb0);width:0%}
  #map{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,16,28,.97);z-index:12;padding:24px;text-align:center}
  #map.show{display:flex}
  #mapGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:340px}
  .mcell{width:52px;height:60px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:1px}
  .mcell.got{background:linear-gradient(135deg,rgba(255,211,77,.22),rgba(124,255,176,.16));border:1px solid rgba(255,211,77,.5)}
  .mcell.lock{filter:grayscale(1);opacity:.32}
  .mcell .mn{font-size:9px;color:#cfe;font-weight:700}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div id="country"></div>
  <div id="vs">나 <b id="scoreMe" style="color:#7cf6ff">0</b> : <b id="scoreAi" style="color:#ff9a5a">0</b> AI</div>
  <div id="streak"></div>
  <div id="wind"></div>
</div>
<div id="hint"></div>
<div id="ver">v0.3 · 세계 여행 + 나라별 동전 수집</div>

<div id="start">
  <h1>모두의 한끗</h1>
  <div class="sub"><b>동전을 던져 목표선에 가장 가까이 붙이는 대결!</b></div>
  <div id="howto">
    🎯 <b>목표</b> — 노란 <b style="color:#ffd34d">골인 라인</b>에 내 동전을 붙여요<br>
    ① <b style="color:#7cf6ff">좌우 조준</b> — 움직일 때 원하는 방향에서 탭<br>
    ② <b style="color:#ffd34d">파워</b> — <b>착지 예측 점(●)</b>이 라인에 오면 탭!<br>
    🏆 <b>상대(AI)보다 라인에 가까우면 승리</b> · 💨 바람 주의
  </div>
  <div id="travel"></div>
  <div id="travelBar"><div id="travelFill"></div></div>
  <button class="btn" id="startBtn">대결 시작</button>
  <button class="btn" id="mapBtn" style="background:#20263c;box-shadow:0 6px 0 #10131f;padding:12px 24px;font-size:16px">🗺️ 세계 지도(동전 도감)</button>
  <div id="changelog">🆕 <b>v0.3</b> · 세계 여행! 이기면 그 나라 동전 수집 → 다음 나라로 · 🗺️ 도감</div>
</div>

<div id="map">
  <h1 style="font-size:30px">🗺️ 세계 동전 도감</h1>
  <div class="sub" id="mapInfo"></div>
  <div id="mapGrid"></div>
  <button class="btn" id="mapClose" style="margin-top:8px">닫기</button>
</div>

<div id="over" class="hidden">
  <div id="overTitle">승리!</div>
  <div class="sub" id="overMsg"></div>
  <div class="sub" id="overStreak" style="color:#ffd34d;font-weight:800"></div>
  <button class="btn" id="reviveBtn" style="background:#2ec77a;box-shadow:0 6px 0 #1a8a52;display:none">🎬 광고 보고 한 번 더 튕기기</button>
  <button class="btn" id="nextBtn" style="margin-top:4px">다음 판</button>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let AC; function tone(f,d,t,g){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),v=AC.createGain(); o.type=t||'square'; o.frequency.value=f; v.gain.value=g||0.06; o.connect(v);v.connect(AC.destination); const s=AC.currentTime;o.start(s);v.gain.setValueAtTime(v.gain.value,s);v.gain.exponentialRampToValueAtTime(0.0001,s+(d||0.1));o.stop(s+(d||0.1)); }catch(e){} }
function chord(b){ [0,4,7].forEach((s,i)=>setTimeout(()=>tone(b*Math.pow(2,s/12),0.14,'triangle',0.06),i*40)); }
function vib(m){ try{navigator.vibrate&&navigator.vibrate(m);}catch(e){} }

const cv=$('cv'), ctx=cv.getContext('2d'); let W=412,H=740,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); const vw=innerWidth,vh=innerHeight; W=412; H=Math.round(W*vh/vw); cv.width=W*DPR;cv.height=H*DPR; cv.style.width=vw+'px';cv.style.height=vh+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

function field(){ return {x:26, y:H*0.13, w:W-52, h:H*0.60}; }
function lineY(){ const f=field(); return f.y + f.h*0.26; }
function originY(){ const f=field(); return f.y + f.h*0.90; }
const CM_H=30;
function toCm(px){ return px*CM_H/field().h; }

let state='start';   // start|aimX|power|mythrow|aithrow|measure|result
let streak=+(localStorage.getItem('hankut_streak')||0);
let best=+(localStorage.getItem('hankut_best')||0);
let scoreMe=0, scoreAi=0;
let wind=0, aimAng=0, aimDir=1, power=0, powDir=1;
let my=null, ai=null, parts=[], shake=0, trail=[], ghost=null;
let reviveUsed=false;
const PREVIEW_POW=0.6;

// 🌍 세계 여행 — 이기면 그 나라 동전 수집 → 다음 나라로 (베팅 없음, 획득만)
const COUNTRIES=[
  {f:'🇰🇷',n:'한국',c:'₩',a:'#fff0b0',b:'#e0a020',e:'#6a4a10',bg:'#1c2b1a'},
  {f:'🇯🇵',n:'일본',c:'¥',a:'#ffdede',b:'#d05a5a',e:'#5a1a1a',bg:'#2a1620'},
  {f:'🇺🇸',n:'미국',c:'$',a:'#d6f5c8',b:'#4a9a5a',e:'#153a20',bg:'#0f2a1c'},
  {f:'🇬🇧',n:'영국',c:'£',a:'#cfd6ff',b:'#5a6ad0',e:'#1a2050',bg:'#161a2e'},
  {f:'🇪🇺',n:'유럽',c:'€',a:'#cfe0ff',b:'#4a7ad0',e:'#12285a',bg:'#122036'},
  {f:'🇨🇳',n:'중국',c:'元',a:'#ffd0d0',b:'#d04040',e:'#4a1010',bg:'#2a1414'},
  {f:'🇮🇳',n:'인도',c:'₹',a:'#ffdcb0',b:'#e08030',e:'#5a2e08',bg:'#2a1e10'},
  {f:'🇷🇺',n:'러시아',c:'₽',a:'#e0d0ff',b:'#8a6ad0',e:'#2a1a5a',bg:'#1e1630'},
  {f:'🇧🇷',n:'브라질',c:'R$',a:'#c8f5d6',b:'#3aa060',e:'#0f3a22',bg:'#0f2a1e'},
  {f:'🇨🇭',n:'스위스',c:'₣',a:'#ffd0d0',b:'#d05050',e:'#4a1414',bg:'#2a1616'},
  {f:'🇹🇭',n:'태국',c:'฿',a:'#f5d0ec',b:'#c060a0',e:'#4a1a3a',bg:'#28162a'},
  {f:'🇻🇳',n:'베트남',c:'₫',a:'#ffecb0',b:'#d0a040',e:'#4a3608',bg:'#2a2410'},
  {f:'🇹🇷',n:'튀르키예',c:'₺',a:'#ffd0d0',b:'#d04a4a',e:'#4a1414',bg:'#2a1616'},
  {f:'🇸🇦',n:'사우디',c:'﷼',a:'#c8f5dc',b:'#3a9a6a',e:'#0f3a26',bg:'#0f2a20'},
  {f:'🇵🇭',n:'필리핀',c:'₱',a:'#cfe0ff',b:'#4a7ad0',e:'#12285a',bg:'#122036'},
  {f:'🇲🇽',n:'멕시코',c:'$',a:'#c8f5d6',b:'#3aa060',e:'#0f3a22',bg:'#0f2a1e'},
  {f:'🇮🇩',n:'인니',c:'Rp',a:'#ffd0d0',b:'#d05a5a',e:'#4a1414',bg:'#2a1616'},
  {f:'🇦🇺',n:'호주',c:'$',a:'#cfe6ff',b:'#5a9ad0',e:'#123a5a',bg:'#12283a'},
  {f:'🇿🇦',n:'남아공',c:'R',a:'#ffecb0',b:'#d0a040',e:'#4a3608',bg:'#2a2410'},
  {f:'🐉',n:'전설',c:'龍',a:'#fff0b0',b:'#ffb020',e:'#6a3a00',bg:'#2a1e08'},
];
let curCountry=clamp(+(localStorage.getItem('hankut_country')||0),0,COUNTRIES.length-1);
let collected=[]; try{collected=JSON.parse(localStorage.getItem('hankut_dex')||'[]');}catch(e){collected=[];}
function CC(){ return COUNTRIES[curCountry]; }
function saveTravel(){ try{localStorage.setItem('hankut_country',curCountry);localStorage.setItem('hankut_dex',JSON.stringify(collected));}catch(e){} }

function newMatch(){
  wind=rnd(-75,75); if(Math.abs(wind)<28) wind=wind<0?-28:28;
  aimAng=-0.32; aimDir=1; power=0; powDir=1;
  my={x:W/2,y:originY(),vx:0,vy:0,stopped:false,dist:0}; ai=null; trail=[]; parts=[]; ghost=null; reviveUsed=false;
  state='aimX';
  $('country').innerHTML='📍 '+CC().f+' <b>'+CC().n+'</b> — '+CC().c+' 동전 획득 도전!';
  $('streak').textContent='🔥 '+streak+' 연승'+(best>0?(' · 최고 '+best):'');
  $('wind').innerHTML='💨 바람 '+(wind>0?'▶':'◀')+' 세기 '+Math.round(Math.abs(wind)/13);
  $('scoreMe').textContent=scoreMe; $('scoreAi').textContent=scoreAi;
  $('hint').textContent='① 좌우로 움직이는 조준선을 탭!';
}
function tap(){
  if(state==='aimX'){ state='power'; $('hint').textContent='② 착지 예측점(●)이 라인에 오면 탭!'; tone(680,0.05,'square',0.09); vib(12); }
  else if(state==='power'){ throwMy(); }
}
addEventListener('pointerdown',e=>{ if(e.target.closest('.btn'))return; if(state==='aimX'||state==='power') tap(); });

function coinSpeed(pw){ return field().h*(0.58 + pw*1.02); }   // 화면 크기에 비례(파워 0.5≈라인)
// 물리 1스텝(예측/실제 공용)
function physStep(c,dt){ const f=field(); const sp0=Math.hypot(c.vx,c.vy);
  c.x+=c.vx*dt; c.y+=c.vy*dt;
  c.vx += wind*dt*clamp(sp0/300,0,1);   // 바람은 빠를 때만 영향(정지 근처엔 X → 무한 드리프트 방지)
  const d=Math.exp(-1.7*dt); c.vx*=d; c.vy*=d;
  if(c.x<f.x+10){c.x=f.x+10;c.vx=Math.abs(c.vx)*0.6;c._b&&c._b();}
  if(c.x>f.x+f.w-10){c.x=f.x+f.w-10;c.vx=-Math.abs(c.vx)*0.6;c._b&&c._b();}
  if(c.y<f.y+10){c.y=f.y+10;c.vy=Math.abs(c.vy)*0.55;c._b&&c._b();}
  if(c.y>f.y+f.h-10){c.y=f.y+f.h-10;c.vy=-Math.abs(c.vy)*0.5;}
  return Math.hypot(c.vx,c.vy);
}
function computeLanding(ang,pw){ const s0=coinSpeed(pw); let c={x:W/2,y:originY(),vx:Math.sin(ang)*s0,vy:-Math.cos(ang)*s0}; let n=0; while(n++<700){ if(physStep(c,1/60)<24) break; } return {x:c.x,y:c.y}; }
function updateGhost(){ const pw=(state==='power')?power:PREVIEW_POW; ghost=computeLanding(aimAng,pw); }

function throwMy(){ const s0=coinSpeed(power)*rnd(0.98,1.02); my.vx=Math.sin(aimAng)*s0+rnd(-12,12); my.vy=-Math.cos(aimAng)*s0; my._b=()=>bounceFx(my); my.stopped=false;
  state='mythrow'; $('hint').textContent=''; tone(880,0.08,'square',0.1); vib([10,30]); }
function bounceFx(c){ tone(300,0.05,'sine',0.08); vib(10); shake=Math.max(shake,5); for(let i=0;i<5;i++){const a=Math.random()*6.28,s=rnd(1,4);parts.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7,c:'#cfe0ff',r:2+Math.random()*2});} }
function dustFx(c){ for(let i=0;i<9;i++){const a=Math.random()*6.28,s=rnd(1,5);parts.push({x:c.x,y:c.y+6,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s*0.6,life:0.9,c:'#8a7a5a',r:2+Math.random()*3});} tone(220,0.09,'sine',0.09); }
function confetti(x,y,n){ const cols=['#ffd34d','#7cffb0','#5ab0ff','#ff8a5a','#c9a3ff','#fff']; for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(2,9);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,life:1.5,c:cols[i%cols.length],r:3+Math.random()*4});} }
function flash(t,c){ const d=document.createElement('div');d.className='flash';d.textContent=t;d.style.color=c;document.body.appendChild(d);setTimeout(()=>d.remove(),1200); }

function throwAi(){
  // 상대 = 실력 스케일 대전(연승할수록 정확). 정직한 대결.
  const skill=clamp(0.3+streak*0.1,0.3,0.9);
  let aiCm=clamp(rnd(1.0,5.0)*(1-skill*0.6), 0.4, 5.5);   // 붙일 수 있는 범위(공정)·연승할수록 정확
  const aiDistPx=aiCm*field().h/CM_H; const side=Math.random()<0.5?-1:1;
  const tx=clamp(my.x+rnd(-60,60), field().x+16, field().x+field().w-16);
  ai={x:tx,y:originY(),vx:rnd(-50,50),vy:-(900+Math.random()*400),targetY:lineY()+side*aiDistPx,t:0,stopped:false,dist:aiDistPx};
  state='aithrow';
}
function stepAi(dt){ ai.t+=dt; const dy=ai.targetY-ai.y; ai.vy+=dy*6*dt; ai.vy*=Math.exp(-3*dt); ai.x+=ai.vx*dt; ai.y+=ai.vy*dt; ai.vx*=Math.exp(-2*dt);
  if(ai.t>1.0 && Math.abs(dy)<3 && Math.abs(ai.vy)<40){ ai.y=ai.targetY; ai.vx=ai.vy=0; ai.stopped=true; ai.dist=Math.abs(ai.y-lineY()); } }
function accLabel(cm){ return cm<0.5?'🎯 명중!':cm<1.5?'👍 굿!':cm<3?'세이프':''; }
function finish(){ const myCm=toCm(my.dist), aiCm=toCm(ai.dist); const win=my.dist<=ai.dist; state='result';
  let travelMsg='';
  if(win){ scoreMe++; streak++; if(streak>best){best=streak;try{localStorage.setItem('hankut_best',best);}catch(e){}} try{localStorage.setItem('hankut_streak',streak);}catch(e){}
    // 🌍 현재 나라 동전 수집 + 다음 나라로 (베팅 없음, 획득만)
    const won=CC(); const isNew=!collected.includes(curCountry); if(isNew) collected.push(curCountry);
    const master=collected.length>=COUNTRIES.length;
    curCountry=(curCountry+1)%COUNTRIES.length; saveTravel();
    $('overTitle').textContent='🏆 승리!'; $('overTitle').style.color='#7cffb0';
    flash(won.f+' '+won.c+' 획득!','#ffd34d'); chord(523); setTimeout(()=>chord(784),150); vib([20,40,20,40,90]); confetti(W/2,H*0.4,70); shake=10; $('reviveBtn').style.display='none';
    travelMsg = master ? ('🌟 세계 정복! 전 '+COUNTRIES.length+'개국 동전 수집 완료!')
      : (isNew?('🪙 '+won.f+' '+won.n+' '+won.c+' 동전 수집! ('+collected.length+'/'+COUNTRIES.length+'개국)<br>다음 목적지 → '+CC().f+' '+CC().n)
              :('▶ 다음 목적지 → '+CC().f+' '+CC().n));
  } else { scoreAi++;
    $('overTitle').textContent='😫 패배!'; $('overTitle').style.color='#ff6a7a'; flash(Math.abs(myCm-aiCm)<0.6?('아깝다! '+Math.abs(myCm-aiCm).toFixed(1)+'cm 차이 😭'):'졌다 💨','#ff6a7a'); tone(160,0.3,'sawtooth',0.1); vib(200); shake=16; streak=0; try{localStorage.setItem('hankut_streak',0);}catch(e){}
    travelMsg='📍 '+CC().f+' '+CC().n+' 재도전! '+CC().c+' 동전이 눈앞이에요';
    $('reviveBtn').style.display=reviveUsed?'none':'block'; }
  const acc=accLabel(myCm);
  $('overMsg').innerHTML=(acc?('<div style="color:#ffd34d;font-weight:800;margin-bottom:4px">'+acc+'</div>'):'')
    +'🎯 목표선까지<br>내 동전 <b style="color:#7cf6ff">'+myCm.toFixed(1)+'cm</b>  vs  상대 <b style="color:#ff9a5a">'+aiCm.toFixed(1)+'cm</b>'
    +'<div style="margin-top:8px;font-size:14px;color:#cfe">'+travelMsg+'</div>';
  $('overStreak').textContent=win?('🔥 '+streak+'연승 중!'+(streak===best&&best>0?' (최고 기록!)':'')):('연승 끊김 · 최고 '+best);
  setTimeout(()=>$('over').classList.remove('hidden'),750);
}

let last=performance.now();
function loop(now){ requestAnimationFrame(loop); let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(state==='aimX'){ aimAng+=aimDir*1.5*dt; if(aimAng>0.32){aimAng=0.32;aimDir=-1;} if(aimAng<-0.32){aimAng=-0.32;aimDir=1;} updateGhost(); }
  else if(state==='power'){ power+=powDir*1.1*dt; if(power>1){power=1;powDir=-1;} if(power<0){power=0;powDir=1;} updateGhost(); }
  else if(state==='mythrow'){ trail.push({x:my.x,y:my.y}); if(trail.length>16)trail.shift(); if(physStep(my,dt)<26){my.vx=my.vy=0;my.stopped=true;my.dist=Math.abs(my.y-lineY()); dustFx(my); throwAi();} }
  else if(state==='aithrow'){ stepAi(dt); if(ai.stopped){ dustFx(ai); state='measure'; setTimeout(finish,1100);} }
  for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.022; } parts=parts.filter(p=>p.life>0);
  draw();
}
function drawCoin(c,label,lcol,col,sym){ const r=17;
  ctx.fillStyle='rgba(0,0,0,.30)'; ctx.beginPath(); ctx.ellipse(c.x,c.y+r-2,r*0.9,4,0,0,6.28); ctx.fill();
  const g=ctx.createRadialGradient(c.x-5,c.y-6,3,c.x,c.y,r); g.addColorStop(0,col.a); g.addColorStop(1,col.b);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,6.28); ctx.fill();
  ctx.strokeStyle=col.e; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,6.28); ctx.stroke();
  const s=sym||'₩'; ctx.fillStyle=col.e; ctx.font='bold '+(s.length>1?11:15)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(s,c.x,c.y+1);
  ctx.fillStyle=lcol; ctx.font='bold 12px system-ui'; ctx.fillText(label,c.x,c.y-r-8);
}
function draw(){ ctx.clearRect(0,0,W,H);
  let sx=0,sy=0; if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=0.86;if(shake<.4)shake=0;}
  ctx.save(); ctx.translate(sx,sy);
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,CC().bg); bg.addColorStop(1,'#0a1018'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const f=field(), ly=lineY();
  // 레인(보드)
  ctx.fillStyle='rgba(90,140,200,.08)'; roundRect(f.x,f.y,f.w,f.h,16); ctx.fill();
  ctx.strokeStyle='rgba(120,170,230,.4)'; ctx.lineWidth=3; roundRect(f.x,f.y,f.w,f.h,16); ctx.stroke();
  // 골인 존(가까울수록 초록) — "여기 붙이면 좋다"를 시각화
  for(let i=4;i>=1;i--){ const bw=f.h*0.035*i; ctx.fillStyle='rgba(124,255,176,'+(0.05*(5-i)).toFixed(3)+')'; ctx.fillRect(f.x+6, ly-bw, f.w-12, bw*2); }
  // 골인 라인
  ctx.strokeStyle='#ffd34d'; ctx.lineWidth=4; ctx.setLineDash([12,7]); ctx.beginPath(); ctx.moveTo(f.x+8,ly); ctx.lineTo(f.x+f.w-8,ly); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#ffd34d'; ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.fillText('🎯 골인 라인 (가까울수록 승리)', W/2, ly-10);
  // 던지는 곳
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='11px system-ui'; ctx.fillText('▲ 여기서 던짐', W/2, originY()+30);
  // 바람 화살표
  if(state==='aimX'||state==='power'){ ctx.save(); ctx.globalAlpha=.6; ctx.strokeStyle='#9fd0ff'; ctx.fillStyle='#9fd0ff'; ctx.lineWidth=3; const wy=f.y+18, wl=clamp(Math.abs(wind)/2.6,14,72)*(wind<0?-1:1), wcx=W/2; ctx.beginPath();ctx.moveTo(wcx-wl,wy);ctx.lineTo(wcx+wl,wy);ctx.stroke(); ctx.beginPath();ctx.moveTo(wcx+wl,wy);ctx.lineTo(wcx+wl-(wind<0?-9:9),wy-5);ctx.lineTo(wcx+wl-(wind<0?-9:9),wy+5);ctx.closePath();ctx.fill(); ctx.restore(); }
  // 조준 가이드
  if(state==='aimX'){ const L=80; ctx.strokeStyle='#7cf6ff'; ctx.lineWidth=3; ctx.setLineDash([7,7]); ctx.beginPath(); ctx.moveTo(W/2,originY()); ctx.lineTo(W/2+Math.sin(aimAng)*L, originY()-Math.cos(aimAng)*L); ctx.stroke(); ctx.setLineDash([]); }
  // 착지 예측 마커 (핵심! 뭘 조준하는지 보여줌)
  if((state==='aimX'||state==='power')&&ghost){ const pulse=0.55+0.35*Math.sin(performance.now()/180); const near=Math.abs(ghost.y-ly)<f.h*0.05;
    ctx.save(); ctx.globalAlpha=pulse; ctx.strokeStyle=near?'#7cffb0':'#ff5ce1'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.arc(ghost.x,ghost.y,14,0,6.28); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=near?'#7cffb0':'#ff5ce1'; ctx.beginPath(); ctx.arc(ghost.x,ghost.y,4,0,6.28); ctx.fill();
    ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.fillText('예상 착지', ghost.x, ghost.y-20); ctx.restore(); }
  // 파워 게이지
  if(state==='power'){ const bw=210,bh=18,bx=W/2-bw/2,by=originY()+46; ctx.fillStyle='rgba(255,255,255,.12)'; roundRect(bx,by,bw,bh,9); ctx.fill();
    const pg=ctx.createLinearGradient(bx,0,bx+bw,0); pg.addColorStop(0,'#7cffb0');pg.addColorStop(.6,'#ffd34d');pg.addColorStop(1,'#ff5a5a'); ctx.fillStyle=pg; roundRect(bx,by,bw*power,bh,9); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2; roundRect(bx,by,bw,bh,9); ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('약하게',bx,by-6); ctx.textAlign='right';ctx.fillText('세게',bx+bw,by-6); }
  // 궤적
  if(trail.length){ ctx.strokeStyle='rgba(255,211,77,.4)'; ctx.lineWidth=3; ctx.beginPath(); trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); }
  // 측정 자
  if(state==='measure'||state==='result'){ measureLine(my,'#7cf6ff'); if(ai&&ai.stopped) measureLine(ai,'#ff9a5a'); }
  // 동전
  if(ai&&(state==='aithrow'||state==='measure'||state==='result')) drawCoin(ai,'AI','#ff9a5a',{a:'#ffe6a0',b:'#c98a2a',e:'#5a3a10'},'?');
  if(my) drawCoin(my,'나','#7cf6ff',{a:CC().a,b:CC().b,e:CC().e},CC().c);
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill(); } ctx.globalAlpha=1;
  ctx.restore();
}
function measureLine(c,col){ const ly=lineY(); ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x,ly); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=col; ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.fillText(toCm(Math.abs(c.y-ly)).toFixed(1)+'cm', c.x+18, (c.y+ly)/2); ctx.restore(); }
function roundRect(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
requestAnimationFrame(loop);

function begin(){ try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} scoreMe=0;scoreAi=0; $('start').classList.add('hidden'); $('over').classList.add('hidden'); newMatch(); }
function nextMatch(){ $('over').classList.add('hidden'); newMatch(); }
function revive(){ if(reviveUsed)return; reviveUsed=true; $('over').classList.add('hidden'); $('reviveBtn').style.display='none'; flash('🎬 한 번 더 튕겨요!','#2ec77a'); vib([20,40,20]);
  const ly=lineY(); my.y=ly+(my.y>ly?1:-1)*Math.max(4,Math.abs(my.y-ly)*0.35); my.dist=Math.abs(my.y-ly); setTimeout(finish,500); }
function renderTravel(){
  $('travel').innerHTML='🌍 세계 여행 <b style="color:#ffd34d">'+collected.length+'/'+COUNTRIES.length+'</b>개국 수집 · 다음 → '+CC().f+' <b>'+CC().n+'</b>';
  $('travelFill').style.width=Math.round(collected.length/COUNTRIES.length*100)+'%';
}
function renderMap(){
  $('mapInfo').innerHTML='이긴 나라의 동전을 수집해요 · <b style="color:#ffd34d">'+collected.length+'/'+COUNTRIES.length+'</b>개국';
  $('mapGrid').innerHTML=COUNTRIES.map((c,i)=>{ const got=collected.includes(i);
    return '<div class="mcell '+(got?'got':'lock')+'">'+c.f+'<div style="font-size:15px">'+(got?c.c:'🔒')+'</div><div class="mn">'+c.n+'</div></div>'; }).join('');
}
$('mapBtn').onclick=()=>{ renderMap(); $('map').classList.add('show'); };
$('mapClose').onclick=()=>$('map').classList.remove('show');
$('startBtn').onclick=begin; $('nextBtn').onclick=nextMatch; $('reviveBtn').onclick=revive;
$('streak').textContent='';
renderTravel();
</script>
</body></html>
