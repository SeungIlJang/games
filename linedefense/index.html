<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>모두의 타워디펜스</title>
  <style>html,body{background:#0d1018;height:100%;margin:0;overflow:hidden}#game{width:100vw;height:100vh}#rotate{z-index:9999;color:#cfe0ff;text-align:center;background:#0d1018;flex-direction:column;justify-content:center;align-items:center;padding:24px;font-family:sans-serif;display:none;position:fixed;top:0;bottom:0;left:0;right:0}#rotate .ico{font-size:72px;animation:1.6s ease-in-out infinite spin}#rotate .t{margin-top:18px;font-size:24px;font-weight:700}#rotate .s{color:#8892b0;margin-top:10px;font-size:15px;line-height:1.6}@keyframes spin{0%,to{transform:rotate(0)}50%{transform:rotate(90deg)}}@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}</style>
  <script type="module" crossorigin src="./assets/index-BfSFy2bi.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="ico">📱↻</div>
    <div class="t">가로로 돌려주세요</div>
    <div class="s">모두의 타워디펜스는 가로 화면 게임이에요.<br/>폰을 옆으로 돌리면 꽉 찬 화면으로 즐길 수 있어요.<br/>(설치한 앱은 자동으로 가로가 돼요)</div>
  </div>
  <script>
    // 웹에서 첫 터치 시 전체화면 + 가로 잠금 시도(안드 크롬 지원, iOS 사파리는 미지원 → 안내로 대체)
    (function () {
      var tried = false;
      function goLandscape() {
        if (tried) return; tried = true;
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        try {
          var p = fs ? fs.call(el) : Promise.resolve();
          Promise.resolve(p).then(function () {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function () {});
            }
          }).catch(function () {});
        } catch (e) { /* 미지원 환경은 조용히 무시 */ }
      }
      window.addEventListener('pointerdown', goLandscape, { once: true });
      window.addEventListener('touchstart', goLandscape, { once: true });
    })();
  </script>
</body>
</html>
