# 이 레포의 일부 앱은 다른 저장소의 빌드 산출물이다(linedefense/, toilet.html, monsteridle/).
# 소스를 고치고 여기로 옮기는 걸 빠뜨리면 앱은 옛 사본을 계속 받는데 아무 신호가 없다.
# 그 조용한 실패를 메일 오는 실패로 바꾼다.
name: OTA freshness

# push 트리거는 뺐다. 이 레포는 푸시가 잦아서(하루 4~8회) 그때마다 돌면 메일이 쏟아지고,
# 그러면 진짜 신호를 안 보게 된다. 하루 1회로 충분하다 — 잡으려는 건 '며칠째 잊은 배포'다.
on:
  schedule:
    # 매일 00:10 UTC (한국 09:10)
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-ota-freshness.mjs
        env:
          # 미인증 GitHub API 는 시간당 60회라 금방 막힌다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
